<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 单词悬浮助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ticker" id="ticker">
  <div class="hover-tools">
    <span class="brand">ENGLISH</span>
    <span class="status" id="status">等待网页连接</span>
    <button class="hide" id="hide" title="隐藏悬浮窗">×</button>
  </div>
  <section class="word-stage" aria-live="polite" aria-atomic="true">
    <div class="word-pair" id="wordPair">
      <span class="live-dot" id="liveDot"></span>
      <span class="current-word" id="currentWord">Ready?</span>
      <span class="pair-divider" id="pairDivider"></span>
      <span class="current-meaning" id="currentMeaning"></span>
    </div>
  </section>
  <span class="progress" id="progress"></span>
</main>
<script src="renderer.js"></script>
</body>
</html>
