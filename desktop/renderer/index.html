<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 浮动字幕</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ticker" id="ticker">
  <div class="hover-tools">
    <span class="brand">ENGLISH</span>
    <span class="status" id="status">等待网页连接</span>
    <button class="hide" id="hide" title="隐藏悬浮字幕">×</button>
  </div>
  <section class="lyrics-viewport" aria-live="polite">
    <div class="lyric-track" id="lyricTrack">
      <div class="lyric-row edge" id="row0"></div>
      <div class="lyric-row adjacent" id="row1"></div>
      <div class="lyric-row current" id="row2">
        <span class="live-dot" id="liveDot"></span>
        <span class="current-word" id="currentWord">Ready?</span>
        <span class="current-meaning" id="currentMeaning"></span>
      </div>
      <div class="lyric-row adjacent" id="row3"></div>
      <div class="lyric-row edge" id="row4"></div>
    </div>
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
  </section>
  <span class="progress" id="progress"></span>
</main>
<script src="renderer.js"></script>
</body>
</html>
