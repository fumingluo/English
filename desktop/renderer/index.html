<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 浮动字幕</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ticker" id="ticker">
  <div class="hover-tools">
    <span class="brand">ENGLISH</span>
    <span class="status" id="status">等待网页连接</span>
    <button class="hide" id="hide" title="隐藏悬浮字幕">×</button>
  </div>
  <div class="line english-line">
    <span class="live-dot" id="liveDot"></span>
    <div class="marquee-viewport"><div class="marquee" id="marquee"><span id="segment">Ready?</span></div></div>
  </div>
  <div class="line chinese-line" id="translation">请在网页「连续听」中连接同步</div>
  <span class="progress" id="progress"></span>
</main>
<script src="renderer.js"></script>
</body>
</html>
