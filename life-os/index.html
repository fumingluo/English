<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life OS · 个人工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#263b29;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:12px 0}h2{font-size:18px;margin:0 0 12px}small{color:#68766b}.card{background:white;border:1px solid #e4e8df;border-radius:18px;padding:20px;margin:16px 0}progress{width:100%;height:12px;accent-color:#426b45}button,a,input,select{font:inherit}button,a{cursor:pointer}button{border:0;border-radius:9px;padding:8px 12px;background:#e7eee4;color:#263b29}a{color:#426b45}label{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}label:last-child{border:0}input[type=checkbox]{width:21px;height:21px;accent-color:#426b45}.done{text-decoration:line-through;color:#879087}.taskname{flex:1}.row{display:flex;gap:8px;flex-wrap:wrap}input[type=text],input[type=url],select,textarea{min-width:0;padding:10px;border:1px solid #dce3d8;border-radius:9px;background:white}input[type=text]{flex:1}textarea{width:100%;min-height:90px}summary{cursor:pointer}#status{font-size:13px;color:#68766b}
</style><main><header><b>LIFE OS / 个人工作台</b><small id="date"></small></header><h1>今日行动</h1><section class="card"><h2 id="count"></h2><progress id="progress" max="1"></progress><small>每日任务完成率 · 当前为手动打卡</small></section><section class="card"><h2>实时学习进度</h2><p id="learningLive" aria-live="polite"></p><small>今日处理卡片包含新学和复习，不等同于新增单词。到期任务根据本机记录自动更新。</small></section><div id="groups"></div><section class="card"><h2>添加今日任务</h2><form id="add" class="row"><input id="name" type="text" required maxlength="100" placeholder="需要完成什么？"><select id="category"><option>今日三件事</option><option>每日必修</option><option>工作执行</option></select><button>添加</button></form></section><section class="card"><h2>项目入口</h2><p><a href="../index.html">Daily English →</a></p><div id="links"></div><details><summary>配置其他项目入口</summary><p>经典研读 <input id="reading" type="url" placeholder="https://"></p><p>关系台 <input id="crm" type="url" placeholder="https://"></p><button id="saveLinks">保存入口</button></details></section><section class="card"><h2>晚间复盘</h2><textarea id="review" placeholder="今天完成了什么？明天如何改进？"></textarea><small id="status">仅保存在本机浏览器，不会修改原项目数据。</small></section></main><script>
const key='life-os:v1', day=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}state.days??={};state.links??={};const defaults=[['每日必修','英语学习 2 小时'],['每日必修','学习新单词 20 个'],['每日必修','复习到期单词与经文'],['每日必修','经书阅读'],['每日必修','健身或恢复训练'],['工作执行','检查今日客户跟进与活动安排']];let date=day();function current(){return state.days[date]??=( {tasks:defaults.map(([category,name],i)=>({id:'d'+i,category,name,done:false})),review:''})}function save(){try{localStorage.setItem(key,JSON.stringify(state));document.querySelector('#status').textContent='已保存至本机浏览器'}catch{document.querySelector('#status').textContent='保存失败，请检查浏览器存储权限'}}function render(){document.querySelector('#date').textContent=date;let tasks=current().tasks,n=tasks.filter(t=>t.done).length;document.querySelector('#count').textContent=n+' / '+tasks.length+' 项已完成';document.querySelector('#progress').value=tasks.length?n/tasks.length:0;let root=document.querySelector('#groups');root.replaceChildren();for(let category of ['今日三件事','每日必修','工作执行']){let box=document.createElement('section');box.className='card';let h=document.createElement('h2');h.textContent=category;box.append(h);let list=tasks.filter(t=>t.category===category);if(!list.length){let p=document.createElement('small');p.textContent='尚未安排，请添加今日重点。';box.append(p)}for(let t of list){let row=document.createElement('label'),check=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');check.type='checkbox';check.checked=t.done;check.onchange=()=>{t.done=check.checked;save();render()};span.className='taskname'+(t.done?' done':'');span.textContent=t.name;del.type='button';del.textContent='移除';del.onclick=e=>{e.preventDefault();current().tasks=current().tasks.filter(x=>x.id!==t.id);save();render()};row.append(check,span,del);box.append(row)}root.append(box)}document.querySelector('#review').value=current().review}
document.querySelector('#add').onsubmit=e=>{e.preventDefault();let name=document.querySelector('#name'),category=document.querySelector('#category').value;if(!name.value.trim())return;if(category==='今日三件事'&&current().tasks.filter(t=>t.category===category).length>=3){alert('今日重点最多三项');return}current().tasks.push({id:crypto.randomUUID(),name:name.value.trim(),category,done:false});name.value='';save();render()};document.querySelector('#review').oninput=e=>{current().review=e.target.value;save()};function links(){let root=document.querySelector('#links');root.replaceChildren();for(let [id,title] of [['reading','经典研读'],['crm','关系台']]){let p=document.createElement('p'),a=document.createElement('a');document.getElementById(id).value=state.links[id]||'';if(state.links[id]){a.href=state.links[id];a.textContent=title+' →';p.append(a)}else p.textContent=title+' · 待配置';root.append(p)}}document.querySelector('#saveLinks').onclick=()=>{let next={};for(let id of ['reading','crm']){let value=document.getElementById(id).value.trim();if(value){try{let u=new URL(value);if(u.protocol!=='https:')throw 0;next[id]=u.href}catch{alert('请输入有效 HTTPS 地址');return}}}state.links=next;save();links()};render();links();setInterval(()=>{if(day()!==date){date=day();render()}},15000);
function refreshLearning(){let panel=document.getElementById('learningLive');try{let raw=localStorage.getItem('dailyEnglish.v3')||localStorage.getItem('dailyEnglish.v2');if(!raw){panel.textContent='尚未读取到本机英语学习记录，请先打开英语应用。';return}let data=JSON.parse(raw),entries=Object.entries(data.cards||{}).filter(([id,c])=>c&&c.seen),now=Date.now();let due=entries.filter(([id,c])=>{let t=Number(c.dueAt)||Date.parse(c.due);return Number.isFinite(t)&&t<=now});let reviewed=entries.filter(([id,c])=>{let d=new Date(c.last_review||c.last);return Number.isFinite(d.getTime())&&d.getFullYear()===new Date().getFullYear()&&d.getMonth()===new Date().getMonth()&&d.getDate()===new Date().getDate()});let words=entries.filter(([id])=>!id.startsWith('bible:'));panel.textContent='累计英语单词 '+words.length+' · 今日处理英语卡 '+reviewed.filter(([id])=>!id.startsWith('bible:')).length+' · 今日处理圣经卡 '+reviewed.filter(([id])=>id.startsWith('bible:')).length+' · 当前到期 '+due.length+'（英语 '+due.filter(([id])=>!id.startsWith('bible:')).length+' / 圣经 '+due.filter(([id])=>id.startsWith('bible:')).length+'）';let task=current().tasks.find(t=>t.id==='d2');if(task&&task.done!==(due.length===0)){task.done=due.length===0;save();render()}}catch(e){panel.textContent='学习数据暂不可读取，原始记录未修改。'}}window.addEventListener('storage',refreshLearning);window.addEventListener('focus',refreshLearning);setInterval(refreshLearning,15000);refreshLearning();</script></html>
