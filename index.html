/* Typing-tutor style Bible practice */
.typing-stage{position:relative;border:1.5px solid #dfe6dc;border-radius:16px;background:#fbfcf9;padding:18px 15px;min-height:150px;overflow:hidden;cursor:text;}
.typing-display{position:relative;z-index:1;font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,5vw,23px);line-height:2.45;color:#9ba49a;white-space:normal;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;}
.typing-word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 .12em .24em 0;}
.typing-letters{display:inline-flex;white-space:pre;}
.typing-char{display:inline-block;min-width:.56em;text-align:center;border-radius:4px;transition:background .08s,color .08s;}
.typing-char.done{color:#4c7950;}
.typing-char.pending{color:#9ba49a;}
.typing-char.current{color:#203a23;background:#e4f0df;box-shadow:0 2px 0 #769b72;font-weight:800;}
.typing-char.current.error{color:#8f352d;background:#f8deda;box-shadow:0 2px 0 #c77c72;}
.typing-gloss{display:block;min-height:15px;margin-top:1px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:10px;line-height:1.2;color:#557b53;white-space:nowrap;}
.typing-space{white-space:pre;}
.typing-capture{position:absolute;z-index:3;inset:0;width:100%;height:100%;opacity:.012;color:transparent;background:transparent;border:0;outline:0;caret-color:transparent;font-size:16px;cursor:text;}
.typing-capture::selection{background:transparent;}
.typing-instruction{font-size:11px;color:#818a80;margin:10px 2px 0;line-height:1.6;}
.typing-live-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;}
.typing-translation{margin-top:12px;padding:14px;border-radius:13px;background:#edf4e9;border:1px solid #dbe8d7;}
.typing-translation strong{display:block;font-size:11px;color:#52744f;margin-bottom:5px;}
.typing-translation p{margin:0;font-size:15px;line-height:1.8;color:#334b32;}
.typing-focus-btn{margin-top:10px;width:100%;}

.swipe-right{animation:swipeRight .24s ease forwards}.swipe-left{animation:swipeLeft .24s ease forwards}
@keyframes swipeRight{45%{background:#e6f5e5;box-shadow:0 0 0 3px #7dbb78,0 10px 28px #4b9a4938;transform:translateX(16px) rotate(2deg)}100%{background:#e6f5e5;box-shadow:0 0 0 3px #7dbb78,0 10px 28px #4b9a4938;transform:translateX(34px) rotate(3deg);opacity:.35}}

cument.getElementById('typingCapture');stage.addEventListener('click',e=>{if(!e.target.closest('[data-action="bible-word-play"]'))input.focus()});input.addEventListener('input',()=>{let raw=input.value;input.value='';for(let ch of Array.from(raw)){typeBibleCharacter(ch);if(typingError)break}});input.addEventListener('keydown',e=>{if(e.key==='Backspace'){e.preventDefault();backspaceBibleCharacter()}else if(e.key==='Enter'){e.preventDefault()}});document.getElementById('passageSelect').addEventListener('change',e=>{clearTimeout(bibleAdvanceTimer);state.bible.passage=e.target.value;state.bible.verse=0;typingError='';typingErrorCount=0;save();render()})}
function mineView(app){let learned=Object.keys(state.cards).filter(k=>state.cards[k]&&state.cards[k].seen).length,accuracy=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0;app.innerHTML='<div class="card"><h2 class="section-title">我的学习档案</h2><div class="stats-row"><div class="stat"><strong>🔥 '+(state.stats.streak||0)+'</strong><span>连续学习天数</span></div><div class="stat"><strong>📚 '+learned+'</strong><span>累计词条</span></div><div class="stat"><strong>🎯 '+accuracy+'%</strong><span>练习正确率</span></div></div><label class="label" for="quickLevel">英语水平</label><select class="field" id="quickLevel"><option '+(state.level==='初级'?'selected':'')+'>初级</option><option '+(state.level==='中级'?'selected':'')+'>中级</option><option '+(state.level==='高级'?'selected':'')+'>高级</option></select><label class="row" style="margin:14px 0"><span>打开单词时自动播放美式发音</span><input id="autoplay" type="checkbox" '+(state.autoPlay?'checked':'')+'></label><button class="btn primary" style="width:100%" data-action="save-settings">保存设置</button></div><div class="card"><h3>添加自定义记忆词组</h3><form id="phraseForm" class="form-grid"><div><label class="label" for="cw">英文单词 / 词组</label><input class="field" id="cw" required maxlength="80" placeholder="例如：take your time"></div><div><label class="label" for="cm">中文释义</label><input class="field" id="cm" required maxlength="120" placeholder="例如：慢慢来，不着急"></div><div><label class="label" for="ce">例句（可选）</label><input class="field" id="ce" maxlength="180" placeholder="Take your time. We are not in a hurry."></div><button class="btn primary">＋ 保存词组</button></form></div><div class="card"><div class="row"><strong>我的词组 · '+state.custom.length+'</strong><span class="tag">本机保存</span></div>'+(state.custom.length?state.custom.slice().reverse().map(w=>'<div class="phrase"><div class="row"><strong>'+esc(w.word)+'</strong><button class="btn danger small" data-action="delete-word" data-id="'+esc(w.id)+'">删除</button></div><div class="small muted">'+esc(w.meaning)+' · '+esc(w.level||'自定义')+'</div></div>').join(''):'<p class="empty">还没有添加自定义词组。</p>')+'</div><div class="card"><h3>圣经经文库</h3><p class="small muted" style="line-height:1.7">目前内置精选经文与完整启示录（首次打开时联网加载）。你也可以导入扩展经文 JSON，增加更多书卷章节。每节至少需要 ref（经文编号）、en（英文原文）、zh（中文对照）；v 可选，格式为 [[英文词汇, 中文释义]]。<br>示例：{\"id\":\"john4\",\"title\":\"约翰福音 John · 4\",\"verses\":[{\"ref\":\"John 4:1\",\"en\":\"英文经文\",\"zh\":\"中文对照\",\"v\":[[\"word\",\"词义\"]]}]}<br><a href="https://ebible.org/find/details.php?id=engwebp" target="_blank" rel="noopener">查看 WEB 英文圣经文本下载</a></p><label class="btn secondary" style="display:block;text-align:center">导入经文 JSON<input type="file" id="importBible" accept="application/json" hidden></label></div><div class="card"><h3>备份与数据</h3><p class="small muted" style="line-height:1.7">单词记录、复习日期、经文练习进度和自定义词组保存在当前浏览器。建议定期导出备份。</p><div class="actions"><button class="btn secondary" data-action="export">导出学习数据</button><label class="btn quiet" style="text-align:center">导入备份<input type="file" id="importFile" accept="application/json" hidden></label><button class="btn danger" data-action="reset-data">清空学习数据</button></div></div>'}
function addBibleWord(word,meaning){let id='bible-'+word.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(allWords().some(w=>w.id===id)){showToast('这个词已经在你的词库中');return}state.custom.push({id:id,word:word,phonetic:'',meaning:meaning,level:state.level,category:'圣经词汇',en:getVerse().en,zh:getVerse().zh,isCustom:true});save();showToast('已加入个人词库和复习系统')}
function action(b){let a=b.dataset.action;
if(a==='say'){let w=wordById(b.dataset.id);if(w)say(w.word)}
else if(a==='example'){let w=wordById(b.dataset.id);if(w)say(w.en||w.word)}
else if(a==='reveal'){let w=getDaily()[state.daily.index];if(w){say(w.word);state.cards[w.id]=Object.assign({},state.cards[w.id]||{},{revealed:true});save();render()}}
else if(a==='rate'){let w=getDaily()[state.daily.index];if(w)schedule(w.id,b.dataset.rating,false)}
else if(a==='skip'){state.daily.index++;injectDueRelearn();save();render()}
else if(a==='go-review'){state.view='review';render()}
else if(a==='continue-learning')continueLearning()
else if(a==='start-review'){state.review={ids:dueWords().map(w=>w.id),index:0,active:true};render()}
else if(a==='review-reveal'){let id=state.review.ids[state.review.index],w=wordById(id),c=state.cards[id]||{};if(w)say(w.word);state.cards[id]=Object.assign({},c,{reviewRevealed:true});save();render()}
else if(a==='review-rate'){let id=state.review.ids[state.review.index];if(id){let c=state.cards[id]||{};schedule(id,b.dataset.rating,true);if(state.cards[id])delete state.cards[id].reviewRevealed;}}
else if(a==='end-review'){state.review.active=false;save();render()}
else if(a==='mode'){state.listenMode=b.dataset.mode;question=null;save();render()}
else if(a==='start')newQuestion()
else if(a==='play'&&question)say(question.word.word)
else if(a==='choose'&&question&&!question.done){let q=question;q.selected=b.dataset.id;q.correct=q.selected===q.word.id;q.done=true;state.stats.attempts++;if(q.correct)state.stats.correct++;markActivity();render();advanceListenAfterAnswer(q)}
else if(a==='check'&&question&&!question.done){let q=question;q.correct=document.getElementById('dictation').value.trim().toLowerCase()===q.word.word.toLowerCase();q.done=true;state.stats.attempts++;if(q.correct)state.stats.correct++;markActivity();render();advanceListenAfterAnswer(q)}
else if(a==='next')newQuestion()
else if(a==='bible-word-play'){let word=b.dataset.word,meaning=b.dataset.meaning;say(word);showToast(word+'：'+meaning)}
else if(a==='load-revelation')loadRevelation()
else if(a==='verse-play'){let v=getVerse();if(v)say(v.en)}
else if(a==='verse-add-words'){let v=getVerse(),n=0;(v.v||[]).forEach(t=>{let id='bible-'+t[0].toLowerCase().replace(/[^a-z0-9]+/g,'-');if(!allWords().some(w=>w.id===id)){state.custom.push({id:id,word:t[0],phonetic:'',meaning:t[1],level:state.level,category:'圣经词汇',en:v.en,zh:v.zh,isCustom:true});n++}});save();showToast(n?'已添加 '+n+' 个经文词汇':'本节词汇已经全部加入')}
else if(a==='add-one-word')addBibleWord(b.dataset.word,b.dataset.meaning)
else if(a==='focus-typing'){let el=document.getElementById('typingCapture');if(el)el.focus()}
else if(a==='restart-typing'){clearTimeout(bibleAdvanceTimer);let v=getVerse();state.bible.drafts[v.ref]='';typingError='';typingErrorCount=0;save();render();let el=document.getElementById('typingCapture');if(el)el.focus()}
else if(a==='prev-verse'){clearTimeout(bibleAdvanceTimer);state.bible.verse=Math.max(0,state.bible.verse-1);save();render()}
else if(a==='next-verse'){clearTimeout(bibleAdvanceTimer);let p=getPassage();state.bible.verse=Math.min(p.verses.length-1,state.bible.verse+1);save();render()}
else if(a==='save-settings'){state.level=document.getElementById('quickLevel').value;state.autoPlay=document.getElementById('autoplay').checked;state.daily.date='';save();showToast('设置已保存');render()}
else if(a==='delete-word'){state.custom=state.custom.filter(w=>w.id!==b.dataset.id);state.daily.date='';save();render()}
else if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='daily-english-backup.json';link.click();URL.revokeObjectURL(url)}
else if(a==='reset-data'){if(confirm('确定清空本机学习数据、复习记录和自定义词组吗？此操作无法撤销。')){localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);state=blank();render()}}
}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;question=null;save();render()});
document.getElementById('app').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){action(b);return}let card=e.target.closest('.minimal-word-card[data-swipe-card]');if(card&&Date.now()>suppressWordCardClickUntil){let w=wordById(card.dataset.swipeId);if(w)say(w.word)}});
document.getElementById('app').addEventListener('pointerdown',e=>{let area=e.target.closest('[data-swipe-card]');if(!area||e.pointerType==='mouse')return;swipeGesture={area:area,x:e.clientX,y:e.clientY,id:area.dataset.swipeId,mode:area.dataset.swipeMode,pointerId:e.pointerId};});
document.addEventListener('pointerup',e=>{if(!swipeGesture)return;let g=swipeGesture;swipeGesture=null;if(e.pointerId!==g.pointerId||!g.area.isConnected)return;let dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.hypot(dx,dy)<45)return;suppressWordCardClickUntil=Date.now()+450;let direction=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down');if(direction==='right'||direction==='left')g.area.classList.add(direction==='right'?'swipe-right':'swipe-left');setTimeout(()=>{if(!g.area.isConnected)return;if(direction==='down'){goPreviousWord(g.mode);return}let rating=direction==='right'?'known':direction==='left'?'unknown':'vague';schedule(g.id,rating,g.mode==='review')},direction==='right'||direction==='left'?210:0);});
document.addEventListener('pointercancel',()=>{swipeGesture=null});
document.getElementById('app').addEventListener('submit',e=>{if(e.target.id!=='phraseForm')return;e.preventDefault();let word=document.getElementById('cw').value.trim(),meaning=document.getElementById('cm').value.trim(),en=document.getElementById('ce').value.trim();if(!word||!meaning)return;getDaily();let addedId='custom-'+Date.now();state.custom.push({id:addedId,word:word,phonetic:'',meaning:meaning,level:state.level,category:'自定义词组',en:en||word,zh:meaning,isCustom:true});if(state.daily.date===today()&&!state.daily.ids.includes(addedId))state.daily.ids.splice(Math.max(0,Number(state.daily.index)||0),0,addedId);save();markActivity();render()});
document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data.cards||!data.stats)throw new Error('invalid');state=Object.assign(blank(),data);save();render();showToast('备份导入成功')}catch(err){showToast('备份文件格式不正确')}};reader.readAsText(e.target.files[0])}else if(e.target.id==='importBible'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result),list=Array.isArray(data)?data:data.passages;if(!Array.isArray(list)||!list.length)throw new Error('invalid');let valid=list.filter(p=>p&&p.id&&p.title&&Array.isArray(p.verses)&&p.verses.length&&p.verses.every(v=>v.ref&&v.en&&v.zh));if(!valid.length)throw new Error('invalid');let merged=allPassages().filter(p=>!valid.some(v=>v.id===p.id));state.bible.extraPassages=merged.filter(p=>!BIBLE.some(b=>b.id===p.id)).concat(valid);state.bible.passage=valid[0].id;state.bible.verse=0;save();state.view='bible';render();showToast('已导入 '+valid.length+' 个经文段落')}catch(err){showToast('经文 JSON 格式不正确，请检查字段是否齐全')}};reader.readAsText(e.target.files[0])}});
if(state.daily.date!==today()){state.daily.date='';state.daily.ids=[];state.daily.index=0;save()}
if(state.view==='speak')state.view='learn';
render();
if(!Array.isArray(state.bible.revelationVerses)||state.bible.revelationVerses.length<400)loadRevelation();
</script>
