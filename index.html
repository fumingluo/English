her into a bed of great oppression, unless they repent of her works.","zh":"","v":[]},{"ref":"Revelation 2:23","en":"I will kill her children with Death, and all the assemblies will know that I am he who searches the minds and hearts. I will give to each one of you according to your deeds.","zh":"","v":[]},{"ref":"Revelation 2:24","en":"But to you I say, to the rest who are in Thyatira—as many as don’t have this teaching, who don’t know what some call ‘the deep things of Satan’—to you I say, I am not putting any other burden on you.","zh":"","v":[]},{"ref":"Revelation 2:25","en":"Nevertheless, hold that which you have firmly until I come.","zh":"","v":[]},{"ref":"Revelation 2:26","en":"He who overcomes, and he who keeps my works to the end, to him I will give authority over the nations.","zh":"","v":[]},{"ref":"Revelation 2:27","en":"He will rule them with a rod of iron, shattering them like clay pots, as I also have received of my Father;","zh":"","v":[]},{"ref":"Revelation 2:28","en":"and I will give him the morning star.","zh":"","v":[]},{"ref":"Revelation 2:29","en":"He who has an ear, let him hear what the Spirit says to the assemblies.","zh":"","v":[]},{"ref":"Revelation 3:1","en":"“And to the angel of the assembly in Sardis write: “He who has the seven Spirits of God and the seven stars says these things: “I know your works, that you have a reputation of being alive, but you are dead.","zh":"","v":[]},{"ref":"Revelation 3:2","en":"Wake up and strengthen the things that remain, which you were about to throw away, for I have found no works of yours perfected before my God.","zh":"","v":[]},{"ref":"Revelation 3:3","en":"Remember therefore how you have received and heard. Keep it and repent. If therefore you won’t watch, I will come as a thief, and you won’t know what hour I will come upon you.","zh":"","v":[]},{"ref":"Revelation 3:4","en":"Nevertheless you have a few names in Sardis that didn’t defile their garments. They will walk with me in white, for they are worthy.","zh":"","v":[]},{"ref":"Revelation 3:5","en":"He who overcomes will be arrayed in white garments, and I will in no way blot his name out of the book of life, and I will confess his name before my Father, and before his angels.","zh":"","v":[]},{"ref":"Revelation 3:6","en":"He who has an ear, let him hear what the Spirit says to the assemblies.","zh":"","v":[]},{"ref":"Revelation 3:7","en":"“To the angel of the assembly in Philadelphia write: “He who is holy, he who is true, he who has the key of David, he who opens and no one can shut, and who shuts and no one opens, says these things:","zh":"","v":[]},{"ref":"Revelation 3:8","en":"“I know your works (behold, I have set before you an open door, which no one can shut), that you have a little power, and kept my word, and didn’t deny my name.","zh":"","v":[]},{"ref":"Revelation 3:9","en":"Behold, I make some of the synagogue of Satan, of those who say they are Jews, and they are not, but lie—behold, I will make them to come and worship before your feet, and to know that I have loved you.","zh":"","v":[]},{"ref":"Revelation 3:10","en":"Because you kept my command to endure, I also will keep you from the hour of testing which is to come on the whole world, to test those who dwell on the earth.","zh":"","v":[]},{"ref":"Revelation 3:11","en":"I am coming quickly! Hold firmly that which you have, so that no one takes your crown.","zh":"","v":[]},{"ref":"Revelation 3:12","en":"He who overcomes, I will make him a pillar in the temple of my God, and he will go out from there no more. I will write on him the name of my God and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God, and my own new name.","zh":"","v":[]},{"ref":"Revelation 3:13","en":"He who has an ear, let him hear what the Spirit says to the assemblies.","zh":"","v":[]},{"ref":"Revelation 3:14","en":"“To the angel of the assembly in Laodicea write: “The Amen, the Faithful and True Witness, the Beginning of God’s creation, says these things:","zh":"","v":[]},{"ref":"Revelation 3:15","en":"“I know your works, that you are neither cold nor hot. I wish you were cold or hot.","zh":"","v":[]},{"ref":"Revelation 3:16","en":"So, because you are lukewarm, and neither hot nor cold, I will vomit you out of my mouth.","zh":"","v":[]},{"ref":"Revelation 3:17","en":"Because you say, ‘I am rich, and have gotten riches, and have need of nothing,’ and don’t know that you are the wretched one, miserable, poor, blind, and naked;","zh":"","v":[]},{"ref":"Revelation 3:18","en":"I counsel you to buy from me gold refined by fire, that you may become rich; and white garments, that you may clothe yourself, and that the shame of your nakedness may not be revealed; and eye salve to anoint your eyes, that you may see.","zh":"","v":[]},{"ref":"Revelation 3:19","en":"As many as I love, I reprove and chasten. Be zealous therefore, and repent.","zh":"","v":[]},{"ref":"Revelation 3:20","en":"Behold, I stand at the door and knock. If anyone hears my voice and opens the door, then I will come in to him and will dine with him, and he with me.","zh":"","v":[]},{"ref":"Revelation 3:21","en":"He who overcomes, I will give to him to sit down with me on my throne, as I also overcame and sat down with my Father on his throne.","zh":"","v":[]},{"ref":"Revelation 3:22","en":"He who has an ear, let him hear what the Spirit says to the assemblies.”","zh":"","v":[]},{"ref":"Revelation 4:1","en":"After these things I looked and saw a door opened in heaven; and the first voice that I heard, like a trumpet speaking with me, was one saying, “Come up here, and I will show you the things which must happen after this.”","zh":"","v":[]},{"ref":"Revelation 4:2","en":"Immediately I was in the Spirit. Behold, there was a throne set in heaven, and one sitting on the throne","zh":"","v":[]},{"ref":"Revelation 4:3","en":"that looked like a jasper stone and a sardius. There was a rainbow around the throne, like an emerald to look at.","zh":"","v":[]},{"ref":"Revelation 4:4","en":"Around the throne were twenty-four thrones. On the thrones were twenty-four elders sitting, dressed in white garments, with crowns of gold on their heads.","zh":"","v":[]},{"ref":"Revelation 4:5","en":"Out of the throne proceed lightnings, sounds, and thunders. There were seven lamps of fire burning before his throne, which are the seven Spirits of God.","zh":"","v":[]},{"ref":"Revelation 4:6","en":"Before the throne was something like a sea of glass, similar to crystal. In the middle of the throne, and around the throne were four living creatures full of eyes before and behind.","zh":"","v":[]},{"ref":"Revelation 4:7","en":"The first creature was like a lion, the second creature like a calf, the third creature had a face like a man, and the fourth was like a flying eagle.","zh":"","v":[]},{"ref":"Revelation 4:8","en":"The four living creatures, each one of them having six wings, are full of eyes around and within. They have no rest day and night, saying, “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is to come!”","zh":"","v":[]},{"ref":"Revelation 4:9","en":"When the living creatures give glory, honor, and thanks to him who sits on the throne, to him who lives forever and ever,","zh":"","v":[]},{"ref":"Revelation 4:10","en":"the twenty-four elders fall down before him who sits on the throne and worship him who lives forever and ever, and throw their crowns before the throne, saying,","zh":"","v":[]},{"ref":"Revelation 4:11","en":"“Worthy are you, our Lord and God, the Holy One, to receive the glory, the honor, and the power, for you created all things, and because of your desire they existed and were created!”","zh":"","v":[]},{"ref":"Revelation 5:1","en":"I saw, in the right hand of him who sat on the throne, a book written inside and outside, sealed shut with seven seals.","zh":"","v":[]},{"ref":"Revelation 5:2","en":"I saw a mighty angel proclaiming with a loud voice, “Who is worthy to open the book, and to break its seals?”","zh":"","v":[]},{"ref":"Revelation 5:3","en":"No one in heaven above, or on the earth, or under the earth, was able to open the book or to look in it.","zh":"","v":[]},{"ref":"Revelation 5:4","en":"Then I wept much, because no one was found worthy to open the book or to look in it.","zh":"","v":[]},{"ref":"Revelation 5:5","en":"One of the elders said to me, “Don’t weep. Behold, the Lion who is of the tribe of Judah, the Root of David, has overcome: he who opens the book and its seven seals.”","zh":"","v":[]},{"ref":"Revelation 5:6","en":"I saw in the middle of the throne and of the four living creatures, and in the middle of the elders, a Lamb standing, as though it had been slain, having seven horns and seven eyes, which are the seven Spirits of God, sent out into all the earth.","zh":"","v":[]},{"ref":"Revelation 5:7","en":"Then he came, and he took it out of the right hand of him who sat on the throne.","zh":"","v":[]},{"ref":"Revelation 5:8","en":"Now when he had taken the book, the four living creatures and the twenty-four elders fell down before the Lamb, each one having a harp, and golden bowls full of incense, which are the prayers of the saints.","zh":"","v":[]},{"ref":"Revelation 5:9","en":"They sang a new song, saying, “You are worthy to take the book and to open its seals, for you were killed, and bought us for God with your blood out of every tribe, language, people, and nation,","zh":"","v":[]},{"ref":"Revelation 5:10","en":"and made us kings and priests to our God; and we will reign on the earth.”","zh":"","v":[]},{"ref":"Revelation 5:11","en":"I looked, and I heard something like a voice of many angels around the throne, the living creatures, and the elders. The number of them was ten thousands of ten thousands, and thousands of thousands,","zh":"","v":[]},{"ref":"Revelation 5:12","en":"saying with a loud voice, “Worthy is the Lamb who has been killed to receive the power, wealth, wisdom, strength, honor, glory, and blessing!”","zh":"","v":[]},{"ref":"Revelation 5:13","en":"I heard every created thing which is in heaven, on the earth, under the earth, on the sea, and everything in them, saying, “To him who sits on the throne and to the Lamb be the blessing, the honor, the glory, and the dominion, forever and ever! Amen!”","zh":"","v":[]},{"ref":"Revelation 5:14","en":"The four living creatures said, “Amen!” Then the elders fell down and worshiped.","zh":"","v":[]},{"ref":"Revelation 6:1","en":"I saw that the Lamb opened one of the seven seals, and I heard one of the four living creatures saying, as with a voice of thunder, “Come and see!”","zh":"","v":[]},{"ref":"Revelation 6:2","en":"Then a white horse appeared, and he who sat on it had a bow. A crown was given to him, and he came out conquering, and to conquer.","zh":"","v":[]},{"ref":"Revelation 6:3","en":"When he opened the second seal, I heard the second living creature saying, “Come!”","zh":"","v":[]},{"ref":"Revelation 6:4","en":"Another came out, a red horse. To him who sat on it was given power to take peace from the earth, and that they should kill one another. There was given to him a great sword.","zh":"","v":[]},{"ref":"Revelation 6:5","en":"When he opened the third seal, I heard the third living creature saying, “Come and see!” And behold, a black horse, and he who sat on it had a balance in his hand.","zh":"","v":[]},{"ref":"Revelation 6:6","en":"I heard a voice in the middle of the four living creatures saying, “A choenix of wheat for a denarius, and three choenix of barley for a denarius! Don’t damage the oil and the wine!”","zh":"","v":[]},{"ref":"Revelation 6:7","en":"When he opened the fourth seal, I heard the fourth living creature saying, “Come and see!”","zh":"","v":[]},{"ref":"Revelation 6:8","en":"And behold, a pale horse, and the name of he who sat on it was Death. Hades followed with him. Authority over one fourth of the earth, to kill with the sword, with famine, with death, and by the wild animals of the earth was given to him.","zh":"","v":[]},{"ref":"Revelation 6:9","en":"When he opened the fifth seal, I saw underneath the altar the souls of those who had been killed for the Word of God, and for the testimony of the Lamb which they had.","zh":"","v":[]},{"ref":"Revelation 6:10","en":"They cried with a loud voice, saying, “How long, Master, the holy and true, until you judge and avenge our blood on those who dwell on the earth?”","zh":"","v":[]},{"ref":"Revelation 6:11","en":"A long white robe was given to each of them. They were told that they should rest yet for a while, until their fellow servants and their brothers, who would also be killed even as they were, should complete their course.","zh":"","v":[]},{"ref":"Revelation 6:12","en":"I saw when he opened the sixth seal, and there was a great earthquake. The sun became black as sackcloth made of hair, and the whole moon became as blood.","zh":"","v":[]},{"ref":"Revelation 6:13","en":"The stars of the sky fell to the earth, like a fig tree dropping its unripe figs when it is shaken by a great wind.","zh":"","v":[]},{"ref":"Revelation 6:14","en":"The sky was removed like a scroll when it is rolled up. Every mountain and island was moved out of its place.","zh":"","v":[]},{"ref":"Revelation 6:15","en":"The kings of the earth, the princes, the commanding officers, the rich, the strong, and every slave and free person, hid themselves in the caves and in the rocks of the mountains.","zh":"","v":[]},{"ref":"Revelation 6:16","en":"They told the mountains and the rocks, “Fall on us, and hide us from the face of him who sits on the throne, and from the wrath of the Lamb,","zh":"","v":[]},{"ref":"Revelation 6:17","en":"for the great day of his wrath has come, and who is able to stand?”","zh":"","v":[]},{"ref":"Revelation 7:1","en":"After this, I saw four angels standing at the four corners of the earth, holding the four winds of the earth, so that no wind would blow on the earth, or on the sea, or on any tree.","zh":"","v":[]},{"ref":"Revelation 7:2","en":"I saw another angel ascend from the sunrise, having the seal of the living God. He cried with a loud voice to the four angels to whom it was given to harm the earth and the sea,","zh":"","v":[]},{"ref":"Revelation 7:3","en":"saying, “Don’t harm the earth, the sea, or the trees, until we have sealed the bondservants of our God on their foreheads!”","zh":"","v":[]},{"ref":"Revelation 7:4","en":"I heard the number of those who were sealed, one hundred forty-four thousand, sealed out of every tribe of the children of Israel:","zh":"","v":[]},{"ref":"Revelation 7:5","en":"of the tribe of Judah twelve thousand were sealed, of the tribe of Reuben twelve thousand, of the tribe of Gad twelve thousand,","zh":"","v":[]},{"ref":"Revelation 7:6","en":"of the tribe of Asher twelve thousand, of the tribe of Naphtali twelve thousand, of the tribe of Manasseh twelve thousand,","zh":"","v":[]},{"ref":"Revelation 7:7","en":"of the tribe of Simeon twelve thousand, of the tribe of Levi twelve thousand, of the tribe of Issachar twelve thousand,","zh":"","v":[]},{"ref":"Revelation 7:8","en":"of the tribe of Zebulun twelve thousand, of the tribe of Joseph twelve thousand, and of the tribe of Benjamin twelve thousand were sealed.","zh":"","v":[]},{"ref":"Revelation 7:9","en":"After these things I looked, and behold, a great multitude which no man could count, out of every nation and of all tribes, peoples, and languages, standing before the throne and before the Lamb, dressed in white robes, with palm branches in their hands.","zh":"","v":[]},{"ref":"Revelation 7:10","en":"They cried with a loud voice, saying, “Salvation be to our God, who sits on the throne, and to the Lamb!”","zh":"","v":[]},{"ref":"Revelation 7:11","en":"All the angels were standing around the throne, the elders, and the four living creatures; and they fell on their faces before his throne, and worshiped God,","zh":"","v":[]},{"ref":"Revelation 7:12","en":"saying, “Amen! Blessing, glory, wisdom, thanksgiving, honor, power, and might, be to our God forever and ever! Amen.”","zh":"","v":[]},{"ref":"Revelation 7:13","en":"One of the elders answered, saying to me, “These who are arrayed in the white robes, who are they, and where did they come from?”","zh":"","v":[]},{"ref":"Revelation 7:14","en":"I told him, “My lord, you know.” He said to me, “These are those who came out of the great suffering. They washed their robes and made them white in the Lamb’s blood.","zh":"","v":[]},{"ref":"Revelation 7:15","en":"Therefore they are before the throne of God, and they serve him day and night in his temple. He who sits on the throne will spread his tabernacle over them.","zh":"","v":[]},{"ref":"Revelation 7:16","en":"They will never be hungry or thirsty any more. The sun won’t beat on them, nor any heat;","zh":"","v":[]},{"ref":"Revelation 7:17","en":"for the Lamb who is in the middle of the throne shepherds them and leads them to springs of life-giving waters. And God will wipe away every tear from their eyes.”","zh":"","v":[]},{"ref":"Revelation 8:1","en":"When he opened the seventh seal, there was silence in heaven for about half an hour.","zh":"","v":[]},{"ref":"Revelation 8:2","en":"I saw the seven angels who stand before God, and seven trumpets were given to them.","zh":"","v":[]},{"ref":"Revelation 8:3","en":"Another angel came and stood over the altar, having a golden censer. Much incense was given to him, that he should add it to the prayers of all the saints on the golden altar which was before the throne.","zh":"","v":[]},{"ref":"Revelation 8:4","en":"The smoke of the incense, with the prayers of the saints, went up before God out of the angel’s hand.","zh":"","v":[]},{"ref":"Revelation 8:5","en":"The angel took the censer, and he filled it with the fire of the altar, then threw it on the earth. Thunders, sounds, lightnings, and an earthquake followed.","zh":"","v":[]},{"ref":"Revelation 8:6","en":"The seven angels who had the seven trumpets prepared themselves to sound.","zh":"","v":[]},{"ref":"Revelation 8:7","en":"The first sounded, and there followed hail and fire, mixed with blood, and they were thrown to the earth. One third of the earth was burned up, and one third of the trees were burned up, and all green grass was burned up.","zh":"","v":[]},{"ref":"Revelation 8:8","en":"The second angel sounded, and something like a great burning mountain was thrown into the sea. One third of the sea became blood,","zh":"","v":[]},{"ref":"Revelation 8:9","en":"and one third of the living creatures which were in the sea died. One third of the ships were destroyed.","zh":"","v":[]},{"ref":"Revelation 8:10","en":"The third angel sounded, and a great star fell from the sky, burning like a torch, and it fell on one third of the rivers, and on the springs of water.","zh":"","v":[]},{"ref":"Revelation 8:11","en":"The name of the star is “Wormwood.” One third of the waters became wormwood. Many people died from the waters, because they were made bitter.","zh":"","v":[]},{"ref":"Revelation 8:12","en":"The fourth angel sounded, and one third of the sun was struck, and one third of the moon, and one third of the stars, so that one third of them would be darkened; and the day wouldn’t shine for one third of it, and the night in the same way.","zh":"","v":[]},{"ref":"Revelation 8:13","en":"I saw, and I heard an eagle, flying in mid heaven, saying with a loud voice, “Woe! Woe! Woe to those who dwell on the earth, because of the other blasts of the trumpets of the three angels, who are yet to sound!”","zh":"","v":[]},{"ref":"Revelation 9:1","en":"The fifth angel sounded, and I saw a star from the sky which had fallen to the earth. The key to the pit of the abyss was given to him.","zh":"","v":[]},{"ref":"Revelation 9:2","en":"He opened the pit of the abyss, and smoke went up out of the pit, like the smoke from a burning furnace. The sun and the air were darkened because of the smoke from the pit.","zh":"","v":[]},{"ref":"Revelation 9:3","en":"Then out of the smoke came locusts on the earth, and power was given to them, as the scorpions of the earth have power.","zh":"","v":[]},{"ref":"Revelation 9:4","en":"They were told that they should not hurt the grass of the earth, neither any green thing, neither any tree, but only those people who don’t have God’s seal on their foreheads.","zh":"","v":[]},{"ref":"Revelation 9:5","en":"They were given power, not to kill them, but to torment them for five months. Their torment was like the torment of a scorpion when it strikes a person.","zh":"","v":[]},{"ref":"Revelation 9:6","en":"In those days people will seek death, and will in no way find it. They will desire to die, and death will flee from them.","zh":"","v":[]},{"ref":"Revelation 9:7","en":"The shapes of the locusts were like horses prepared for war. On their heads were something like golden crowns, and their faces were like people’s faces.","zh":"","v":[]},{"ref":"Revelation 9:8","en":"They had hair like women’s hair, and their teeth were like those of lions.","zh":"","v":[]},{"ref":"Revelation 9:9","en":"They had breastplates like breastplates of iron. The sound of their wings was like the sound of many chariots and horses rushing to war.","zh":"","v":[]},{"ref":"Revelation 9:10","en":"They have tails like those of scorpions, with stingers. In their tails they have power to harm men for five months.","zh":"","v":[]},{"ref":"Revelation 9:11","en":"They have over them as king the angel of the abyss. His name in Hebrew is “Abaddon”, but in Greek, he has the name “Apollyon”.","zh":"","v":[]},{"ref":"Revelation 9:12","en":"The first woe is past. Behold, there are still two woes coming after this.","zh":"","v":[]},{"ref":"Revelation 9:13","en":"The sixth angel sounded. I heard a voice from the horns of the golden altar which is before God,","zh":"","v":[]},{"ref":"Revelation 9:14","en":"saying to the sixth angel who had the trumpet, “Free the four angels who are bound at the great river Euphrates!”","zh":"","v":[]},{"ref":"Revelation 9:15","en":"The four angels were freed who had been prepared for that hour and day and month and year, so that they might kill one third of mankind.","zh":"","v":[]},{"ref":"Revelation 9:16","en":"The number of the armies of the horsemen was two hundred million. I heard the number of them.","zh":"","v":[]},{"ref":"Revelation 9:17","en":"Thus I saw the horses in the vision and those who sat on them, having breastplates of fiery red, hyacinth blue, and sulfur yellow; and the horses’ heads resembled lions’ heads. Out of their mouths proceed fire, smoke, and sulfur.","zh":"","v":[]},{"ref":"Revelation 9:18","en":"By these three plagues, one third of mankind was killed: by the fire, the smoke, and the sulfur, which proceeded out of their mouths.","zh":"","v":[]},{"ref":"Revelation 9:19","en":"For the power of the horses is in their mouths and in their tails. For their tails are like serpents, and have heads; and with them they harm.","zh":"","v":[]},{"ref":"Revelation 9:20","en":"The rest of mankind, who were not killed with these plagues, didn’t repent of the works of their hands, that they wouldn’t worship demons, and the idols of gold, and of silver, and of brass, and of stone, and of wood, which can’t see, hear, or walk.","zh":"","v":[]},{"ref":"Revelation 9:21","en":"They didn’t repent of their murders, their sorceries, their sexual immorality, or their thefts.","zh":"","v":[]},{"ref":"Revelation 10:1","en":"I saw a mighty angel coming down out of the sky, clothed with a cloud. A rainbow was on his head. His face was like the sun, and his feet like pillars of fire.","zh":"","v":[]},{"ref":"Revelation 10:2","en":"He had in his hand a little open book. He set his right foot on the sea, and his left on the land.","zh":"","v":[]},{"ref":"Revelation 10:3","en":"He cried with a loud voice, as a lion roars. When he cried, the seven thunders uttered their voices.","zh":"","v":[]},{"ref":"Revelation 10:4","en":"When the seven thunders sounded, I was about to write; but I heard a voice from the sky saying, “Seal up the things which the seven thunders said, and don’t write them.”","zh":"","v":[]},{"ref":"Revelation 10:5","en":"The angel whom I saw standing on the sea and on the land lifted up his right hand to the sky","zh":"","v":[]},{"ref":"Revelation 10:6","en":"and swore by him who lives forever and ever, who created heaven and the things that are in it, the earth and the things that are in it, and the sea and the things that are in it, that there will no longer be delay,","zh":"","v":[]},{"ref":"Revelation 10:7","en":"but in the days of the voice of the seventh angel, when he is about to sound, then the mystery of God is finished, as he declared to his servants the prophets.","zh":"","v":[]},{"ref":"Revelation 10:8","en":"The voice which I heard from heaven, again speaking with me, said, “Go, take the book which is open in the hand of the angel who stands on the sea and on the land.”","zh":"","v":[]},{"ref":"Revelation 10:9","en":"I went to the angel, telling him to give me the little book. He said to me, “Take it and eat it. It will make your stomach bitter, but in your mouth it will be as sweet as honey.”","zh":"","v":[]},{"ref":"Revelation 10:10","en":"I took the little book out of the angel’s hand, and ate it. It was as sweet as honey in my mouth. When I had eaten it, my stomach was made bitter.","zh":"","v":[]},{"ref":"Revelation 10:11","en":"They told me, “You must prophesy again over many peoples, nations, languages, and kings.”","zh":"","v":[]},{"ref":"Revelation 11:1","en":"A reed like a rod was given to me. Someone said, “Rise and measure God’s temple, and the altar, and those who worship in it.","zh":"","v":[]},{"ref":"Revelation 11:2","en":"Leave out the court which is outside of the temple, and don’t measure it, for it has been given to the nations. They will tread the holy city under foot for forty-two months.","zh":"","v":[]},{"ref":"Revelation 11:3","en":"I will give power to my two witnesses, and they will prophesy one thousand two hundred sixty days, clothed in sackcloth.”","zh":"","v":[]},{"ref":"Revelation 11:4","en":"These are the two olive trees and the two lamp stands, standing before the Lord of the earth.","zh":"","v":[]},{"ref":"Revelation 11:5","en":"If anyone desires to harm them, fire proceeds out of their mouth and devours their enemies. If anyone desires to harm them, he must be killed in this way.","zh":"","v":[]},{"ref":"Revelation 11:6","en":"These have the power to shut up the sky, that it may not rain during the days of their prophecy. They have power over the waters, to turn them into blood, and to strike the earth with every plague, as often as they desire.","zh":"","v":[]},{"ref":"Revelation 11:7","en":"When they have finished their testimony, the beast that comes up out of the abyss will make war with them, and overcome them, and kill them.","zh":"","v":[]},{"ref":"Revelation 11:8","en":"Their dead bodies will be in the street of the great city, which spiritually is called Sodom and Egypt, where also their Lord was crucified.","zh":"","v":[]},{"ref":"Revelation 11:9","en":"From among the peoples, tribes, languages, and nations, people will look at their dead bodies for three and a half days, and will not allow their dead bodies to be laid in a tomb.","zh":"","v":[]},{"ref":"Revelation 11:10","en":"Those who dwell on the earth will rejoice over them, and they will be glad. They will give gifts to one another, because these two prophets tormented those who dwell on the earth.","zh":"","v":[]},{"ref":"Revelation 11:11","en":"After the three and a half days, the breath of life from God entered into them, and they stood on their feet. Great fear fell on those who saw them.","zh":"","v":[]},{"ref":"Revelation 11:12","en":"I heard a loud voice from heaven saying to them, “Come up here!” They went up into heaven in a cloud, and their enemies saw them.","zh":"","v":[]},{"ref":"Revelation 11:13","en":"In that day there was a great earthquake, and a tenth of the city fell. Seven thousand people were killed in the earthquake, and the rest were terrified and gave glory to the God of heaven.","zh":"","v":[]},{"ref":"Revelation 11:14","en":"The second woe is past. Behold, the third woe comes quickly.","zh":"","v":[]},{"ref":"Revelation 11:15","en":"The seventh angel sounded, and great voices in heaven followed, saying, “The kingdom of the world has become the Kingdom of our Lord and of his Christ. He will reign forever and ever!”","zh":"","v":[]},{"ref":"Revelation 11:16","en":"The twenty-four elders, who sit on their thrones before God’s throne, fell on their faces and worshiped God,","zh":"","v":[]},{"ref":"Revelation 11:17","en":"saying: “We give you thanks, Lord God, the Almighty, the one who is and who was, because you have taken your great power and reigned.","zh":"","v":[]},{"ref":"Revelation 11:18","en":"The nations were angry, and your wrath came, as did the time for the dead to be judged, and to give your bondservants the prophets, their reward, as well as to the saints and those who fear your name, to the small and the great, and to destroy those who destroy the earth.”","zh":"","v":[]},{"ref":"Revelation 11:19","en":"God’s temple that is in heaven was opened, and the ark of the Lord’s covenant was seen in his temple. Lightnings, sounds, thunders, an earthquake, and great hail followed.","zh":"","v":[]},{"ref":"Revelation 12:1","en":"A great sign was seen in heaven: a woman clothed with the sun, and the moon under her feet, and on her head a crown of twelve stars.","zh":"","v":[]},{"ref":"Revelation 12:2","en":"She was with child. She cried out in pain, laboring to give birth.","zh":"","v":[]},{"ref":"Revelation 12:3","en":"Another sign was seen in heaven. Behold, a great red dragon, having seven heads and ten horns, and on his heads seven crowns.","zh":"","v":[]},{"ref":"Revelation 12:4","en":"His tail drew one third of the stars of the sky, and threw them to the earth. The dragon stood before the woman who was about to give birth, so that when she gave birth he might devour her child.","zh":"","v":[]},{"ref":"Revelation 12:5","en":"She gave birth to a son, a male child, who is to rule all the nations with a rod of iron. Her child was caught up to God and to his throne.","zh":"","v":[]},{"ref":"Revelation 12:6","en":"The woman fled into the wilderness, where she has a place prepared by God, that there they may nourish her one thousand two hundred sixty days.","zh":"","v":[]},{"ref":"Revelation 12:7","en":"There was war in the sky. Michael and his angels made war on the dragon. The dragon and his angels made war.","zh":"","v":[]},{"ref":"Revelation 12:8","en":"They didn’t prevail. No place was found for them any more in heaven.","zh":"","v":[]},{"ref":"Revelation 12:9","en":"The great dragon was thrown down, the old serpent, he who is called the devil and Satan, the deceiver of the whole world. He was thrown down to the earth, and his angels were thrown down with him.","zh":"","v":[]},{"ref":"Revelation 12:10","en":"I heard a loud voice in heaven, saying, “Now the salvation, the power, and the Kingdom of our God, and the authority of his Christ has come; for the accuser of our brothers has been thrown down, who accuses them before our God day and night.","zh":"","v":[]},{"ref":"Revelation 12:11","en":"They overcame him because of the Lamb’s blood, and because of the word of their testimony. They didn’t love their life, even to death.","zh":"","v":[]},{"ref":"Revelation 12:12","en":"Therefore rejoice, heavens, and you who dwell in them. Woe to the earth and to the sea, because the devil has gone down to you, having great wrath, knowing that he has but a short time.”","zh":"","v":[]},{"ref":"Revelation 12:13","en":"When the dragon saw that he was thrown down to the earth, he persecuted the woman who gave birth to the male child.","zh":"","v":[]},{"ref":"Revelation 12:14","en":"Two wings of the great eagle were given to the woman, that she might fly into the wilderness to her place, so that she might be nourished for a time, times, and half a time, from the face of the serpent.","zh":"","v":[]},{"ref":"Revelation 12:15","en":"The serpent spewed water out of his mouth after the woman like a river, that he might cause her to be carried away by the stream.","zh":"","v":[]},{"ref":"Revelation 12:16","en":"The earth helped the woman, and the earth opened its mouth and swallowed up the river which the dragon spewed out of his mouth.","zh":"","v":[]},{"ref":"Revelation 12:17","en":"The dragon grew angry with the woman, and went away to make war with the rest of her offspring, who keep God’s commandments and hold Jesus’ testimony.","zh":"","v":[]},{"ref":"Revelation 13:1","en":"Then I stood on the sand of the sea. I saw a beast coming up out of the sea, having ten horns and seven heads. On his horns were ten crowns, and on his heads, blasphemous names.","zh":"","v":[]},{"ref":"Revelation 13:2","en":"The beast which I saw was like a leopard, and his feet were like those of a bear, and his mouth like the mouth of a lion. The dragon gave him his power, his throne, and great authority.","zh":"","v":[]},{"ref":"Revelation 13:3","en":"One of his heads looked like it had been wounded fatally. His fatal wound was healed, and the whole earth marveled at the beast.","zh":"","v":[]},{"ref":"Revelation 13:4","en":"They worshiped the dragon because he gave his authority to the beast; and they worshiped the beast, saying, “Who is like the beast? Who is able to make war with him?”","zh":"","v":[]},{"ref":"Revelation 13:5","en":"A mouth speaking great things and blasphemy was given to him. Authority to make war for forty-two months was given to him.","zh":"","v":[]},{"ref":"Revelation 13:6","en":"He opened his mouth for blasphemy against God, to blaspheme his name, his dwelling, and those who dwell in heaven.","zh":"","v":[]},{"ref":"Revelation 13:7","en":"It was given to him to make war with the saints and to overcome them. Authority over every tribe, people, language, and nation was given to him.","zh":"","v":[]},{"ref":"Revelation 13:8","en":"All who dwell on the earth will worship him, everyone whose name has not been written from the foundation of the world in the book of life of the Lamb who has been killed.","zh":"","v":[]},{"ref":"Revelation 13:9","en":"If anyone has an ear, let him hear.","zh":"","v":[]},{"ref":"Revelation 13:10","en":"If anyone is to go into captivity, he will go into captivity. If anyone is to be killed with the sword, he must be killed. Here is the endurance and the faith of the saints.","zh":"","v":[]},{"ref":"Revelation 13:11","en":"I saw another beast coming up out of the earth. He had two horns like a lamb and it spoke like a dragon.","zh":"","v":[]},{"ref":"Revelation 13:12","en":"He exercises all the authority of the first beast in his presence. He makes the earth and those who dwell in it to worship the first beast, whose fatal wound was healed.","zh":"","v":[]},{"ref":"Revelation 13:13","en":"He performs great signs, even making fire come down out of the sky to the earth in the sight of people.","zh":"","v":[]},{"ref":"Revelation 13:14","en":"He deceives my own people who dwell on the earth because of the signs he was granted to do in front of the beast, saying to those who dwell on the earth that they should make an image to the beast who had the sword wound and lived.","zh":"","v":[]},{"ref":"Revelation 13:15","en":"It was given to him to give breath to the image of the beast, that the image of the beast should both speak, and cause as many as wouldn’t worship the image of the beast to be killed.","zh":"","v":[]},{"ref":"Revelation 13:16","en":"He causes all, the small and the great, the rich and the poor, and the free and the slave, to be given marks on their right hands or on their foreheads;","zh":"","v":[]},{"ref":"Revelation 13:17","en":"and that no one would be able to buy or to sell unless he has that mark, which is the name of the beast or the number of his name.","zh":"","v":[]},{"ref":"Revelation 13:18","en":"Here is wisdom. He who has understanding, let him calculate the number of the beast, for it is the number of a man. His number is six hundred sixty-six.","zh":"","v":[]},{"ref":"Revelation 14:1","en":"I saw, and behold, the Lamb standing on Mount Zion, and with him a number, one hundred forty-four thousand, having his name and the name of his Father written on their foreheads.","zh":"","v":[]},{"ref":"Revelation 14:2","en":"I heard a sound from heaven like the sound of many waters and like the sound of a great thunder. The sound which I heard was like that of harpists playing on their harps.","zh":"","v":[]},{"ref":"Revelation 14:3","en":"They sing a new song before the throne and before the four living creatures and the elders. No one could learn the song except the one hundred forty-four thousand, those who had been redeemed out of the earth.","zh":"","v":[]},{"ref":"Revelation 14:4","en":"These are those who were not defiled with women, for they are virgins. These are those who follow the Lamb wherever he goes. These were redeemed by Jesus from among men, the first fruits to God and to the Lamb.","zh":"","v":[]},{"ref":"Revelation 14:5","en":"In their mouth was found no lie, for they are blameless.","zh":"","v":[]},{"ref":"Revelation 14:6","en":"I saw an angel flying in mid heaven, having an eternal Good News to proclaim to those who dwell on the earth—to every nation, tribe, language, and people.","zh":"","v":[]},{"ref":"Revelation 14:7","en":"He said with a loud voice, “Fear the Lord, and give him glory, for the hour of his judgment has come. Worship him who made the heaven, the earth, the sea, and the springs of waters!”","zh":"","v":[]},{"ref":"Revelation 14:8","en":"Another, a second angel, followed, saying, “Babylon the great has fallen, which has made all the nations to drink of the wine of the wrath of her sexual immorality.”","zh":"","v":[]},{"ref":"Revelation 14:9","en":"Another angel, a third, followed them, saying with a great voice, “If anyone worships the beast and his image, and receives a mark on his forehead or on his hand,","zh":"","v":[]},{"ref":"Revelation 14:10","en":"he also will drink of the wine of the wrath of God, which is prepared unmixed in the cup of his anger. He will be tormented with fire and sulfur in the presence of the holy angels and in the presence of the Lamb.","zh":"","v":[]},{"ref":"Revelation 14:11","en":"The smoke of their torment goes up forever and ever. They have no rest day and night, those who worship the beast and his image, and whoever receives the mark of his name.","zh":"","v":[]},{"ref":"Revelation 14:12","en":"Here is the perseverance of the saints, those who keep the commandments of God and the faith of Jesus.”","zh":"","v":[]},{"ref":"Revelation 14:13","en":"I heard a voice from heaven saying, “Write, ‘Blessed are the dead who die in the Lord from now on.’” “Yes,” says the Spirit, “that they may rest from their labors, for their works follow with them.”","zh":"","v":[]},{"ref":"Revelation 14:14","en":"I looked, and saw a white cloud, and on the cloud one sitting like a son of man, having on his head a golden crown, and in his hand a sharp sickle.","zh":"","v":[]},{"ref":"Revelation 14:15","en":"Another angel came out of the temple, crying with a loud voice to him who sat on the cloud, “Send your sickle and reap, for the hour to reap has come; for the harvest of the earth is ripe!”","zh":"","v":[]},{"ref":"Revelation 14:16","en":"He who sat on the cloud thrust his sickle on the earth, and the earth was reaped.","zh":"","v":[]},{"ref":"Revelation 14:17","en":"Another angel came out of the temple which is in heaven. He also had a sharp sickle.","zh":"","v":[]},{"ref":"Revelation 14:18","en":"Another angel came out from the altar, he who has power over fire, and he called with a great voice to him who had the sharp sickle, saying, “Send your sharp sickle and gather the clusters of the vine of the earth, for the earth’s grapes are fully ripe!”","zh":"","v":[]},{"ref":"Revelation 14:19","en":"The angel thrust his sickle into the earth, and gathered the vintage of the earth and threw it into the great wine press of the wrath of God.","zh":"","v":[]},{"ref":"Revelation 14:20","en":"The wine press was trodden outside of the city, and blood came out of the wine press, up to the bridles of the horses, as far as one thousand six hundred stadia.","zh":"","v":[]},{"ref":"Revelation 15:1","en":"I saw another great and marvelous sign in the sky: seven angels having the seven last plagues, for in them God’s wrath is finished.","zh":"","v":[]},{"ref":"Revelation 15:2","en":"I saw something like a sea of glass mixed with fire, and those who overcame the beast, his image, and the number of his name, standing on the sea of glass, having harps of God.","zh":"","v":[]},{"ref":"Revelation 15:3","en":"They sang the song of Moses, the servant of God, and the song of the Lamb, saying, “Great and marvelous are your works, Lord God, the Almighty! Righteous and true are your ways, you King of the nations.","zh":"","v":[]},{"ref":"Revelation 15:4","en":"Who wouldn’t fear you, Lord, and glorify your name? For you only are holy. For all the nations will come and worship before you. For your righteous acts have been revealed.”","zh":"","v":[]},{"ref":"Revelation 15:5","en":"After these things I looked, and the temple of the tabernacle of the testimony in heaven was opened.","zh":"","v":[]},{"ref":"Revelation 15:6","en":"The seven angels who had the seven plagues came out, clothed with pure, bright linen, and wearing golden sashes around their chests.","zh":"","v":[]},{"ref":"Revelation 15:7","en":"One of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God, who lives forever and ever.","zh":"","v":[]},{"ref":"Revelation 15:8","en":"The temple was filled with smoke from the glory of God and from his power. No one was able to enter into the temple until the seven plagues of the seven angels would be finished.","zh":"","v":[]},{"ref":"Revelation 16:1","en":"I heard a loud voice out of the temple, saying to the seven angels, “Go and pour out the seven bowls of the wrath of God on the earth!”","zh":"","v":[]},{"ref":"Revelation 16:2","en":"The first went, and poured out his bowl into the earth, and it became a harmful and painful sore on the people who had the mark of the beast, and who worshiped his image.","zh":"","v":[]},{"ref":"Revelation 16:3","en":"The second angel poured out his bowl into the sea, and it became blood as of a dead man. Every living thing in the sea died.","zh":"","v":[]},{"ref":"Revelation 16:4","en":"The third poured out his bowl into the rivers and springs of water, and they became blood.","zh":"","v":[]},{"ref":"Revelation 16:5","en":"I heard the angel of the waters saying, “You are righteous, who are and who were, O Holy One, because you have judged these things.","zh":"","v":[]},{"ref":"Revelation 16:6","en":"For they poured out the blood of saints and prophets, and you have given them blood to drink. They deserve this.”","zh":"","v":[]},{"ref":"Revelation 16:7","en":"I heard the altar saying, “Yes, Lord God, the Almighty, true and righteous are your judgments.”","zh":"","v":[]},{"ref":"Revelation 16:8","en":"The fourth poured out his bowl on the sun, and it was given to him to scorch men with fire.","zh":"","v":[]},{"ref":"Revelation 16:9","en":"People were scorched with great heat, and people blasphemed the name of God who has the power over these plagues. They didn’t repent and give him glory.","zh":"","v":[]},{"ref":"Revelation 16:10","en":"The fifth poured out his bowl on the throne of the beast, and his kingdom was darkened. They gnawed their tongues because of the pain,","zh":"","v":[]},{"ref":"Revelation 16:11","en":"and they blasphemed the God of heaven because of their pains and their sores. They still didn’t repent of their works.","zh":"","v":[]},{"ref":"Revelation 16:12","en":"The sixth poured out his bowl on the great river, the Euphrates. Its water was dried up, that the way might be prepared for the kings that come from the sunrise.","zh":"","v":[]},{"ref":"Revelation 16:13","en":"I saw coming out of the mouth of the dragon, and out of the mouth of the beast, and out of the mouth of the false prophet, three unclean spirits, something like frogs;","zh":"","v":[]},{"ref":"Revelation 16:14","en":"for they are spirits of demons, performing signs, which go out to the kings of the whole inhabited earth, to gather them together for the war of that great day of God the Almighty.","zh":"","v":[]},{"ref":"Revelation 16:15","en":"“Behold, I come like a thief. Blessed is he who watches, and keeps his clothes, so that he doesn’t walk naked, and they see his shame.”","zh":"","v":[]},{"ref":"Revelation 16:16","en":"He gathered them together into the place which is called in Hebrew, “Harmagedon”.","zh":"","v":[]},{"ref":"Revelation 16:17","en":"The seventh poured out his bowl into the air. A loud voice came out of the temple of heaven, from the throne, saying, “It is done!”","zh":"","v":[]},{"ref":"Revelation 16:18","en":"There were lightnings, sounds, and thunders; and there was a great earthquake such as has not happened since there were men on the earth—so great an earthquake and so mighty.","zh":"","v":[]},{"ref":"Revelation 16:19","en":"The great city was divided into three parts, and the cities of the nations fell. Babylon the great was remembered in the sight of God, to give to her the cup of the wine of the fierceness of his wrath.","zh":"","v":[]},{"ref":"Revelation 16:20","en":"Every island fled away, and the mountains were not found.","zh":"","v":[]},{"ref":"Revelation 16:21","en":"Great hailstones, about the weight of a talent, came down out of the sky on people. People blasphemed God because of the plague of the hail, for this plague was exceedingly severe.","zh":"","v":[]},{"ref":"Revelation 17:1","en":"One of the seven angels who had the seven bowls came and spoke with me, saying, “Come here. I will show you the judgment of the great prostitute who sits on many waters,","zh":"","v":[]},{"ref":"Revelation 17:2","en":"with whom the kings of the earth committed sexual immorality. Those who dwell in the earth were made drunken with the wine of her sexual immorality.”","zh":"","v":[]},{"ref":"Revelation 17:3","en":"He carried me away in the Spirit into a wilderness. I saw a woman sitting on a scarlet-colored beast, full of blasphemous names, having seven heads and ten horns.","zh":"","v":[]},{"ref":"Revelation 17:4","en":"The woman was dressed in purple and scarlet, and decked with gold and precious stones and pearls, having in her hand a golden cup full of abominations and the impurities of the sexual immorality of the earth.","zh":"","v":[]},{"ref":"Revelation 17:5","en":"And on her forehead a name was written, “MYSTERY, BABYLON THE GREAT, THE MOTHER OF THE PROSTITUTES AND OF THE ABOMINATIONS OF THE EARTH.”","zh":"","v":[]},{"ref":"Revelation 17:6","en":"I saw the woman drunken with the blood of the saints and with the blood of the martyrs of Jesus. When I saw her, I wondered with great amazement.","zh":"","v":[]},{"ref":"Revelation 17:7","en":"The angel said to me, “Why do you wonder? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.","zh":"","v":[]},{"ref":"Revelation 17:8","en":"The beast that you saw was, and is not; and is about to come up out of the abyss and to go into destruction. Those who dwell on the earth and whose names have not been written in the book of life from the foundation of the world will marvel when they see that the beast was, and is not, and shall be present.","zh":"","v":[]},{"ref":"Revelation 17:9","en":"Here is the mind that has wisdom. The seven heads are seven mountains on which the woman sits.","zh":"","v":[]},{"ref":"Revelation 17:10","en":"They are seven kings. Five have fallen, the one is, and the other has not yet come. When he comes, he must continue a little while.","zh":"","v":[]},{"ref":"Revelation 17:11","en":"The beast that was, and is not, is himself also an eighth, and is of the seven; and he goes to destruction.","zh":"","v":[]},{"ref":"Revelation 17:12","en":"The ten horns that you saw are ten kings who have received no kingdom as yet, but they receive authority as kings with the beast for one hour.","zh":"","v":[]},{"ref":"Revelation 17:13","en":"These have one mind, and they give their power and authority to the beast.","zh":"","v":[]},{"ref":"Revelation 17:14","en":"These will war against the Lamb, and the Lamb will overcome them, for he is Lord of lords and King of kings; and those who are with him are called, chosen, and faithful.”","zh":"","v":[]},{"ref":"Revelation 17:15","en":"He said to me, “The waters which you saw, where the prostitute sits, are peoples, multitudes, nations, and languages.","zh":"","v":[]},{"ref":"Revelation 17:16","en":"The ten horns which you saw, they and the beast will hate the prostitute, will make her desolate, will strip her naked, will eat her flesh, and will burn her utterly with fire.","zh":"","v":[]},{"ref":"Revelation 17:17","en":"For God has put in their hearts to do what he has in mind, to be of one mind, and to give their kingdom to the beast, until the words of God should be accomplished.","zh":"","v":[]},{"ref":"Revelation 17:18","en":"The woman whom you saw is the great city which reigns over the kings of the earth.”","zh":"","v":[]},{"ref":"Revelation 18:1","en":"After these things, I saw another angel coming down out of the sky, having great authority. The earth was illuminated with his glory.","zh":"","v":[]},{"ref":"Revelation 18:2","en":"He cried with a mighty voice, saying, “Fallen, fallen is Babylon the great, and she has become a habitation of demons, a prison of every unclean spirit, and a prison of every unclean and hated bird!","zh":"","v":[]},{"ref":"Revelation 18:3","en":"For all the nations have drunk of the wine of the wrath of her sexual immorality, the kings of the earth committed sexual immorality with her, and the merchants of the earth grew rich from the abundance of her luxury.”","zh":"","v":[]},{"ref":"Revelation 18:4","en":"I heard another voice from heaven, saying, “Come out of her, my people, that you have no participation in her sins, and that you don’t receive of her plagues,","zh":"","v":[]},{"ref":"Revelation 18:5","en":"for her sins have reached to the sky, and God has remembered her iniquities.","zh":"","v":[]},{"ref":"Revelation 18:6","en":"Return to her just as she returned, and repay her double as she did, and according to her works. In the cup which she mixed, mix to her double.","zh":"","v":[]},{"ref":"Revelation 18:7","en":"However much she glorified herself and grew wanton, so much give her of torment and mourning. For she says in her heart, ‘I sit a queen, and am no widow, and will in no way see mourning.’","zh":"","v":[]},{"ref":"Revelation 18:8","en":"Therefore in one day her plagues will come: death, mourning, and famine; and she will be utterly burned with fire, for the Lord God who has judged her is strong.","zh":"","v":[]},{"ref":"Revelation 18:9","en":"The kings of the earth who committed sexual immorality and lived wantonly with her will weep and wail over her, when they look at the smoke of her burning,","zh":"","v":[]},{"ref":"Revelation 18:10","en":"standing far away for the fear of her torment, saying, ‘Woe, woe, the great city, Babylon, the strong city! For your judgment has come in one hour.’","zh":"","v":[]},{"ref":"Revelation 18:11","en":"The merchants of the earth weep and mourn over her, for no one buys their merchandise any more:","zh":"","v":[]},{"ref":"Revelation 18:12","en":"merchandise of gold, silver, precious stones, pearls, fine linen, purple, silk, scarlet, all expensive wood, every vessel of ivory, every vessel made of most precious wood, and of brass, and iron, and marble;","zh":"","v":[]},{"ref":"Revelation 18:13","en":"and cinnamon, incense, perfume, frankincense, wine, olive oil, fine flour, wheat, cattle, sheep, horses, chariots, and people’s bodies and souls.","zh":"","v":[]},{"ref":"Revelation 18:14","en":"The fruits which your soul lusted after have been lost to you. All things that were dainty and sumptuous have perished from you, and you will find them no more at all.","zh":"","v":[]},{"ref":"Revelation 18:15","en":"The merchants of these things, who were made rich by her, will stand far away for the fear of her torment, weeping and mourning,","zh":"","v":[]},{"ref":"Revelation 18:16","en":"saying, ‘Woe, woe, the great city, she who was dressed in fine linen, purple, and scarlet, and decked with gold and precious stones and pearls!","zh":"","v":[]},{"ref":"Revelation 18:17","en":"For in an hour such great riches are made desolate.’ Every ship master, and everyone who sails anywhere, and mariners, and as many as gain their living by sea, stood far away,","zh":"","v":[]},{"ref":"Revelation 18:18","en":"and cried out as they looked at the smoke of her burning, saying, ‘What is like the great city?’","zh":"","v":[]},{"ref":"Revelation 18:19","en":"They cast dust on their heads, and cried, weeping and mourning, saying, ‘Woe, woe, the great city, in which all who had their ships in the sea were made rich by reason of her great wealth!’ For she is made desolate in one hour.","zh":"","v":[]},{"ref":"Revelation 18:20","en":"“Rejoice over her, O heaven, you saints, apostles, and prophets, for God has judged your judgment on her.”","zh":"","v":[]},{"ref":"Revelation 18:21","en":"A mighty angel took up a stone like a great millstone and cast it into the sea, saying, “Thus with violence will Babylon, the great city, be thrown down, and will be found no more at all.","zh":"","v":[]},{"ref":"Revelation 18:22","en":"The voice of harpists, minstrels, flute players, and trumpeters will be heard no more at all in you. No craftsman of whatever craft will be found any more at all in you. The sound of a mill will be heard no more at all in you.","zh":"","v":[]},{"ref":"Revelation 18:23","en":"The light of a lamp will shine no more at all in you. The voice of the bridegroom and of the bride will be heard no more at all in you, for your merchants were the princes of the earth; for with your sorcery all the nations were deceived.","zh":"","v":[]},{"ref":"Revelation 18:24","en":"In her was found the blood of prophets and of saints, and of all who have been slain on the earth.”","zh":"","v":[]},{"ref":"Revelation 19:1","en":"After these things I heard something like a loud voice of a great multitude in heaven, saying, “Hallelujah! Salvation, power, and glory belong to our God;","zh":"","v":[]},{"ref":"Revelation 19:2","en":"for his judgments are true and righteous. For he has judged the great prostitute who corrupted the earth with her sexual immorality, and he has avenged the blood of his servants at her hand.”","zh":"","v":[]},{"ref":"Revelation 19:3","en":"A second said, “Hallelujah! Her smoke goes up forever and ever.”","zh":"","v":[]},{"ref":"Revelation 19:4","en":"The twenty-four elders and the four living creatures fell down and worshiped God who sits on the throne, saying, “Amen! Hallelujah!”","zh":"","v":[]},{"ref":"Revelation 19:5","en":"A voice came from the throne, saying, “Give praise to our God, all you his servants, you who fear him, the small and the great!”","zh":"","v":[]},{"ref":"Revelation 19:6","en":"I heard something like the voice of a great multitude, and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord our God, the Almighty, reigns!","zh":"","v":[]},{"ref":"Revelation 19:7","en":"Let’s rejoice and be exceedingly glad, and let’s give the glory to him. For the wedding of the Lamb has come, and his wife has made herself ready.”","zh":"","v":[]},{"ref":"Revelation 19:8","en":"It was given to her that she would array herself in bright, pure, fine linen, for the fine linen is the righteous acts of the saints.","zh":"","v":[]},{"ref":"Revelation 19:9","en":"He said to me, “Write, ‘Blessed are those who are invited to the wedding supper of the Lamb.’” He said to me, “These are true words of God.”","zh":"","v":[]},{"ref":"Revelation 19:10","en":"I fell down before his feet to worship him. He said to me, “Look! Don’t do it! I am a fellow bondservant with you and with your brothers who hold the testimony of Jesus. Worship God, for the testimony of Jesus is the Spirit of Prophecy.”","zh":"","v":[]},{"ref":"Revelation 19:11","en":"I saw heaven opened, and behold, a white horse, and he who sat on it is called Faithful and True. In righteousness he judges and makes war.","zh":"","v":[]},{"ref":"Revelation 19:12","en":"His eyes are a flame of fire, and on his head are many crowns. He has names written and a name written which no one knows but he himself.","zh":"","v":[]},{"ref":"Revelation 19:13","en":"He is clothed in a garment sprinkled with blood. His name is called “The Word of God.”","zh":"","v":[]},{"ref":"Revelation 19:14","en":"The armies which are in heaven, clothed in white, pure, fine linen, followed him on white horses.","zh":"","v":[]},{"ref":"Revelation 19:15","en":"Out of his mouth proceeds a sharp, double-edged sword that with it he should strike the nations. He will rule them with an iron rod. He treads the wine press of the fierceness of the wrath of God, the Almighty.","zh":"","v":[]},{"ref":"Revelation 19:16","en":"He has on his garment and on his thigh a name written, “KING OF KINGS AND LORD OF LORDS.”","zh":"","v":[]},{"ref":"Revelation 19:17","en":"I saw an angel standing in the sun. He cried with a loud voice, saying to all the birds that fly in the sky, “Come! Be gathered together to the great supper of God,","zh":"","v":[]},{"ref":"Revelation 19:18","en":"that you may eat the flesh of kings, the flesh of captains, the flesh of mighty men, and the flesh of horses and of those who sit on them, and the flesh of all men, both free and slave, small and great.”","zh":"","v":[]},{"ref":"Revelation 19:19","en":"I saw the beast, the kings of the earth, and their armies, gathered together to make war against him who sat on the horse and against his army.","zh":"","v":[]},{"ref":"Revelation 19:20","en":"The beast was taken, and with him the false prophet who worked the signs in his sight, with which he deceived those who had received the mark of the beast and those who worshiped his image. These two were thrown alive into the lake of fire that burns with sulfur.","zh":"","v":[]},{"ref":"Revelation 19:21","en":"The rest were killed with the sword of him who sat on the horse, the sword which came out of his mouth. So all the birds were filled with their flesh.","zh":"","v":[]},{"ref":"Revelation 20:1","en":"I saw an angel coming down out of heaven, having the key of the abyss and a great chain in his hand.","zh":"","v":[]},{"ref":"Revelation 20:2","en":"He seized the dragon, the old serpent, who is the devil and Satan, who deceives the whole inhabited earth, and bound him for a thousand years,","zh":"","v":[]},{"ref":"Revelation 20:3","en":"and cast him into the abyss, and shut it and sealed it over him, that he should deceive the nations no more until the thousand years were finished. After this, he must be freed for a short time.","zh":"","v":[]},{"ref":"Revelation 20:4","en":"I saw thrones, and they sat on them, and judgment was given to them. I saw the souls of those who had been beheaded for the testimony of Jesus and for the word of God, and such as didn’t worship the beast nor his image, and didn’t receive the mark on their forehead and on their hand. They lived and reigned with Christ for a thousand years.","zh":"","v":[]},{"ref":"Revelation 20:5","en":"The rest of the dead didn’t live until the thousand years were finished. This is the first resurrection.","zh":"","v":[]},{"ref":"Revelation 20:6","en":"Blessed and holy is he who has part in the first resurrection. Over these, the second death has no power, but they will be priests of God and of Christ, and will reign with him one thousand years.","zh":"","v":[]},{"ref":"Revelation 20:7","en":"And after the thousand years, Satan will be released from his prison","zh":"","v":[]},{"ref":"Revelation 20:8","en":"and he will come out to deceive the nations which are in the four corners of the earth, Gog and Magog, to gather them together to the war, whose number is as the sand of the sea.","zh":"","v":[]},{"ref":"Revelation 20:9","en":"They went up over the width of the earth and surrounded the camp of the saints and the beloved city. Fire came down out of heaven from God and devoured them.","zh":"","v":[]},{"ref":"Revelation 20:10","en":"The devil who deceived them was thrown into the lake of fire and sulfur, where the beast and the false prophet are also. They will be tormented day and night forever and ever.","zh":"","v":[]},{"ref":"Revelation 20:11","en":"I saw a great white throne and him who sat on it, from whose face the earth and the sky fled away. There was found no place for them.","zh":"","v":[]},{"ref":"Revelation 20:12","en":"I saw the dead, the great and the small, standing before the throne, and they opened books. Another book was opened, which is the book of life. The dead were judged out of the things which were written in the books, according to their works.","zh":"","v":[]},{"ref":"Revelation 20:13","en":"The sea gave up the dead who were in it. Death and Hades gave up the dead who were in them. They were judged, each one according to his works.","zh":"","v":[]},{"ref":"Revelation 20:14","en":"Death and Hades were thrown into the lake of fire. This is the second death, the lake of fire.","zh":"","v":[]},{"ref":"Revelation 20:15","en":"If anyone was not found written in the book of life, he was cast into the lake of fire.","zh":"","v":[]},{"ref":"Revelation 21:1","en":"I saw a new heaven and a new earth, for the first heaven and the first earth have passed away, and the sea is no more.","zh":"","v":[]},{"ref":"Revelation 21:2","en":"I saw the holy city, New Jerusalem, coming down out of heaven from God, prepared like a bride adorned for her husband.","zh":"","v":[]},{"ref":"Revelation 21:3","en":"I heard a loud voice out of heaven saying, “Behold, God’s dwelling is with people; and he will dwell with them, and they will be his people, and God himself will be with them as their God.","zh":"","v":[]},{"ref":"Revelation 21:4","en":"He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain any more. The first things have passed away.”","zh":"","v":[]},{"ref":"Revelation 21:5","en":"He who sits on the throne said, “Behold, I am making all things new.” He said, “Write, for these words of God are faithful and true.”","zh":"","v":[]},{"ref":"Revelation 21:6","en":"He said to me, “I am the Alpha and the Omega, the Beginning and the End. I will give freely to him who is thirsty from the spring of the water of life.","zh":"","v":[]},{"ref":"Revelation 21:7","en":"He who overcomes, I will give him these things. I will be his God, and he will be my son.","zh":"","v":[]},{"ref":"Revelation 21:8","en":"But for the cowardly, unbelieving, sinners, abominable, murderers, sexually immoral, sorcerers, idolaters, and all liars, their part is in the lake that burns with fire and sulfur, which is the second death.”","zh":"","v":[]},{"ref":"Revelation 21:9","en":"One of the seven angels who had the seven bowls which were loaded with the seven last plagues came, and he spoke with me, saying, “Come here. I will show you the bride, the Lamb’s wife.”","zh":"","v":[]},{"ref":"Revelation 21:10","en":"He carried me away in the Spirit to a great and high mountain, and showed me the holy city, Jerusalem, coming down out of heaven from God,","zh":"","v":[]},{"ref":"Revelation 21:11","en":"having the glory of God. Her light was like a most precious stone, like a jasper stone, clear as crystal;","zh":"","v":[]},{"ref":"Revelation 21:12","en":"having a great and high wall with twelve gates, and at the gates twelve angels, and names written on them, which are the names of the twelve tribes of the children of Israel.","zh":"","v":[]},{"ref":"Revelation 21:13","en":"On the east were three gates, and on the north three gates, and on the south three gates, and on the west three gates.","zh":"","v":[]},{"ref":"Revelation 21:14","en":"The wall of the city had twelve foundations, and on them twelve names of the twelve Apostles of the Lamb.","zh":"","v":[]},{"ref":"Revelation 21:15","en":"He who spoke with me had for a measure a golden reed to measure the city, its gates, and its walls.","zh":"","v":[]},{"ref":"Revelation 21:16","en":"The city is square. Its length is as great as its width. He measured the city with the reed: twelve thousand twelve stadia. Its length, width, and height are equal.","zh":"","v":[]},{"ref":"Revelation 21:17","en":"Its wall is one hundred forty-four cubits, by the measure of a man, that is, of an angel.","zh":"","v":[]},{"ref":"Revelation 21:18","en":"The construction of its wall was jasper. The city was pure gold, like pure glass.","zh":"","v":[]},{"ref":"Revelation 21:19","en":"The foundations of the city’s wall were adorned with all kinds of precious stones. The first foundation was jasper, the second sapphire, the third chalcedony, the fourth emerald,","zh":"","v":[]},{"ref":"Revelation 21:20","en":"the fifth sardonyx, the sixth sardius, the seventh chrysolite, the eighth beryl, the ninth topaz, the tenth chrysoprase, the eleventh jacinth, and the twelfth amethyst.","zh":"","v":[]},{"ref":"Revelation 21:21","en":"The twelve gates were twelve pearls. Each one of the gates was made of one pearl. The street of the city was pure gold, like transparent glass.","zh":"","v":[]},{"ref":"Revelation 21:22","en":"I saw no temple in it, for the Lord God the Almighty and the Lamb are its temple.","zh":"","v":[]},{"ref":"Revelation 21:23","en":"The city has no need for the sun or moon to shine, for the very glory of God illuminated it and its lamp is the Lamb.","zh":"","v":[]},{"ref":"Revelation 21:24","en":"The nations will walk in its light. The kings of the earth bring the glory and honor of the nations into it.","zh":"","v":[]},{"ref":"Revelation 21:25","en":"Its gates will in no way be shut by day (for there will be no night there),","zh":"","v":[]},{"ref":"Revelation 21:26","en":"and they shall bring the glory and the honor of the nations into it so that they may enter.","zh":"","v":[]},{"ref":"Revelation 21:27","en":"There will in no way enter into it anything profane, or one who causes an abomination or a lie, but only those who are written in the Lamb’s book of life.","zh":"","v":[]},{"ref":"Revelation 22:1","en":"He showed me a river of water of life, clear as crystal, proceeding out of the throne of God and of the Lamb,","zh":"","v":[]},{"ref":"Revelation 22:2","en":"in the middle of its street. On this side of the river and on that was the tree of life, bearing twelve kinds of fruits, yielding its fruit every month. The leaves of the tree were for the healing of the nations.","zh":"","v":[]},{"ref":"Revelation 22:3","en":"There will be no curse any more. The throne of God and of the Lamb will be in it, and his servants will serve him.","zh":"","v":[]},{"ref":"Revelation 22:4","en":"They will see his face, and his name will be on their foreheads.","zh":"","v":[]},{"ref":"Revelation 22:5","en":"There will be no night, and they need no lamp light or sun light; for the Lord God will illuminate them. They will reign forever and ever.","zh":"","v":[]},{"ref":"Revelation 22:6","en":"He said to me, “These words are faithful and true. The Lord God of the spirits of the prophets sent his angel to show to his bondservants the things which must happen soon.”","zh":"","v":[]},{"ref":"Revelation 22:7","en":"“Behold, I am coming soon! Blessed is he who keeps the words of the prophecy of this book.”","zh":"","v":[]},{"ref":"Revelation 22:8","en":"Now I, John, am the one who heard and saw these things. When I heard and saw, I fell down to worship before the feet of the angel who had shown me these things.","zh":"","v":[]},{"ref":"Revelation 22:9","en":"He said to me, “You must not do that! I am a fellow bondservant with you and with your brothers, the prophets, and with those who keep the words of this book. Worship God.”","zh":"","v":[]},{"ref":"Revelation 22:10","en":"He said to me, “Don’t seal up the words of the prophecy of this book, for the time is at hand.","zh":"","v":[]},{"ref":"Revelation 22:11","en":"He who acts unjustly, let him act unjustly still. He who is filthy, let him be filthy still. He who is righteous, let him do righteousness still. He who is holy, let him be holy still.”","zh":"","v":[]},{"ref":"Revelation 22:12","en":"“Behold, I am coming soon! My reward is with me, to repay to each man according to his work.","zh":"","v":[]},{"ref":"Revelation 22:13","en":"I am the Alpha and the Omega, the First and the Last, the Beginning and the End.","zh":"","v":[]},{"ref":"Revelation 22:14","en":"Blessed are those who do his commandments, that they may have the right to the tree of life, and may enter in by the gates into the city.","zh":"","v":[]},{"ref":"Revelation 22:15","en":"Outside are the dogs, the sorcerers, the sexually immoral, the murderers, the idolaters, and everyone who loves and practices falsehood.","zh":"","v":[]},{"ref":"Revelation 22:16","en":"I, Jesus, have sent my angel to testify these things to you for the assemblies. I am the root and the offspring of David, the Bright and Morning Star.”","zh":"","v":[]},{"ref":"Revelation 22:17","en":"The Spirit and the bride say, “Come!” He who hears, let him say, “Come!” He who is thirsty, let him come. He who desires, let him take the water of life freely.","zh":"","v":[]},{"ref":"Revelation 22:18","en":"I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them, God will add to him the plagues which are written in this book.","zh":"","v":[]},{"ref":"Revelation 22:19","en":"If anyone takes away from the words of the book of this prophecy, God will take away his part from the tree of life, and out of the holy city, which are written in this book.","zh":"","v":[]},{"ref":"Revelation 22:20","en":"He who testifies these things says, “Yes, I am coming soon.” Amen! Yes, come, Lord Jesus!","zh":"","v":[]},{"ref":"Revelation 22:21","en":"The grace of the Lord Jesus Christ be with all the saints. Amen.","zh":"","v":[]}];
function loadRevelation(){
 const verses=BUILTIN_REVELATION_WEB.map(v=>({ref:v.ref,en:v.en,zh:v.zh,v:[]}));
 state.bible.revelationVerses=verses;
 const vocabularyCount=buildRevelationVocabulary(verses);
 revelationLoading=false;revelationError='';
 if(!state.bible.completed.length&&!Object.keys(state.bible.drafts||{}).length)state.bible.passage='rev-all';
 state.bible.verse=Math.min(Number(state.bible.verse)||0,verses.length-1);
 save();
 return vocabularyCount;
}
function norm(s){return String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').toLowerCase()}
function typeNormChar(ch){return String(ch).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').toLowerCase()}
function typingPosition(verse){let raw=state.bible.drafts[verse.ref]||'',a=Array.from(verse.en),b=Array.from(raw),pos=0;while(pos<Math.min(a.length,b.length)&&typeNormChar(a[pos])===typeNormChar(b[pos]))pos++;if(pos!==b.length){state.bible.drafts[verse.ref]=a.slice(0,pos).join('');save()}return pos}

function buildRevelationVocabulary(verses){
 const forms=new Set();
 (verses||[]).forEach(v=>String(v.en||'').match(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)?.forEach(t=>forms.add(t.toLowerCase().replace(/’/g,"'"))));
 const index={};forms.forEach(w=>{index[w]=WORD_GLOSSES[w]||REVELATION_WORD_GLOSSES[w]||COMMON_WORD_GLOSSES[w]||''});
 REVELATION_VOCABULARY=index;
 try{localStorage.setItem(REVELATION_VOCABULARY_KEY,JSON.stringify(index))}catch(e){console.warn('Vocabulary index storage skipped:',e)}
 return Object.keys(index).length;
}

function cleanWord(token){return token.toLowerCase().replace(/^[^a-z]+|[^a-z’']+$/g,'').replace(/[’]/g,"'")}
function getWordGloss(token,index,words,verse){let key=cleanWord(token);if(!key)return '';let pairs=verse.v||[];for(let i=0;i<pairs.length;i++){let phrase=String(pairs[i][0]).toLowerCase().replace(/[’]/g,"'");if(!phrase.includes(' ')&&phrase===key)return pairs[i][1]}
for(let i=0;i<pairs.length;i++){let phrase=String(pairs[i][0]).toLowerCase().replace(/[’]/g,"'");if(phrase.includes(' ')){let parts=phrase.split(/\s+/),begin=index-parts.length+1;if(begin>=0){let actual=words.slice(begin,index+1).map(cleanWord);if(actual.join(' ')===parts.join(' '))return pairs[i][1]}}}
for(let i=0;i<pairs.length;i++){let phrase=String(pairs[i][0]).toLowerCase().replace(/[’]/g,"'");if(!phrase.includes(' '))continue;let parts=phrase.split(/\s+/);for(let begin=Math.max(0,index-parts.length+1);begin<=index&&begin+parts.length<=words.length;begin++){if(index>=begin&&index<begin+parts.length&&words.slice(begin,begin+parts.length).map(cleanWord).join(' ')===parts.join(' '))return pairs[i][1]+'（短语）'}}return WORD_GLOSSES[key]||REVELATION_WORD_GLOSSES[key]||COMMON_WORD_GLOSSES[key]||REVELATION_VOCABULARY[key]||'本词释义暂未收录'}

function updateTypingUI(verse){let pos=typingPosition(verse),total=Array.from(verse.en).length,done=pos>=total,display=document.getElementById('typingDisplay'),progress=document.getElementById('typeProgress'),accuracy=document.getElementById('typeAccuracy'),count=document.getElementById('typeChars'),feedback=document.getElementById('typingFeedback'),translation=document.getElementById('typingTranslation');if(!display)return;display.innerHTML=typingMarkup(verse,pos,!!typingError);if(progress)progress.textContent=Math.round(pos/Math.max(1,total)*100)+'%';if(accuracy)accuracy.textContent=Math.round(pos/Math.max(1,pos+typingErrorCount)*100)+'%';if(count)count.textContent=pos+'/'+total;if(feedback){feedback.className='feedback '+(typingError?'bad':done?'good':'');feedback.textContent=typingError?'按键不正确：当前应输入 “'+(Array.from(verse.en)[pos]||'')+'”。删除错误输入后再继续；正确字符才会推进。':done?'本节经文已经完整输入！下方已显示整句中文译文。':'逐字输入英文；每个单词下方均有中文含义，可边看边理解经文。'}if(translation){translation.classList.toggle('hidden',!done);translation.innerHTML='<strong>'+esc(verse.ref)+(verse.zh?' · 中文对照':' · 完成提示')+'</strong><p>'+esc(verse.zh||'本节英文已完成。点击单词可听发音并查看词义提示。')+'</p>'}let stage=document.getElementById('typingStage');if(stage)stage.classList.toggle('is-complete',done)}
function typeBibleCharacter(ch){let verse=getVerse(),pos=typingPosition(verse),chars=Array.from(verse.en),expected=chars[pos];if(!expected)return;if(typeNormChar(ch)!==typeNormChar(expected)){typingError=ch;typingErrorCount++;updateTypingUI(verse);return}typingError='';state.bible.drafts[verse.ref]=chars.slice(0,pos+1).join('');if(pos+1>=chars.length)finishBibleVerse(verse);save();updateTypingUI(verse)}

function readerEnglishTokens(source,ref){

  if(!/^[A-Za-z]+(?:['’][A-Za-z]+)?$/.test(part))return esc(part);

  const key=ref+'|'+(wordIndex++)+'|'+part.toLowerCase();
  const progress=readerWordProgress(part),selected=state.bible.readerWord&&state.bible.readerWord.key===key;
  const chosen=state.bible.readerWordLevels||{},rating=chosen[part.toLowerCase()]||'unknown';
  const ratings=[['unknown','陌生'],['familiar','熟悉'],['known','掌握'],['fluent','熟练']];
  const panel=selected?'<span class="reader-inline-detail" role="group" aria-label="'+esc(part)+' 单词释义"><span class="reader-inline-top"><strong>'+esc(part)+'</strong><button class="sound" data-action="reader-pronounce" data-word="'+esc(part)+'" aria-label="播放发音">🔊</button></span><span class="reader-inline-phonetic">'+(READER_IPA[part]?' /'+esc(READER_IPA[part])+'/':'')+'</span><span class="reader-inline-meaning">'+esc(state.bible.readerDefinitions&&state.bible.readerDefinitions[part.toLowerCase()]||meaning)+'</span><span class="reader-ratings">'+ratings.map(x=>'<button class="reader-rating '+(rating===x[0]?'active':'')+'" data-action="reader-rate" data-rating="'+x[0]+'" data-word="'+esc(part)+'">'+x[1]+'</button>').join('')+'</span><span class="reader-inline-actions"><button class="btn secondary" data-action="reader-add-word">＋ 加入我的词库</button></span></span>':'';
  return '<span class="reader-word-wrap'+(selected?' is-open':'')+'"><button type="button" class="reader-word reader-token status-'+progress.status+(selected?' selected':'')+'" data-action="reader-word" data-word-key="'+esc(key)+'" data-word="'+esc(part)+'" data-meaning="'+esc(meaning)+'" data-phonetic="'+esc(READER_IPA[part]||'')+'" data-ref="'+esc(ref)+'" title="点击查看中文释义并播放发音">'+esc(part)+'</button>'+panel+'</span>';
 };
 return parts.map(part=>{
  if(READER_PHRASES.some(p=>p.toLowerCase()===part.toLowerCase())){
   const words=part.split(/([A-Za-z]+(?:['’][A-Za-z]+)?)/g).filter(Boolean).map(renderWord).join('');
   return '<span class="reader-phrase" title="固定短语">'+words+'</span>';
  }
  return renderWord(part);
 }).join('');
}
async function readerLookupWord(word){
 const cache=state.bible.readerDefinitions||(state.bible.readerDefinitions={}),key=String(word||'').toLowerCase();
 if(cache[key])return cache[key];
 let meaning='';
 try{
  const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key));
  if(response.ok){
   const data=await response.json(),defs=[];
   (Array.isArray(data)?data:[]).forEach(entry=>(entry.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{if(d.definition&&!defs.includes(d.definition))defs.push(d.definition)})));
   if(defs.length)meaning=await translateCustomText(defs.slice(0,2).join('; '));
  }
 }catch(error){console.warn('Reader word lookup failed:',error)}
 if(!meaning){try{meaning=await translateCustomText(word)}catch(error){meaning='暂时无法获取中文释义，请检查网络后重试。'}}
 cache[key]=meaning;save();

 if(selected&&String(selected.en).toLowerCase()===key){selected.meaning=meaning;const current=document.querySelector('.reader-inline-meaning');if(current)current.textContent=meaning;else renderPreservingScroll()}
 return meaning;
}

function swipeDirection(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down')}

function makeCode() { const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,''); }
function payloadFor(state) { const copy=JSON.parse(JSON.stringify(state));if(copy.bible)copy.bible.revelationVerses=[];const size=new TextEncoder().encode(JSON.stringify(copy)).length;if(size>800000)throw new Error('学习数据超过云端单文档安全容量，请先导出备份并联系我优化存储');return copy; }
async function ensureAuth(){if(!auth.currentUser)await signInAnonymously(auth)}
async function start(id,create){
 if(unsubscribe){unsubscribe();unsubscribe=null}await ensureAuth();
 const ref=doc(db,'syncData',id),snap=await getDoc(ref);
 if(create){if(snap.exists())throw new Error('配对码冲突，请重新创建');await setDoc(ref,{data:payloadFor(window.getAppState()),writer:clientId,clientUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}
 else{if(!snap.exists())throw new Error('没有找到这份云端数据，请检查配对码');const cloud=snap.data();if(!cloud.data)throw new Error('云端数据格式不正确');applyingRemote=true;try{window.applyCloudState(cloud.data)}finally{applyingRemote=false}}

 unsubscribe=onSnapshot(ref,snapshot=>{if(!snapshot.exists())return;const cloud=snapshot.data();if(!cloud||cloud.writer===clientId||!cloud.data||applyingRemote)return;clearTimeout(writeTimer);applyingRemote=true;try{window.applyCloudState(cloud.data)}finally{applyingRemote=false}},error=>{connected=false;console.error('Firebase sync listener:',error);if(window.showToast)window.showToast('云同步连接中断：'+error.message)});
 return id;
}
function queue(state){if(!activeRef||!connected||applyingRemote)return;clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{await setDoc(activeRef,{data:payloadFor(state),writer:clientId,clientUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}catch(e){console.error('Firebase sync write:',e);if(window.showToast)window.showToast('云端保存失败：'+e.message)}},1200)}
async function create(){const id=makeCode();await start(id,true);if(window.showToast)window.showToast('云端同步已开启');return id}
async function join(id){if(!/^[A-Za-z0-9_-]{43}$/.test(id))throw new Error('配对码格式不正确');await start(id,false);return id}
async function disconnect(){clearTimeout(writeTimer);if(unsubscribe)unsubscribe();unsubscribe=null;activeRef=null;connected=false;localStorage.removeItem('dailyEnglish.sync.v1')}
window.firebaseSync={create,join,disconnect,queue};
const saved=JSON.parse(localStorage.getItem('dailyEnglish.sync.v1')||'null');
if(saved&&saved.id)start(saved.id,false).catch(e=>{connected=false;console.error('Firebase sync startup:',e);if(window.showToast)window.showToast('云同步暂时无法连接：'+e.message)});
