<style>
:root{--ink:#202b20;--muted:#788078;--green:#263b29;--green2:#577b5b;--pale:#e5eee3;--paper:#f7f7f2;--line:#e9ece5;--shadow:0 8px 26px #1727170b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:0 14px calc(88px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9dbb9c;outline-offset:2px}.shell{max-width:680px;margin:auto}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--green2)}.date-label,.muted{color:var(--muted)}.date-label{font-size:12px}.hero{padding:10px 2px 0}.eyebrow{font-size:11px;color:var(--green2);font-weight:800;letter-spacing:1px}.hero h1{font-size:clamp(25px,6vw,32px);line-height:1.3;margin:8px 0 5px;letter-spacing:-.6px}.hero p{margin:0;color:var(--muted);font-size:13px}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.stat{background:white;border-radius:15px;padding:11px 12px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.card{background:white;border-radius:20px;padding:20px 17px;margin-top:13px;box-shadow:var(--shadow)}.progress-wrap{display:flex;align-items:center;gap:10px;margin:17px 2px 8px;color:var(--muted);font-size:11px}.progress{height:7px;flex:1;background:#e5e8df;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green2);border-radius:99px;transition:width .3s}.word-card{text-align:center;padding:18px 17px 17px;transition:transform .2s,box-shadow .2s}.word-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:#f0f3ed;color:#5d705e;font-size:10px;font-weight:750;white-space:nowrap}.word-line{display:flex;justify-content:center;align-items:center;gap:9px;margin:16px 0 2px}.word-button{border:0;background:transparent;color:var(--ink);font-size:clamp(34px,9vw,44px);font-weight:800;letter-spacing:-1px;padding:4px 0}.sound{border:0;background:var(--pale);color:var(--green);border-radius:50%;width:42px;height:42px;font-size:18px;flex:none}.phonetic{color:#8a928a;font-size:13px}.meaning{font-size:20px;font-weight:750;text-align:center;margin:0 0 12px}.answer{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);text-align:left;animation:fade-in .25s ease}@keyframes fade-in{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.example{padding:13px;background:#f8faf6;border-radius:13px;font-size:14px;line-height:1.65}.example-label{font-size:10px;color:var(--green2);font-weight:800;letter-spacing:.5px;margin-bottom:5px}.example p{margin:0}.example .zh{color:var(--muted);margin-top:4px}.play-example{border:0;background:transparent;color:var(--green2);font-size:12px;font-weight:700;padding:9px 2px 0}.actions{display:grid;gap:9px;margin-top:12px}.btn{border:0;border-radius:13px;padding:14px 15px;min-height:48px;font-weight:750}.btn-primary{background:var(--green);color:white}.btn-secondary{background:var(--pale);color:#426b45}.btn-quiet{background:#f1f3ef;color:#536153}.rating-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.rating{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 5px;color:var(--ink);font-size:13px;font-weight:750;transition:background .15s,border-color .15s,transform .15s}.rating:hover{background:#f5f8f2;border-color:#a9bea7;transform:translateY(-1px)}.rating small{display:block;color:var(--muted);font-weight:500;margin-top:4px;font-size:10px}.section-title{font-size:19px;margin:0 0 5px}.section-sub{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.small{font-size:11px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.nav-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:#818981;border-radius:11px;padding:6px 2px 5px;font-size:10px;min-height:48px}.nav button b{display:block;font-size:18px;font-weight:500;margin-bottom:1px}.nav button.active{background:#edf3ea;color:var(--green);font-weight:750}.panel{margin-top:12px}.field{width:100%;border:1px solid #dfe5dc;background:white;border-radius:12px;padding:12px;color:var(--ink);min-height:46px}.form-grid{display:grid;gap:11px}.label{display:block;font-weight:700;font-size:12px;margin:0 0 5px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs{display:flex;gap:7px;margin:8px 0 13px}.pill{border:0;background:#edf0ea;padding:9px 12px;border-radius:99px;font-size:11px;color:#586358}.pill.active{background:var(--green);color:#fff}.choice-list{display:grid;gap:8px;margin-top:12px}.choice{width:100%;min-height:46px;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;color:var(--ink)}.choice:disabled{cursor:default}.choice.correct{border-color:#88ad87;background:#edf6eb}.choice.wrong{border-color:#d4a39c;background:#fff2ef}.feedback{padding:11px;border-radius:12px;margin-top:10px;font-size:13px}.good{background:#edf6eb;color:#345a34}.bad{background:#fff2ef;color:#8a453d}.phrase-item{padding:13px 0;border-bottom:1px solid var(--line)}.phrase-item:last-child{border:0}.phrase-item p{margin:5px 0 0;color:var(--muted);font-size:12px}.danger{color:#a3483f;background:#fff0ee}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.empty h2{color:var(--ink);font-size:19px}.notice{font-size:11px;color:var(--muted);line-height:1.55}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.toggle-row input{width:20px;height:20px;accent-color:var(--green)}.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green);color:white;border-radius:99px;padding:10px 15px;font-size:12px;z-index:10;box-shadow:var(--shadow);white-space:nowrap}.hidden{display:none!important}@media(min-width:650px){body{padding-top:8px}.nav{padding-top:9px}.card{padding:22px}.word-card{padding:24px}.actions{grid-template-columns:1fr 1fr}.word-card .actions{grid-template-columns:1fr}}@media(max-width:360px){body{padding-left:10px;padding-right:10px}.rating-grid{gap:5px}.rating{font-size:12px}.rating small{font-size:9px}}
</style>

<body>
<div class="shell"><div class="topbar"><div class="brand">Daily <span>English.</span></div><div class="date-label" id="dateLabel"></div></div><div class="hero"><div class="eyebrow">A LITTLE EVERY DAY · 每日英语</div><h1>让英语，成为每天的好习惯。</h1><p id="planLine">为你安排今天的学习计划</p></div><div class="stats-row" id="summaryStats"></div><div id="app"></div></div>
<nav class="nav"><div class="nav-inner" id="nav"><button data-view="learn" class="active"><b>📖</b>单词</button><button data-view="listen"><b>🎧</b>听力</button><button data-view="speak"><b>🗣️</b>口语</button><button data-view="phrases"><b>✍️</b>我的词组</button><button data-view="stats"><b>📊</b>记录</button></div></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const WORDS=[
['actually','Actually','/ˈæk.tʃu.ə.li/','实际上；事实上','初级','常见词','Actually, I’m free this afternoon.','事实上，我今天下午有空。'],['improve','Improve','/ɪmˈpruːv/','提高；改善','初级','常见词','I’m trying to improve my English.','我正在努力提高英语。'],['habit','Habit','/ˈhæb.ɪt/','习惯','初级','常见词','I have a habit of reading before bed.','我有睡前阅读的习惯。'],['focus','Focus','/ˈfoʊ.kəs/','专注；焦点','初级','常见词','I can’t focus with all this noise.','这么吵我没法集中注意力。'],['available','Available','/əˈveɪ.lə.bəl/','有空的；可获得的','初级','常见词','Are you free for lunch tomorrow?','你明天有空一起吃午饭吗？'],['probably','Probably','/ˈprɑː.bə.bli/','很可能；大概','初级','常见词','I’ll probably take the train.','我大概会坐火车。'],['decide','Decide','/dɪˈsaɪd/','决定','初级','常见词','I can’t decide what to order.','我不知道该点什么。'],['experience','Experience','/ɪkˈspɪr.i.əns/','经验；经历','初级','常见词','Do you have customer service experience?','你有客户服务方面的经验吗？'],['confident','Confident','/ˈkɑːn.fə.dənt/','自信的；确信的','初级','常见词','I feel more confident speaking English now.','我现在说英语更有自信了。'],['opportunity','Opportunity','/ˌɑː.pɚˈtuː.nə.t̬i/','机会','初级','常见词','This is a great opportunity to learn.','这是一个很好的学习机会。'],['prepare','Prepare','/prɪˈper/','准备；预备','初级','常见词','I need to get ready for my meeting.','我得为会议做准备。'],['comfortable','Comfortable','/ˈkʌm.fɚ.t̬ə.bəl/','舒服的；自在的','初级','常见词','These shoes are really comfortable.','这双鞋真的很舒服。'],['consider','Consider','/kənˈsɪd.ɚ/','考虑；认为','中级','常见词','I’ll think about your suggestion.','我会考虑你的建议。'],['recommend','Recommend','/ˌrek.əˈmend/','推荐；建议','中级','常见词','Can you recommend a good coffee shop?','你能推荐一家不错的咖啡店吗？'],['require','Require','/rɪˈkwaɪr/','需要；要求','中级','常见词','This job requires strong communication skills.','这份工作需要很强的沟通能力。'],['effective','Effective','/ɪˈfek.tɪv/','有效的','中级','词缀：-ive','This is an effective way to save time.','这是节省时间的有效方法。'],['careless','Careless','/ˈker.ləs/','粗心的；不小心的','中级','词缀：-less','I made a careless mistake on the form.','我在表格上犯了个粗心的错误。'],['preview','Preview','/ˈpriː.vjuː/','预览；预告','中级','词缀：pre-','Can I take a quick look at the presentation first?','我可以先快速看一下演示文稿吗？'],['rewrite','Rewrite','/ˌriːˈraɪt/','重写；改写','中级','词缀：re-','I need to rewrite this email.','我需要重写这封邮件。'],['transport','Transport','/ˈtræn.spɔːrt/','交通运输；运送','中级','词根：port（携带）','Public transport is easy to use here.','这里的公共交通很方便。'],['predict','Predict','/prɪˈdɪkt/','预测；预言','中级','词根：dict（说）','It’s hard to predict the weather.','天气很难预测。'],['flexible','Flexible','/ˈflek.sə.bəl/','灵活的；可变通的','高级','词缀：-ible','My work schedule is pretty flexible.','我的工作时间比较灵活。'],['efficient','Efficient','/ɪˈfɪʃ.ənt/','效率高的；高效的','高级','词缀：-ent','The new system saves us a lot of time.','新系统帮我们节省了很多时间。'],['negotiate','Negotiate','/nɪˈɡoʊ.ʃi.eɪt/','协商；谈判','高级','常见词','Could we talk about a better price?','我们能谈谈更合适的价格吗？'],['substantial','Substantial','/səbˈstæn.ʃəl/','大量的；可观的；重要的','高级','词缀：-ial','The project needs a substantial investment.','这个项目需要大量投资。']
].map(([id,word,phonetic,meaning,level,category,en,zh])=>({id,word,phonetic,meaning,level,category,examples:[[en,zh]]}));
const KEY='dailyEnglish.v2',today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},offset=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return {level:'初级',autoPlay:false,view:'learn',cards:{},custom:[],daily:{date:'',ids:[],index:0},stats:{streak:0,lastStudy:'',unique:[],correct:0,attempts:0,studyDays:[]},listen:{mode:'choice'}}}function readState(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}'),d=defaults();return {...d,...saved,cards:saved.cards||{},custom:saved.custom||[],daily:{...d.daily,...saved.daily},stats:{...d.stats,...saved.stats},listen:{...d.listen,...saved.listen}}catch{return defaults()}}
let state=readState(),question=null,sentence='',timer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('浏览器存储空间不足，无法保存。')}}function entries(){return [...WORDS,...state.custom]}function byId(id){return entries().find(w=>w.id===id)}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>el.classList.add('hidden'),2000)}function activity(){const s=state.stats,t=today();if(s.lastStudy!==t){s.streak=s.lastStudy===offset(-1)?(s.streak||0)+1:1;s.lastStudy=t}if(!s.studyDays.includes(t))s.studyDays.push(t);save()}
function queue(){if(state.daily.date!==today()){const due=entries().filter(w=>state.cards[w.id]?.seen&&state.cards[w.id].due<=today()),fresh=entries().filter(w=>!state.cards[w.id]?.seen&&w.level===state.level),ids=[...due.slice(0,20).map(w=>w.id),...fresh.slice(0,Math.max(0,20-Math.min(20,due.length))).map(w=>w.id)];state.daily={date:today(),ids,index:0};save()}return state.daily.ids.map(byId).filter(Boolean)}function dueCount(){return entries().filter(w=>state.cards[w.id]?.seen&&state.cards[w.id].due<=today()).length}function say(text){if(!window.speechSynthesis){toast('此浏览器暂不支持语音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US'&&/Samantha|Google US English|Ava|Jenny|Aria/i.test(v.name))||voices.find(v=>v.lang==='en-US')||null;speechSynthesis.speak(u)}
function header(){const d=new Date();document.getElementById('dateLabel').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});const learned=Object.values(state.cards).filter(x=>x.seen).length,acc=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0;document.getElementById('summaryStats').innerHTML=`<div class="stat"><strong>🔥 ${state.stats.streak||0}</strong><span>连续学习天数</span></div><div class="stat"><strong>📚 ${learned}</strong><span>累计学习词条</span></div><div class="stat"><strong>🎯 ${acc}%</strong><span>练习正确率</span></div>`;document.getElementById('planLine').textContent=`${state.level}计划 · 待复习 ${dueCount()} 个 · 每日最多 20 个新词`}
function render(){header();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const app=document.getElementById('app');({learn:learn,listen:listen,speak:speakView,phrases:phrases,stats:statsView}[state.view]||learn)(app)}
function learn(app){const list=queue(),i=state.daily.index,w=list[i];let content;if(!w)content=`<div class="card empty"><div style="font-size:34px">🎉</div><h2>今日学习完成</h2><p>太棒了，明天继续保持这个好习惯。</p><button class="btn btn-secondary" data-action="reset">重新浏览今日词汇</button></div>`;else{const c=state.cards[w.id]||{},revealed=!!c.revealed,pct=list.length?Math.round(i/list.length*100):0;content=`<div class="progress-wrap"><span>今日进度</span><div class="progress"><div class="bar" style="width:${pct}%"></div></div><span>${i}/${list.length}</span></div><article class="card word-card"><div class="word-top"><span>${i+1} / ${list.length}${c.seen?' · 复习':''}</span><span class="tag">${esc(w.level)} · ${esc(w.category)}</span></div><div class="word-line"><button class="word-button" data-action="say" data-id="${esc(w.id)}" aria-label="播放单词发音">${esc(w.word)}</button><button class="sound" data-action="say" data-id="${esc(w.id)}" aria-label="播放发音">🔊</button></div><div class="phonetic">${esc(w.phonetic||'')} · 美式发音</div>${revealed?`<div class="answer"><div class="meaning">${esc(w.meaning)}</div><div class="example"><div class="example-label">日常表达</div><p>${esc(w.examples?.[0]?.[0]||w.word)}</p><p class="zh">${esc(w.examples?.[0]?.[1]||w.meaning)}</p><button class="play-example" data-action="say-example" data-id="${esc(w.id)}">🔊 播放例句</button></div></div>`:''}</article>${!revealed?'<div class="actions"><button class="btn btn-primary" data-action="reveal">查看释义和例句</button></div>':`<div class="rating-grid" aria-label="选择你对这个单词的掌握程度"><button class="rating" data-action="rate" data-rating="known">认识<small>7 天后复习</small></button><button class="rating" data-action="rate" data-rating="vague">模糊<small>明天复习</small></button><button class="rating" data-action="rate" data-rating="unknown">不认识<small>明天复习</small></button></div>`}`}app.innerHTML=`${content}<div class="card"><div class="row"><div><strong>今日计划</strong><div class="small muted" style="margin-top:4px">优先复习到期词汇，再学习新词</div></div><span class="tag">待复习 ${dueCount()}</span></div></div><div class="card row"><div><strong>学习设置</strong><div class="small muted" style="margin-top:4px">${esc(state.level)} · ${state.autoPlay?'自动发音开启':'自动发音关闭'}</div></div><button class="btn btn-quiet" style="min-height:40px;padding:8px 12px" data-action="settings">设置</button></div>`;if(w&&state.autoPlay&&!c.autoSpoken){state.cards[w.id]={...c,autoSpoken:true};save();setTimeout(()=>say(w.word),250)}}
function listen(app){app.innerHTML=`<section class="panel"><div class="card"><h2 class="section-title">听力训练</h2><p class="section-sub">听清楚再作答，练习结果会计入正确率。</p><div class="tabs"><button class="pill ${state.listen.mode==='choice'?'active':''}" data-action="mode" data-mode="choice">听音选中文</button><button class="pill ${state.listen.mode==='dictation'?'active':''}" data-action="mode" data-mode="dictation">听写单词</button></div>${question?questionHTML():'<div class="empty">🎧<p>准备好开始了吗？</p><button class="btn btn-primary" data-action="start">开始练习</button></div>'}</div></section>`}function questionHTML(){const q=question;if(state.listen.mode==='choice')return `<button class="btn btn-secondary" style="width:100%" data-action="play">▶ 播放英文</button><div class="choice-list">${q.options.map(x=>`<button class="choice ${q.done?(x.id===q.word.id?'correct':x.id===q.selected?'wrong':''):''}" data-action="choose" data-id="${esc(x.id)}" ${q.done?'disabled':''}>${esc(x.meaning)}</button>`).join('')}</div>${q.done?`<div class="feedback ${q.correct?'good':'bad'}">${q.correct?'回答正确！':'再听一遍也没关系。'} ${esc(q.word.word)} · ${esc(q.word.meaning)}</div><button class="btn btn-primary" style="width:100%;margin-top:10px" data-action="nextq">下一题</button>`:''}`;return `<button class="btn btn-secondary" style="width:100%" data-action="play">▶ 播放单词</button><div class="form-grid" style="margin-top:13px"><label class="label" for="dictation">听音输入英文单词</label><input id="dictation" class="field" autocomplete="off" autocapitalize="none" placeholder="Type what you hear" ${q.done?'disabled':''} value="${esc(q.input||'')}"><button class="btn btn-primary" data-action="check" ${q.done?'disabled':''}>检查答案</button></div>${q.done?`<div class="feedback ${q.correct?'good':'bad'}">${q.correct?'拼写正确！':'正确拼写：'} <strong>${esc(q.word.word)}</strong></div><button class="btn btn-primary" style="width:100%;margin-top:10px" data-action="nextq">下一题</button>`:''}`}
function newQuestion(){const all=entries(),word=all[Math.floor(Math.random()*all.length)],others=all.filter(x=>x.id!==word.id).sort(()=>Math.random()-.5).slice(0,3);question={word,options:[word,...others].sort(()=>Math.random()-.5),done:false,correct:false,input:''};render()}
function speakView(app){if(!sentence){const w=entries()[Math.floor(Math.random()*entries().length)];sentence=w?.examples?.[0]?.[0]||'How are you today?'}const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);app.innerHTML=`<section class="panel"><div class="card"><h2 class="section-title">口语跟读</h2><p class="section-sub">先听示范，再大声跟读。允许麦克风权限后，可查看识别结果。</p><div class="example" style="text-align:center;padding:19px 13px"><div class="example-label">DAILY EXPRESSION</div><div style="font-size:20px;font-weight:750;line-height:1.5">${esc(sentence)}</div></div><div class="actions"><button class="btn btn-secondary" data-action="say-sentence">🔊 听示范</button><button class="btn btn-primary" data-action="record">🎙️ 开始跟读</button></div><div id="speechResult" class="feedback hidden"></div><p class="notice">${supported?'语音识别由浏览器提供，效果取决于设备与环境。':'此浏览器不支持语音识别，仍可播放并自行跟读。'}</p><button class="btn btn-quiet" style="width:100%" data-action="new-sentence">换一句</button></div></section>`}
function phrases(app){app.innerHTML=`<section class="panel"><div class="card"><h2 class="section-title">我的记忆词组</h2><p class="section-sub">添加个人词汇；保存后会加入词库和复习计划。</p><form id="phraseForm" class="form-grid"><div><label class="label" for="customWord">英文单词 / 词组</label><input class="field" id="customWord" required maxlength="60" placeholder="例如：Could you give me a hand?"></div><div><label class="label" for="customMeaning">中文释义</label><input class="field" id="customMeaning" required maxlength="100" placeholder="例如：你能帮我一下吗？"></div><div class="two-col"><div><label class="label" for="customLevel">学习难度</label><select class="field" id="customLevel"><option>初级</option><option>中级</option><option>高级</option></select></div><div><label class="label" for="customCategory">分类</label><select class="field" id="customCategory"><option>自定义词组</option><option>旅行</option><option>工作</option><option>日常交流</option></select></div></div><div><label class="label" for="customEn">例句（英文，可选）</label><input class="field" id="customEn" maxlength="160" placeholder="添加一个生活场景"></div><div><label class="label" for="customZh">例句中文（可选）</label><input class="field" id="customZh" maxlength="160" placeholder="填写例句翻译"></div><button class="btn btn-primary">＋ 保存到我的词库</button></form></div><div class="card"><div class="row"><strong>已保存词组</strong><span class="tag">${state.custom.length} 条</span></div>${state.custom.length?state.custom.slice().reverse().map(w=>`<div class="phrase-item"><div class="row"><strong>${esc(w.word)}</strong><button class="btn danger" style="min-height:34px;padding:6px 10px" data-action="delete" data-id="${esc(w.id)}">删除</button></div><p>${esc(w.meaning)} · ${esc(w.level)} · ${esc(w.category)}</p></div>`).join(''):'<div class="empty">还没有自定义词组，添加第一条吧。</div>'}</div></section>`}
function statsView(app){const learned=Object.values(state.cards).filter(x=>x.seen).length,acc=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0,days=(state.stats.studyDays||[]).slice(-7).reverse();app.innerHTML=`<section class="panel"><div class="card"><h2 class="section-title">你的学习记录</h2><p class="section-sub">进度保存在当前浏览器中；清除浏览器数据可能导致记录丢失。</p><div class="stats-row" style="margin-bottom:0"><div class="stat"><strong>🔥 ${state.stats.streak||0}</strong><span>连续天数</span></div><div class="stat"><strong>📚 ${learned}</strong><span>学过的词条</span></div><div class="stat"><strong>🎯 ${acc}%</strong><span>正确率</span></div></div></div><div class="card"><strong>最近学习</strong>${days.length?days.map(d=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(d)}</span><span class="tag">已学习</span></div>`).join(''):'<p class="small muted">开始学习后，这里会显示学习日期。</p>'}</div><div class="card row"><div><strong>学习水平与发音</strong><div class="small muted" style="margin-top:4px">${esc(state.level)} · 自动播放${state.autoPlay?'开启':'关闭'}</div></div><button class="btn btn-quiet" style="min-height:40px;padding:8px 12px" data-action="settings">设置</button></div><div class="card"><div class="row"><span class="muted">练习题数</span><strong>${state.stats.attempts||0}</strong></div><div class="row" style="margin-top:10px"><span class="muted">答对题数</span><strong>${state.stats.correct||0}</strong></div><div class="row" style="margin-top:10px"><span class="muted">待复习</span><strong>${dueCount()}</strong></div></div></section>`}
function settings(){document.getElementById('app').innerHTML=`<section class="panel"><div class="card"><div class="row"><h2 class="section-title">学习设置</h2><button class="btn btn-quiet" style="min-height:38px;padding:7px 11px" data-action="close-settings">完成</button></div><p class="section-sub">按英语水平安排新词；复习词会优先出现。</p><label class="label" for="levelSelect">当前英语水平</label><select id="levelSelect" class="field"><option ${state.level==='初级'?'selected':''}>初级</option><option ${state.level==='中级'?'selected':''}>中级</option><option ${state.level==='高级'?'selected':''}>高级</option></select><div class="toggle-row"><div><strong>自动播放单词发音</strong><div class="small muted">进入词卡时播放美式发音</div></div><input id="autoPlayToggle" type="checkbox" ${state.autoPlay?'checked':''}></div><p class="notice">发音使用设备浏览器提供的英语语音。首次播放可能需要点击页面。</p><button class="btn btn-primary" style="width:100%" data-action="save-settings">保存设置</button></div></section>`}
function rate(r){const w=queue()[state.daily.index];if(!w)return;const old=state.cards[w.id]||{},days=r==='known'?(old.seen?14:7):1;state.cards[w.id]={...old,seen:true,due:offset(days),rating:r,reviewedAt:today(),revealed:false,autoSpoken:false};if(!state.stats.unique.includes(w.id))state.stats.unique.push(w.id);state.daily.index++;activity();render()}
function startRecord(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('当前浏览器不支持语音识别');return}try{const rec=new SR();rec.lang='en-US';rec.interimResults=false;const el=document.getElementById('speechResult');el.textContent='正在聆听，请开始跟读…';el.classList.remove('hidden','good','bad');rec.onresult=e=>{const text=e.results[0][0].transcript,ok=text.toLowerCase().replace(/[^a-z]/g,'')===sentence.toLowerCase().replace(/[^a-z]/g,'');el.textContent=`${ok?'跟读完成！':'识别结果：'}${text}`;el.classList.add(ok?'good':'bad');activity()};rec.onerror=()=>{el.textContent='没有识别到语音，请检查麦克风权限。';el.classList.remove('good');el.classList.add('bad')};rec.start()}catch{toast('无法启动麦克风，请检查浏览器权限')}}
function action(b){const a=b.dataset.action;if(a==='say'){const w=byId(b.dataset.id);if(w)say(w.word)}else if(a==='say-example'){const w=byId(b.dataset.id);if(w)say(w.examples?.[0]?.[0]||w.word)}else if(a==='reveal'){const w=queue()[state.daily.index];if(w){state.cards[w.id]={...(state.cards[w.id]||{}),revealed:true};render()}}else if(a==='rate')rate(b.dataset.rating);else if(a==='reset'){state.daily.index=0;render()}else if(a==='settings')settings();else if(a==='close-settings'){state.view='learn';render()}else if(a==='save-settings'){state.level=document.getElementById('levelSelect').value;state.autoPlay=document.getElementById('autoPlayToggle').checked;state.daily.date='';save();toast('设置已保存');render()}else if(a==='mode'){state.listen.mode=b.dataset.mode;question=null;save();render()}else if(a==='start')newQuestion();else if(a==='play'&&question)say(question.word.word);else if(a==='choose'&&question&&!question.done){question.selected=b.dataset.id;question.correct=question.selected===question.word.id;question.done=true;state.stats.attempts++;if(question.correct)state.stats.correct++;activity();render()}else if(a==='nextq')newQuestion();else if(a==='check'&&question&&!question.done){question.input=(document.getElementById('dictation').value||'').trim();question.correct=question.input.toLowerCase().replace(/[^a-z']/g,'')===question.word.word.toLowerCase().replace(/[^a-z']/g,'');question.done=true;state.stats.attempts++;if(question.correct)state.stats.correct++;activity();render()}else if(a==='say-sentence')say(sentence);else if(a==='record')startRecord();else if(a==='new-sentence'){sentence='';render()}else if(a==='delete'){const w=byId(b.dataset.id);if(!w?.isCustom||!confirm(`确定删除“${w.word}”吗？`))return;state.custom=state.custom.filter(x=>x.id!==w.id);delete state.cards[w.id];state.daily.date='';save();render()}}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){question=null;state.view=b.dataset.view;save();render()}});document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b)});document.getElementById('app').addEventListener('submit',e=>{if(e.target.id!=='phraseForm')return;e.preventDefault();const fd=new FormData(e.target),word=String(fd.get('customWord')).trim(),meaning=String(fd.get('customMeaning')).trim(),en=String(fd.get('customEn')||'').trim(),zh=String(fd.get('customZh')||'').trim(),w={id:`custom-${Date.now()}`,word,phonetic:'',meaning,level:String(fd.get('customLevel')),category:String(fd.get('customCategory')),examples:[[en||word,zh||meaning]],isCustom:true};state.custom.push(w);save();activity();toast('已添加到个人词库');render()});
render();
</script>
</body>
</html>
