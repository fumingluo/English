function openTtsCache(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}
  const req=indexedDB.open('dailyEnglishAudioCache',1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('audio'))db.createObjectStore('audio',{keyPath:'key'})};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function readTtsCache(key){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readonly'),req=tx.objectStore('audio').get(key);
  req.onsuccess=()=>{const item=req.result;resolve(item?.blob||null);db.close()};
  req.onerror=()=>{db.close();reject(req.error)};
 });
}
async function writeTtsCache(key,blob){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio');
  store.put({key,blob,used:Date.now()});
  tx.oncomplete=()=>{
   db.close();
   trimTtsCache().catch(()=>{});
   resolve();
  };
  tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function trimTtsCache(){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio'),items=[];
  const req=store.openCursor();
  req.onsuccess=()=>{const cursor=req.result;if(cursor){items.push({key:cursor.key,used:cursor.value.used||0});cursor.continue()}else{
   items.sort((a,b)=>b.used-a.used);items.slice(80).forEach(x=>store.delete(x.key));
  }};
  tx.oncomplete=()=>{db.close();resolve()};
  tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function say(text){
 const phrase=String(text||'').trim();
 if(!phrase)return;
 if(currentTtsAudio){currentTtsAudio.pause();currentTtsAudio=null}
 if(currentTtsObjectUrl){URL.revokeObjectURL(currentTtsObjectUrl);currentTtsObjectUrl=null}
 if(window.speechSynthesis)window.speechSynthesis.cancel();
 const key=phrase.toLowerCase();
 try{
  let blob=await readTtsCache(key);
  if(!blob){
   const response=await fetch(TTS_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:phrase})});
   if(!response.ok)throw new Error('TTS request failed: '+response.status);
   blob=await response.blob();
   if(!blob.type.includes('audio'))throw new Error('Invalid audio response');
   writeTtsCache(key,blob).catch(()=>{});
  }
  const url=URL.createObjectURL(blob),audio=new Audio(url);
  currentTtsAudio=audio;currentTtsObjectUrl=url;
  audio.onended=()=>{if(currentTtsAudio===audio)currentTtsAudio=null;if(currentTtsObjectUrl===url){URL.revokeObjectURL(url);currentTtsObjectUrl=null}};
  audio.onerror=()=>{if(currentTtsAudio===audio){currentTtsAudio=null;fallbackSay(phrase)}if(currentTtsObjectUrl===url){URL.revokeObjectURL(url);currentTtsObjectUrl=null}};
  await audio.play();
 }catch(error){
  console.warn('AI voice unavailable; using system voice.',error);
  fallbackSay(phrase);
 }
}

for(let i=0;i<pairs.length;i++){let phrase=String(pairs[i][0]).toLowerCase().replace(/[’]/g,"'");if(!phrase.includes(' '))continue;let parts=phrase.split(/\s+/);for(let begin=Math.max(0,index-parts.length+1);begin<=index&&begin+parts.length<=words.length;begin++){if(index>=begin&&index<begin+parts.length&&words.slice(begin,begin+parts.length).map(cleanWord).join(' ')===parts.join(' '))return pairs[i][1]+'（短语）'}}return WORD_GLOSSES[key]||REVELATION_WORD_GLOSSES[key]||'本词释义暂未收录'}

else if(a==='reader-level'){state.bible.readerLevel=Number(b.dataset.level)||1;state.bible.readerWord=null;save();renderPreservingScroll()}
else if(a==='reader-rate'){state.bible.readerWordLevels=Object.assign({},state.bible.readerWordLevels||{},{[b.dataset.word]:b.dataset.rating});save();renderPreservingScroll();showToast('熟练度已保存')}
else if(a==='reader-retry'){window.readerCuvError=false;window.readerCuvLoading=false;renderPreservingScroll()}

else if(a==='reader-add-word'){let x=state.bible.readerWord;if(x){let id='bible-'+x.en.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(!allWords().some(w=>w.id===id)){state.custom.push({id,word:x.en,phonetic:'',meaning:x.meaning,level:state.level,category:'启示录词汇',en:x.en,zh:'',isCustom:true});save();showToast('已加入个人词库和复习系统')}else showToast('这个词已经在个人词库中');renderPreservingScroll()}}
else if(a==='reader-prev'||a==='reader-next'){state.bible.readerChapter=Math.max(1,Math.min(22,(Number(state.bible.readerChapter)||1)+(a==='reader-next'?1:-1)));state.bible.readerWord=null;save();renderPreservingScroll()}

else if(a==='load-revelation')loadRevelation()
else if(a==='verse-play'){let v=getVerse();if(v)say(v.en)}
else if(a==='verse-add-words'){let v=getVerse(),n=0;(v.v||[]).forEach(t=>{let id='bible-'+t[0].toLowerCase().replace(/[^a-z0-9]+/g,'-');if(!allWords().some(w=>w.id===id)){state.custom.push({id:id,word:t[0],phonetic:'',meaning:t[1],level:state.level,category:'圣经词汇',en:v.en,zh:v.zh,isCustom:true});n++}});save();showToast(n?'已添加 '+n+' 个经文词汇':'本节词汇已经全部加入')}
else if(a==='add-one-word')addBibleWord(b.dataset.word,b.dataset.meaning)
else if(a==='focus-typing'){let el=document.getElementById('typingCapture');if(el)el.focus()}
else if(a==='restart-typing'){clearTimeout(bibleAdvanceTimer);let v=getVerse();state.bible.drafts[v.ref]='';typingError='';typingErrorCount=0;save();render();let el=document.getElementById('typingCapture');if(el)el.focus()}
else if(a==='prev-verse'){clearTimeout(bibleAdvanceTimer);state.bible.verse=Math.max(0,state.bible.verse-1);save();render()}
else if(a==='next-verse'){clearTimeout(bibleAdvanceTimer);let p=getPassage();state.bible.verse=Math.min(p.verses.length-1,state.bible.verse+1);save();render()}
else if(a==='save-settings'){state.level=document.getElementById('quickLevel').value;state.autoPlay=document.getElementById('autoplay').checked;state.daily.date='';save();showToast('设置已保存');render()}
else if(a==='delete-word'){state.custom=state.custom.filter(w=>w.id!==b.dataset.id);state.daily.date='';save();render()}
else if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='daily-english-backup.json';link.click();URL.revokeObjectURL(url)}
else if(a==='reset-data'){if(confirm('确定清空本机学习数据、复习记录和自定义词组吗？此操作无法撤销。')){localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);state=blank();render()}}
}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;question=null;save();render()});
document.getElementById('app').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){action(b);return}let card=e.target.closest('.minimal-word-card[data-swipe-card]');if(card&&Date.now()>suppressWordCardClickUntil){let w=wordById(card.dataset.swipeId);if(w)say(w.word)}});
document.addEventListener('click',e=>{if(!state.bible.readerWord||state.view!=='reader')return;if(e.target.closest('.reader-word-wrap')||e.target.closest('[data-action="reader-word"]'))return;state.bible.readerWord=null;renderPreservingScroll()});
function swipeDirection(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down')}
function paintSwipe(g,dx,dy){let card=g.area,dir=swipeDirection(dx,dy),angle=Math.max(-11,Math.min(11,dx*.04));if(g.lastDir!==dir){card.classList.remove('drag-right','drag-left','drag-up','drag-down');card.classList.add('drag-'+dir);g.lastDir=dir}card.style.transform='translate3d('+dx+'px,'+dy+'px,0) rotate('+angle+'deg)'}
function resetSwipe(g){let card=g.area;if(!card||!card.isConnected)return;card.classList.remove('is-dragging','drag-right','drag-left','drag-up','drag-down');card.classList.add('is-returning');card.style.transform='translate3d(0,0,0) rotate(0deg)';card.style.opacity='1';setTimeout(()=>card.classList.remove('is-returning'),220)}
document.getElementById('app').addEventListener('pointerdown',e=>{let area=e.target.closest('[data-swipe-card]');if(!area||e.pointerType==='mouse')return;swipeGesture={area:area,x:e.clientX,y:e.clientY,id:area.dataset.swipeId,mode:area.dataset.swipeMode,pointerId:e.pointerId,lastDir:''};area.classList.add('is-dragging')});
document.addEventListener('pointermove',e=>{let g=swipeGesture;if(!g||e.pointerId!==g.pointerId)return;let dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.abs(dx)+Math.abs(dy)>5){suppressWordCardClickUntil=Date.now()+450;paintSwipe(g,dx,dy)}},{passive:true});
document.addEventListener('pointerup',e=>{let g=swipeGesture;if(!g)return;swipeGesture=null;if(e.pointerId!==g.pointerId||!g.area.isConnected)return;let dx=e.clientX-g.x,dy=e.clientY-g.y,dir=swipeDirection(dx,dy);if(Math.hypot(dx,dy)<48){resetSwipe(g);return}suppressWordCardClickUntil=Date.now()+500;g.area.classList.remove('is-dragging','drag-right','drag-left','drag-up','drag-down');g.area.classList.add('is-committing');let distance=Math.max(window.innerWidth,window.innerHeight)*.85,tx=dir==='right'?distance:dir==='left'?-distance:dx,ty=dir==='up'?-distance:dir==='down'?distance:dy,rotation=dir==='right'?13:dir==='left'?-13:Math.max(-7,Math.min(7,dx*.03));g.area.style.transform='translate3d('+tx+'px,'+ty+'px,0) rotate('+rotation+'deg)';g.area.style.opacity='0';setTimeout(()=>{if(!g.area.isConnected)return;if(dir==='down'){if(g.mode==='auto-review'){resetSwipe(g);showToast('待复习单词按到期顺序处理');return}goPreviousWord(g.mode);return}let rating=dir==='right'?'known':dir==='left'?'vague':'unknown';schedule(g.id,rating,g.mode==='auto-review'?'auto':g.mode==='review'?'review':false)},230)});
document.addEventListener('pointercancel',()=>{if(swipeGesture)resetSwipe(swipeGesture);swipeGesture=null});
document.getElementById('app').addEventListener('submit',e=>{if(e.target.id!=='phraseForm')return;e.preventDefault();let word=document.getElementById('cw').value.trim(),meaning=document.getElementById('cm').value.trim(),phonetic=document.getElementById('cp').value.trim(),en=document.getElementById('ce').value.trim(),zh=document.getElementById('cz').value.trim();if(!word||!meaning)return;getDaily();let addedId='custom-'+Date.now();state.custom.push({id:addedId,word:word,phonetic:phonetic,meaning:meaning,level:state.level,category:'自定义词组',en:en||word,zh:zh,isCustom:true});if(state.daily.date===today()&&!state.daily.ids.includes(addedId))state.daily.ids.splice(Math.max(0,Number(state.daily.index)||0),0,addedId);save();markActivity();render();showToast('已添加到个人词库')});
document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data.cards||!data.stats)throw new Error('invalid');state=Object.assign(blank(),data);save();render();showToast('备份导入成功')}catch(err){showToast('备份文件格式不正确')}};reader.readAsText(e.target.files[0])}else if(e.target.id==='importBible'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result),list=Array.isArray(data)?data:data.passages;if(!Array.isArray(list)||!list.length)throw new Error('invalid');let valid=list.filter(p=>p&&p.id&&p.title&&Array.isArray(p.verses)&&p.verses.length&&p.verses.every(v=>v.ref&&v.en&&v.zh));if(!valid.length)throw new Error('invalid');let merged=allPassages().filter(p=>!valid.some(v=>v.id===p.id));state.bible.extraPassages=merged.filter(p=>!BIBLE.some(b=>b.id===p.id)).concat(valid);state.bible.passage=valid[0].id;state.bible.verse=0;save();state.view='bible';render();showToast('已导入 '+valid.length+' 个经文段落')}catch(err){showToast('经文 JSON 格式不正确，请检查字段是否齐全')}};reader.readAsText(e.target.files[0])}});
if(state.daily.date!==today()){state.daily.date='';state.daily.ids=[];state.daily.index=0;save()}
if(state.view==='speak')state.view='learn';
if(dueWords().length)state.view='learn';
render();
if(!Array.isArray(state.bible.revelationVerses)||state.bible.revelationVerses.length<400)loadRevelation();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyDo1BJtg_2zeDJd8ghjL1uVpNSOuAaIGy8",
  authDomain: "english-b4e20.firebaseapp.com",

  appId: "1:859690901300:web:8e354d22acc65cdc978f61",
  measurementId: "G-NRKS4LCP7X"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const CLIENT_KEY = 'dailyEnglish.client.v1';
let clientId = localStorage.getItem(CLIENT_KEY);
if (!clientId) { clientId = crypto.randomUUID(); localStorage.setItem(CLIENT_KEY, clientId); }
let activeRef = null, unsubscribe = null, writeTimer = null, connected = false, applyingRemote = false;
function makeCode() { const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,''); }
function payloadFor(state) { const copy=JSON.parse(JSON.stringify(state));if(copy.bible)copy.bible.revelationVerses=[];const size=new TextEncoder().encode(JSON.stringify(copy)).length;if(size>800000)throw new Error('学习数据超过云端单文档安全容量，请先导出备份并联系我优化存储');return copy; }
async function ensureAuth(){if(!auth.currentUser)await signInAnonymously(auth)}
async function start(id,create){
 if(unsubscribe){unsubscribe();unsubscribe=null}await ensureAuth();
 const ref=doc(db,'syncData',id),snap=await getDoc(ref);
 if(create){if(snap.exists())throw new Error('配对码冲突，请重新创建');await setDoc(ref,{data:payloadFor(window.getAppState()),writer:clientId,clientUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}
 else{if(!snap.exists())throw new Error('没有找到这份云端数据，请检查配对码');const cloud=snap.data();if(!cloud.data)throw new Error('云端数据格式不正确');applyingRemote=true;try{window.applyCloudState(cloud.data)}finally{applyingRemote=false}}
 activeRef=ref;localStorage.setItem('dailyEnglish.sync.v1',JSON.stringify({id}));connected=true;
 unsubscribe=onSnapshot(ref,snapshot=>{if(!snapshot.exists())return;const cloud=snapshot.data();if(!cloud||cloud.writer===clientId||!cloud.data||applyingRemote)return;clearTimeout(writeTimer);applyingRemote=true;try{window.applyCloudState(cloud.data)}finally{applyingRemote=false}},error=>{connected=false;console.error('Firebase sync listener:',error);if(window.showToast)window.showToast('云同步连接中断：'+error.message)});
 return id;
}
function queue(state){if(!activeRef||!connected||applyingRemote)return;clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{await setDoc(activeRef,{data:payloadFor(state),writer:clientId,clientUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}catch(e){console.error('Firebase sync write:',e);if(window.showToast)window.showToast('云端保存失败：'+e.message)}},1200)}
async function create(){const id=makeCode();await start(id,true);if(window.showToast)window.showToast('云端同步已开启');return id}
async function join(id){if(!/^[A-Za-z0-9_-]{43}$/.test(id))throw new Error('配对码格式不正确');await start(id,false);return id}
async function disconnect(){clearTimeout(writeTimer);if(unsubscribe)unsubscribe();unsubscribe=null;activeRef=null;connected=false;localStorage.removeItem('dailyEnglish.sync.v1')}
window.firebaseSync={create,join,disconnect,queue};
const saved=JSON.parse(localStorage.getItem('dailyEnglish.sync.v1')||'null');
if(saved&&saved.id)start(saved.id,false).catch(e=>{connected=false;console.error('Firebase sync startup:',e);if(window.showToast)window.showToast('云同步暂时无法连接：'+e.message)});
