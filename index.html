<!DOCTYPE html>
<html lang="zh-CN">

<title>Daily English · 每日英语</title>
<style>
:root{--ink:#202b20;--muted:#788078;--green:#263b29;--green2:#577b5b;--pale:#e5eee3;--paper:#f7f7f2;--line:#e9ece5;--shadow:0 8px 26px #1727170b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:0 14px calc(88px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.shell{max-width:680px;margin:auto}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.brand span{color:var(--green2)}.date-label,.muted{color:var(--muted)}.date-label{font-size:12px}.hero{padding:10px 2px 0}.eyebrow{font-size:11px;color:var(--green2);font-weight:800;letter-spacing:1px}.hero h1{font-size:clamp(25px,6vw,32px);line-height:1.3;margin:8px 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.stat{background:white;border-radius:15px;padding:11px 12px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.card{background:white;border-radius:20px;padding:20px 17px;margin-top:13px;box-shadow:var(--shadow)}.progress-wrap{display:flex;align-items:center;gap:10px;margin:17px 2px 8px;color:var(--muted);font-size:11px}.progress{height:7px;flex:1;background:#e5e8df;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green2);border-radius:99px}.word-card{text-align:center;padding:18px 17px}.word-top,.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.word-top{font-size:11px;color:var(--muted)}.tag{padding:5px 9px;border-radius:99px;background:#f0f3ed;color:#5d705e;font-size:10px;font-weight:750}.word-line{display:flex;justify-content:center;align-items:center;gap:9px;margin:16px 0 2px}.word-button{border:0;background:transparent;color:var(--ink);font-size:clamp(34px,9vw,44px);font-weight:800;padding:4px}.sound{border:0;background:var(--pale);color:var(--green);border-radius:50%;width:42px;height:42px;font-size:18px}.phonetic{color:#8a928a;font-size:13px}.answer{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);text-align:left}.meaning{text-align:center;font-size:20px;font-weight:750;margin:0 0 12px}.example{padding:13px;background:#f8faf6;border-radius:13px;font-size:14px;line-height:1.65}.example-label{font-size:10px;color:var(--green2);font-weight:800;margin-bottom:5px}.example p{margin:0}.example .zh{color:var(--muted);margin-top:4px}.btn{border:0;border-radius:13px;padding:14px 15px;min-height:46px;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:var(--pale);color:#426b45}.quiet{background:#f1f3ef;color:#536153}.actions{display:grid;gap:9px;margin-top:12px}.rating-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.rating{min-height:58px;border:1px solid var(--line);background:white;border-radius:13px;font-size:13px;font-weight:750;color:var(--ink)}.rating small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:4px}.section-title{font-size:19px;margin:0 0 5px}.section-sub{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 14px}.small{font-size:11px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.nav-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:#818981;border-radius:11px;padding:6px 2px;min-height:48px;font-size:10px}.nav button b{display:block;font-size:18px;font-weight:500}.nav button.active{background:#edf3ea;color:var(--green);font-weight:750}.field{width:100%;border:1px solid #dfe5dc;background:white;border-radius:12px;padding:12px;min-height:44px}.form-grid{display:grid;gap:11px}.label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.choice-list{display:grid;gap:8px;margin-top:12px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;min-height:44px}.choice.correct{background:#edf6eb;border-color:#88ad87}.choice.wrong{background:#fff2ef;border-color:#d4a39c}.feedback{margin-top:10px;padding:11px;border-radius:12px;font-size:13px}.good{background:#edf6eb;color:#345a34}.bad{background:#fff2ef;color:#8a453d}.tabs{display:flex;gap:7px;margin:12px 0}.pill{border:0;border-radius:99px;padding:9px 12px;background:#edf0ea;font-size:11px}.pill.active{background:var(--green);color:#fff}.phrase{padding:12px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 14px;border-radius:99px;font-size:12px;z-index:9}@media(min-width:650px){body{padding-top:8px}.card{padding:22px}.word-card{padding:24px}.actions{grid-template-columns:1fr 1fr}.word-card .actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell"><div class="topbar"><div class="brand">Daily <span>English.</span></div><div class="date-label" id="dateLabel"></div></div><div class="hero"><div class="eyebrow">A LITTLE EVERY DAY · 每日英语</div><h1>让英语，成为每天的好习惯。</h1><p id="planLine">为你安排今天的学习计划</p></div><div class="stats-row" id="summaryStats"></div><main id="app" aria-live="polite"></main></div>
<nav class="nav"><div class="nav-inner" id="nav"><button data-view="learn" class="active"><b>📖</b>单词</button><button data-view="listen"><b>🎧</b>听力</button><button data-view="speak"><b>🗣️</b>口语</button><button data-view="phrases"><b>✍️</b>我的词组</button><button data-view="stats"><b>📊</b>记录</button></div></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const WORDS=[
{id:'actually',word:'Actually',phonetic:'/ˈæk.tʃu.ə.li/',meaning:'实际上；事实上',level:'初级',category:'常见词',en:'Actually, I’m free this afternoon.',zh:'事实上，我今天下午有空。'},
{id:'improve',word:'Improve',phonetic:'/ɪmˈpruːv/',meaning:'提高；改善',level:'初级',category:'常见词',en:'I’m trying to improve my English.',zh:'我正在努力提高英语。'},
{id:'habit',word:'Habit',phonetic:'/ˈhæb.ɪt/',meaning:'习惯',level:'初级',category:'常见词',en:'I have a habit of reading before bed.',zh:'我有睡前阅读的习惯。'},
{id:'focus',word:'Focus',phonetic:'/ˈfoʊ.kəs/',meaning:'专注；焦点',level:'初级',category:'常见词',en:'I can’t focus with all this noise.',zh:'这么吵我没法集中注意力。'},
{id:'available',word:'Available',phonetic:'/əˈveɪ.lə.bəl/',meaning:'有空的；可获得的',level:'初级',category:'常见词',en:'Are you free for lunch tomorrow?',zh:'你明天有空一起吃午饭吗？'},
{id:'probably',word:'Probably',phonetic:'/ˈprɑː.bə.bli/',meaning:'很可能；大概',level:'初级',category:'常见词',en:'I’ll probably take the train.',zh:'我大概会坐火车。'},
{id:'decide',word:'Decide',phonetic:'/dɪˈsaɪd/',meaning:'决定',level:'初级',category:'常见词',en:'I can’t decide what to order.',zh:'我不知道该点什么。'},
{id:'experience',word:'Experience',phonetic:'/ɪkˈspɪr.i.əns/',meaning:'经验；经历',level:'初级',category:'常见词',en:'Do you have customer service experience?',zh:'你有客户服务方面的经验吗？'},
{id:'confident',word:'Confident',phonetic:'/ˈkɑːn.fə.dənt/',meaning:'自信的；确信的',level:'初级',category:'常见词',en:'I feel more confident speaking English now.',zh:'我现在说英语更有自信了。'},
{id:'opportunity',word:'Opportunity',phonetic:'/ˌɑː.pɚˈtuː.nə.t̬i/',meaning:'机会',level:'初级',category:'常见词',en:'This is a great opportunity to learn.',zh:'这是一个很好的学习机会。'},
{id:'prepare',word:'Prepare',phonetic:'/prɪˈper/',meaning:'准备；预备',level:'初级',category:'常见词',en:'I need to get ready for my meeting.',zh:'我得为会议做准备。'},
{id:'comfortable',word:'Comfortable',phonetic:'/ˈkʌm.fɚ.t̬ə.bəl/',meaning:'舒服的；自在的',level:'初级',category:'常见词',en:'These shoes are really comfortable.',zh:'这双鞋真的很舒服。'},
{id:'consider',word:'Consider',phonetic:'/kənˈsɪd.ɚ/',meaning:'考虑；认为',level:'中级',category:'常见词',en:'I’ll think about your suggestion.',zh:'我会考虑你的建议。'},
{id:'recommend',word:'Recommend',phonetic:'/ˌrek.əˈmend/',meaning:'推荐；建议',level:'中级',category:'常见词',en:'Can you recommend a good coffee shop?',zh:'你能推荐一家不错的咖啡店吗？'},
{id:'require',word:'Require',phonetic:'/rɪˈkwaɪr/',meaning:'需要；要求',level:'中级',category:'常见词',en:'This job requires strong communication skills.',zh:'这份工作需要很强的沟通能力。'},
{id:'effective',word:'Effective',phonetic:'/ɪˈfek.tɪv/',meaning:'有效的',level:'中级',category:'词缀：-ive',en:'This is an effective way to save time.',zh:'这是节省时间的有效方法。'},
{id:'careless',word:'Careless',phonetic:'/ˈker.ləs/',meaning:'粗心的；不小心的',level:'中级',category:'词缀：-less',en:'I made a careless mistake on the form.',zh:'我在表格上犯了个粗心的错误。'},
{id:'preview',word:'Preview',phonetic:'/ˈpriː.vjuː/',meaning:'预览；预告',level:'中级',category:'词缀：pre-',en:'Can I take a quick look at the presentation first?',zh:'我可以先快速看一下演示文稿吗？'},
{id:'rewrite',word:'Rewrite',phonetic:'/ˌriːˈraɪt/',meaning:'重写；改写',level:'中级',category:'词缀：re-',en:'I need to rewrite this email.',zh:'我需要重写这封邮件。'},
{id:'transport',word:'Transport',phonetic:'/ˈtræn.spɔːrt/',meaning:'交通运输；运送',level:'中级',category:'词根：port（携带）',en:'Public transport is easy to use here.',zh:'这里的公共交通很方便。'},
{id:'predict',word:'Predict',phonetic:'/prɪˈdɪkt/',meaning:'预测；预言',level:'中级',category:'词根：dict（说）',en:'It’s hard to predict the weather.',zh:'天气很难预测。'},
{id:'flexible',word:'Flexible',phonetic:'/ˈflek.sə.bəl/',meaning:'灵活的；可变通的',level:'高级',category:'词缀：-ible',en:'My work schedule is pretty flexible.',zh:'我的工作时间比较灵活。'},
{id:'efficient',word:'Efficient',phonetic:'/ɪˈfɪʃ.ənt/',meaning:'效率高的；高效的',level:'高级',category:'词缀：-ent',en:'The new system saves us a lot of time.',zh:'新系统帮我们节省了很多时间。'},
{id:'negotiate',word:'Negotiate',phonetic:'/nɪˈɡoʊ.ʃi.eɪt/',meaning:'协商；谈判',level:'高级',category:'常见词',en:'Could we talk about a better price?',zh:'我们能谈谈更合适的价格吗？'},
{id:'substantial',word:'Substantial',phonetic:'/səbˈstæn.ʃəl/',meaning:'大量的；可观的；重要的',level:'高级',category:'词缀：-ial',en:'The project needs a substantial investment.',zh:'这个项目需要大量投资。'}];
const KEY='dailyEnglish.v2';
function dateOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function today(){return dateOf(new Date())}function after(n){const d=new Date();d.setDate(d.getDate()+n);return dateOf(d)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function blank(){return {level:'初级',autoPlay:false,view:'learn',cards:{},custom:[],daily:{date:'',ids:[],index:0},stats:{streak:0,lastStudy:'',unique:[],correct:0,attempts:0,studyDays:[]},listenMode:'choice'}}function load(){try{var old=JSON.parse(localStorage.getItem(KEY)||'{}');var s=blank();s.level=old.level||s.level;s.autoPlay=!!old.autoPlay;s.view=['learn','listen','speak','phrases','stats'].indexOf(old.view)>=0?old.view:'learn';s.cards=old.cards&&typeof old.cards==='object'?old.cards:{};s.custom=Array.isArray(old.custom)?old.custom:[];s.daily=Object.assign(s.daily,old.daily||{});s.stats=Object.assign(s.stats,old.stats||{});if(!Array.isArray(s.stats.unique))s.stats.unique=[];if(!Array.isArray(s.stats.studyDays))s.stats.studyDays=[];s.listenMode=old.listenMode||((old.listen||{}).mode)||'choice';return s}catch(e){return blank()}}
var state=load(),question=null,currentSentence='',timer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){showToast('无法保存数据，请检查浏览器存储设置。')}}function allWords(){return WORDS.concat(state.custom)}function wordById(id){return allWords().find(function(w){return w.id===id})}function showToast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(function(){e.classList.add('hidden')},2000)}function activity(){if(state.stats.lastStudy!==today()){state.stats.streak=state.stats.lastStudy===after(-1)?(state.stats.streak||0)+1:1;state.stats.lastStudy=today()}if(state.stats.studyDays.indexOf(today())<0)state.stats.studyDays.push(today());save()}
function due(){return allWords().filter(function(w){var c=state.cards[w.id];return c&&c.seen&&c.due<=today()})}function daily(){if(state.daily.date!==today()){var d=due().slice(0,20),newWords=allWords().filter(function(w){return !state.cards[w.id]||!state.cards[w.id].seen? w.level===state.level:false}),ids=d.map(function(w){return w.id});newWords.slice(0,Math.max(0,20-ids.length)).forEach(function(w){ids.push(w.id)});state.daily={date:today(),ids:ids,index:0};save()}return state.daily.ids.map(wordById).filter(Boolean)}
function speak(text){if(!window.speechSynthesis){showToast('浏览器不支持语音播放');return}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;window.speechSynthesis.speak(u)}
function header(){document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});var learned=Object.keys(state.cards).filter(function(k){return state.cards[k]&&state.cards[k].seen}).length,acc=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0;document.getElementById('summaryStats').innerHTML='<div class="stat"><strong>🔥 '+state.stats.streak+'</strong><span>连续学习天数</span></div><div class="stat"><strong>📚 '+learned+'</strong><span>累计学习词条</span></div><div class="stat"><strong>🎯 '+acc+'%</strong><span>练习正确率</span></div>';document.getElementById('planLine').textContent=state.level+'计划 · 待复习 '+due().length+' 个 · 每日最多 20 个新词'}
function render(){try{header();document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===state.view)});var views={learn:learn,listen:listen,speak:speakView,phrases:phrases,stats:statsView};(views[state.view]||learn)(document.getElementById('app'))}catch(e){document.getElementById('app').innerHTML='<div class="card empty"><h2>页面加载遇到问题</h2><p>请刷新页面重试。如果问题持续，请清除本站点缓存后重新打开。</p><button class="btn primary" onclick="localStorage.removeItem(\'dailyEnglish.v2\');location.reload()">重置本地学习状态</button></div>';console.error(e)}}
function learn(app){var words=daily(),i=state.daily.index,w=words[i],html='';if(!w){html='<div class="card empty"><div style="font-size:32px">🎉</div><h2>今日学习完成</h2><p>明天继续保持这个好习惯。</p><button class="btn secondary" data-action="reset">重新浏览今日词汇</button></div>'}else{var c=state.cards[w.id]||{},pct=Math.round(i/words.length*100);html='<div class="progress-wrap"><span>今日进度</span><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><span>'+(i+1)+'/'+words.length+'</span></div><article class="card word-card"><div class="word-top"><span>'+(i+1)+' / '+words.length+(c.seen?' · 复习':'')+'</span><span class="tag">'+esc(w.level)+' · '+esc(w.category)+'</span></div><div class="word-line"><button class="word-button" data-action="say" data-id="'+esc(w.id)+'">'+esc(w.word)+'</button><button class="sound" data-action="say" data-id="'+esc(w.id)+'">🔊</button></div><div class="phonetic">'+esc(w.phonetic||'')+' · 美式发音</div>'+(c.revealed?'<div class="answer"><div class="meaning">'+esc(w.meaning)+'</div><div class="example"><div class="example-label">日常表达</div><p>'+esc(w.en||w.word)+'</p><p class="zh">'+esc(w.zh||w.meaning)+'</p><button class="play-example" data-action="example" data-id="'+esc(w.id)+'">🔊 播放例句</button></div></div>':'')+'</article>'+(c.revealed?'<div class="rating-grid"><button class="rating" data-action="rate" data-rating="known">认识<small>7 天后复习</small></button><button class="rating" data-action="rate" data-rating="vague">模糊<small>明天复习</small></button><button class="rating" data-action="rate" data-rating="unknown">不认识<small>明天复习</small></button></div>':'<div class="actions"><button class="btn primary" data-action="reveal">查看释义和例句</button></div>');if(state.autoPlay&&!c.autoSpoken){state.cards[w.id]=Object.assign({},c,{autoSpoken:true});save();setTimeout(function(){speak(w.word)},250)}}app.innerHTML=html+'<div class="card row"><div><strong>今日计划</strong><div class="small muted">优先复习到期词汇，再学习新词</div></div><span class="tag">待复习 '+due().length+'</span></div><div class="card row"><div><strong>学习设置</strong><div class="small muted">'+esc(state.level)+' · 自动发音'+(state.autoPlay?'开启':'关闭')+'</div></div><button class="btn quiet" data-action="settings">设置</button></div>'}
function listen(app){app.innerHTML='<div class="card"><h2 class="section-title">听力训练</h2><p class="section-sub">听音选中文，或听写英文单词。</p><div class="tabs"><button class="pill '+(state.listenMode==='choice'?'active':'')+'" data-action="mode" data-mode="choice">听音选中文</button><button class="pill '+(state.listenMode==='dictation'?'active':'')+'" data-action="mode" data-mode="dictation">听写单词</button></div>'+(question?questionHTML():'<div class="empty">🎧<p>准备好开始了吗？</p><button class="btn primary" data-action="start">开始练习</button></div>')+'</div>'}
function questionHTML(){var q=question;if(state.listenMode==='choice')return '<button class="btn secondary" style="width:100%" data-action="play">▶ 播放英文</button><div class="choice-list">'+q.options.map(function(w){return '<button class="choice '+(q.done?(w.id===q.word.id?'correct':w.id===q.selected?'wrong':''):'')+'" data-action="choose" data-id="'+esc(w.id)+'" '+(q.done?'disabled':'')+'>'+esc(w.meaning)+'</button>'}).join('')+'</div>'+(q.done?'<div class="feedback '+(q.correct?'good':'bad')+'">'+(q.correct?'回答正确！':'再听一遍也没关系。')+' '+esc(q.word.word)+'</div><button class="btn primary" data-action="next">下一题</button>':'');return '<button class="btn secondary" style="width:100%" data-action="play">▶ 播放单词</button><div class="form-grid"><label class="label" for="dictation">听音输入英文单词</label><input id="dictation" class="field" autocomplete="off" placeholder="Type what you hear" '+(q.done?'disabled':'')+'><button class="btn primary" data-action="check" '+(q.done?'disabled':'')+'>检查答案</button></div>'+(q.done?'<div class="feedback '+(q.correct?'good':'bad')+'">正确拼写：'+esc(q.word.word)+'</div><button class="btn primary" data-action="next">下一题</button>':'')}
function newQuestion(){var a=allWords(),w=a[Math.floor(Math.random()*a.length)],others=a.filter(function(x){return x.id!==w.id}).sort(function(){return Math.random()-.5}).slice(0,3);question={word:w,options:[w].concat(others).sort(function(){return Math.random()-.5}),done:false,correct:false};render()}
function speakView(app){if(!currentSentence){var w=allWords()[Math.floor(Math.random()*allWords().length)];currentSentence=w.en||w.word}app.innerHTML='<div class="card"><h2 class="section-title">口语跟读</h2><p class="section-sub">先听示范，再大声跟读练习。</p><div class="example"><div class="example-label">DAILY EXPRESSION</div><p>'+esc(currentSentence)+'</p></div><div class="actions"><button class="btn secondary" data-action="sentence">🔊 听示范</button><button class="btn primary" data-action="record">🎙️ 跟读识别</button></div><p class="small muted">语音识别支持情况取决于浏览器；不支持时也可以自行跟读。</p><div id="speechResult" class="feedback hidden"></div><button class="btn quiet" data-action="new-sentence">换一句</button></div>'}
function phrases(app){app.innerHTML='<div class="card"><h2 class="section-title">我的记忆词组</h2><p class="section-sub">添加个人单词或短语，保存后加入复习计划。</p><form id="phraseForm" class="form-grid"><div><label class="label" for="cw">英文单词 / 词组</label><input class="field" id="cw" required maxlength="60" placeholder="例如：Could you help me?"></div><div><label class="label" for="cm">中文释义</label><input class="field" id="cm" required maxlength="100"></div><div class="row"><select class="field" id="cl"><option>初级</option><option>中级</option><option>高级</option></select><select class="field" id="cc"><option>自定义词组</option><option>旅行</option><option>工作</option><option>日常交流</option></select></div><div><label class="label" for="ce">例句（可选）</label><input class="field" id="ce" maxlength="160"></div><button class="btn primary">＋ 保存词组</button></form></div><div class="card"><strong>已保存词组 · '+state.custom.length+'</strong>'+(state.custom.length?state.custom.slice().reverse().map(function(w){return '<div class="phrase"><div class="row"><strong>'+esc(w.word)+'</strong><button class="btn quiet" data-action="delete" data-id="'+esc(w.id)+'">删除</button></div><div class="small muted">'+esc(w.meaning)+' · '+esc(w.level)+'</div></div>'}).join(''):'<p class="empty">还没有自定义词组。</p>')+'</div>'}
function statsView(app){var learned=Object.keys(state.cards).filter(function(k){return state.cards[k]&&state.cards[k].seen}).length,accuracy=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0;app.innerHTML='<div class="card"><h2 class="section-title">学习记录</h2><p class="section-sub">学习进度保存在当前浏览器中。</p><div class="stats-row"><div class="stat"><strong>🔥 '+state.stats.streak+'</strong><span>连续天数</span></div><div class="stat"><strong>📚 '+learned+'</strong><span>学习词条</span></div><div class="stat"><strong>🎯 '+accuracy+'%</strong><span>练习正确率</span></div></div></div><div class="card"><div class="row"><strong>学习水平</strong><button class="btn quiet" data-action="settings">设置</button></div><p class="small muted">'+esc(state.level)+' · 待复习 '+due().length+' 个</p><label class="label" for="quickLevel">调整水平</label><select class="field" id="quickLevel"><option>初级</option><option>中级</option><option>高级</option></select><button class="btn secondary" data-action="set-level">保存水平</button></div>'}
function settings(){var app=document.getElementById('app');app.innerHTML='<div class="card"><h2 class="section-title">学习设置</h2><label class="label" for="level">英语水平</label><select class="field" id="level"><option '+(state.level==='初级'?'selected':'')+'>初级</option><option '+(state.level==='中级'?'selected':'')+'>中级</option><option '+(state.level==='高级'?'selected':'')+'>高级</option></select><label class="row" style="margin:14px 0"><span>自动播放发音</span><input id="autoplay" type="checkbox" '+(state.autoPlay?'checked':'')+'></label><button class="btn primary" data-action="save-settings">保存设置</button><button class="btn quiet" data-action="close-settings">返回</button></div>'}
function rate(r){var w=daily()[state.daily.index];if(!w)return;var c=state.cards[w.id]||{},days=r==='known'?(c.seen?14:7):1;state.cards[w.id]=Object.assign({},c,{seen:true,due:after(days),rating:r,revealed:false,autoSpoken:false});state.daily.index++;activity();render()}
function startRecognition(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){showToast('此浏览器不支持语音识别');return}var rec=new R();rec.lang='en-US';var out=document.getElementById('speechResult');out.classList.remove('hidden');out.textContent='正在聆听…';rec.onresult=function(e){out.textContent='识别结果：'+e.results[0][0].transcript;out.classList.remove('hidden')};rec.onerror=function(){out.textContent='识别失败，请检查麦克风权限。'};rec.start()}
function action(b){var a=b.dataset.action;if(a==='say'){var w=wordById(b.dataset.id);if(w)speak(w.word)}else if(a==='example'){var w=wordById(b.dataset.id);if(w)speak(w.en||w.word)}else if(a==='reveal'){var w=daily()[state.daily.index];if(w){state.cards[w.id]=Object.assign({},state.cards[w.id]||{},{revealed:true});save();render()}}else if(a==='rate')rate(b.dataset.rating);else if(a==='reset'){state.daily.index=0;render()}else if(a==='settings')settings();else if(a==='save-settings'){state.level=document.getElementById('level').value;state.autoPlay=document.getElementById('autoplay').checked;state.daily.date='';save();render()}else if(a==='close-settings')render();else if(a==='mode'){state.listenMode=b.dataset.mode;question=null;save();render()}else if(a==='start')newQuestion();else if(a==='play'&&question)speak(question.word.word);else if(a==='choose'&&question&&!question.done){question.selected=b.dataset.id;question.correct=question.selected===question.word.id;question.done=true;state.stats.attempts++;if(question.correct)state.stats.correct++;activity();render()}else if(a==='check'&&question&&!question.done){question.correct=document.getElementById('dictation').value.trim().toLowerCase()===question.word.word.toLowerCase();question.done=true;state.stats.attempts++;if(question.correct)state.stats.correct++;activity();render()}else if(a==='next')newQuestion();else if(a==='sentence')speak(currentSentence);else if(a==='record')startRecognition();else if(a==='new-sentence'){currentSentence='';render()}else if(a==='delete'){state.custom=state.custom.filter(function(w){return w.id!==b.dataset.id});state.daily.date='';save();render()}else if(a==='set-level'){state.level=document.getElementById('quickLevel').value;state.daily.date='';save();render()}}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;question=null;save();render()});document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(b)action(b)});document.getElementById('app').addEventListener('submit',function(e){if(e.target.id!=='phraseForm')return;e.preventDefault();var word=document.getElementById('cw').value.trim(),meaning=document.getElementById('cm').value.trim(),en=document.getElementById('ce').value.trim();state.custom.push({id:'custom-'+Date.now(),word:word,phonetic:'',meaning:meaning,level:document.getElementById('cl').value,category:document.getElementById('cc').value,en:en||word,zh:meaning,isCustom:true});save();activity();render()});
render();
</script>
</body>
</html>
