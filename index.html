<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:0 14px calc(92px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.shell{max-width:720px;margin:auto}.topbar{height:44px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.brand span{color:var(--green2)}.date-label,.muted{color:var(--muted)}.date-label{font-size:12px}.hero{display:none}.stats-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:5px 0 10px}.stat{background:white;border-radius:12px;padding:7px 10px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}.card{background:white;border-radius:20px;padding:20px 17px;margin-top:13px;box-shadow:var(--shadow)}.progress-wrap{display:flex;align-items:center;gap:10px;margin:17px 2px 8px;color:var(--muted);font-size:11px}.progress{height:7px;flex:1;background:#e5e8df;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green2);border-radius:99px;transition:width .2s}.word-card{text-align:center;padding:18px 17px}.word-top,.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.word-top{font-size:11px;color:var(--muted)}.tag{padding:5px 9px;border-radius:99px;background:#f0f3ed;color:#5d705e;font-size:10px;font-weight:750}.word-line{display:flex;justify-content:center;align-items:center;gap:9px;margin:16px 0 2px}.word-button{border:0;background:transparent;color:var(--ink);font-size:clamp(34px,9vw,44px);font-weight:800;padding:4px}.sound{border:0;background:var(--pale);color:var(--green);border-radius:50%;width:42px;height:42px;font-size:18px}.phonetic{color:#8a928a;font-size:13px}.answer{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);text-align:left}.meaning{text-align:center;font-size:20px;font-weight:750;margin:0 0 12px}.example{padding:13px;background:#f8faf6;border-radius:13px;font-size:14px;line-height:1.65}.example-label{font-size:10px;color:var(--green2);font-weight:800;margin-bottom:5px}.example p{margin:0}.example .zh{color:var(--muted);margin-top:4px}.btn{border:0;border-radius:13px;padding:13px 15px;min-height:44px;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:var(--pale);color:#426b45}.quiet{background:#f1f3ef;color:#536153}.gold{background:#f7f0df;color:var(--gold)}.danger{background:#f8e9e6;color:var(--red)}.actions{display:grid;gap:9px;margin-top:12px}.rating-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.rating{min-height:58px;border:1px solid var(--line);background:white;border-radius:13px;font-size:13px;font-weight:750;color:var(--ink)}.rating small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:4px}.section-title{font-size:19px;margin:0 0 5px}.section-sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 14px}.small{font-size:11px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.nav-inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.nav button{border:0;background:transparent;color:#818981;border-radius:11px;padding:6px 1px;min-height:48px;font-size:10px;white-space:nowrap}.nav button b{display:block;font-size:18px;font-weight:500}.nav button.active{background:#edf3ea;color:var(--green);font-weight:750}.field{width:100%;border:1px solid #dfe5dc;background:white;border-radius:12px;padding:12px;min-height:44px;color:var(--ink)}.form-grid{display:grid;gap:11px}.label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.choice-list{display:grid;gap:8px;margin-top:12px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;min-height:44px}.choice.correct{background:#edf6eb;border-color:#88ad87}.choice.wrong{background:#fff2ef;border-color:#d4a39c}.feedback{margin-top:10px;padding:11px;border-radius:12px;font-size:13px;line-height:1.6}.good{background:#edf6eb;color:#345a34}.bad{background:#fff2ef;color:#8a453d}.tabs{display:flex;gap:7px;margin:12px 0}.pill{border:0;border-radius:99px;padding:9px 12px;background:#edf0ea;font-size:11px}.pill.active{background:var(--green);color:#fff}.phrase{padding:12px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 14px;border-radius:99px;font-size:12px;z-index:9;max-width:90%;text-align:center}.field-label{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px}.verse-en{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.8;color:#263426}.verse-zh{font-size:14px;line-height:1.8;color:#727a70;margin-top:9px}.verse-ref{font-size:11px;font-weight:800;color:var(--green2);letter-spacing:.4px}.typing-box{width:100%;min-height:130px;resize:vertical;border:1.5px solid #dfe5dc;border-radius:14px;padding:14px;background:#fcfdfb;color:var(--ink);font-size:16px;line-height:1.7;outline:none}.typing-box:focus{border-color:#8da78b}.typing-box:disabled{background:#f2f5f0}.typing-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{background:#f6f8f4;border-radius:12px;padding:10px;text-align:center}.metric strong{display:block;font-size:18px}.metric span{font-size:10px;color:var(--muted)}.key-words{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.key-word{border:0;border-radius:99px;background:#f0f3ed;padding:7px 10px;color:#4f684d;font-size:11px}.review-item{padding:12px 0;border-bottom:1px solid var(--line)}.review-item:last-child{border:0}.interval-list{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.interval{background:#f5f7f2;border-radius:11px;text-align:center;padding:9px 4px}.interval b{display:block;font-size:14px}.interval span{font-size:10px;color:var(--muted)}.toast{pointer-events:none}
/* Compact non-home header and interactive review stages */
.topbar{height:48px}.shell.compact-page .hero,.shell.compact-page>#summaryStats{display:none}.shell.compact-page .topbar{height:44px}/* Typing-tutor style Bible practice */
.typing-stage{position:relative;border:1.5px solid #dfe6dc;border-radius:16px;background:#fbfcf9;padding:18px 15px;min-height:150px;overflow:hidden;cursor:text;}
.typing-display{position:relative;z-index:1;font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,5vw,23px);line-height:2.45;color:#9ba49a;white-space:normal;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;}
.typing-word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 .12em .24em 0;}
.typing-letters{display:inline-flex;white-space:pre;}
.typing-char{display:inline-block;min-width:.56em;text-align:center;border-radius:4px;transition:background .08s,color .08s;}
.typing-char.done{color:#4c7950;}
.typing-char.pending{color:#9ba49a;}
.typing-char.current{color:#203a23;background:#e4f0df;box-shadow:0 2px 0 #769b72;font-weight:800;}
.typing-char.current.error{color:#8f352d;background:#f8deda;box-shadow:0 2px 0 #c77c72;}
.typing-gloss{display:block;min-height:15px;max-width:96px;margin-top:2px;padding:0 2px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:10px;line-height:1.25;color:#557b53;white-space:normal;overflow-wrap:anywhere;text-align:center;font-weight:500;}
.typing-space{white-space:pre;}
.typing-capture{position:absolute;z-index:3;inset:0;width:100%;height:100%;opacity:.012;color:transparent;background:transparent;border:0;outline:0;caret-color:transparent;font-size:16px;cursor:text;}
.typing-capture::selection{background:transparent;}
.typing-instruction{font-size:11px;color:#818a80;margin:10px 2px 0;line-height:1.6;}
.typing-live-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;}
.typing-translation{margin-top:12px;padding:14px;border-radius:13px;background:#edf4e9;border:1px solid #dbe8d7;}
.typing-translation strong{display:block;font-size:11px;color:#52744f;margin-bottom:5px;}
.typing-translation p{margin:0;font-size:15px;line-height:1.8;color:#334b32;}
.typing-focus-btn{margin-top:10px;width:100%;}
@media(min-width:650px){body{padding-top:8px}.card{padding:22px}.word-card{padding:24px}.actions{grid-template-columns:1fr 1fr}.word-card .actions{grid-template-columns:1fr 1fr}.rating-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:380px){.nav button{font-size:9px}.nav button b{font-size:17px}.card{padding:17px 14px}.rating{font-size:12px}}

/* Compact Bible typing + mobile swipe cards */
.typing-stage{padding:9px 11px;min-height:86px;border-radius:13px}
.typing-display{font-size:clamp(17px,4.5vw,20px);line-height:1.85}
.typing-word{display:inline-block;vertical-align:baseline;margin:0 .1em .06em 0;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}
.typing-word:hover,.typing-word:focus-visible{background:#eef4e9;border-radius:4px;outline:none}
.typing-capture{z-index:0;opacity:0;pointer-events:none}
.typing-instruction{font-size:10px;margin:5px 2px 0;line-height:1.4}
.typing-metrics{margin:7px 0}.metric{padding:6px}.metric strong{font-size:15px}.metric span{font-size:9px}
.typing-translation{margin-top:8px;padding:10px}.typing-translation p{font-size:13px;line-height:1.6}
.bible-view .card{padding:12px 14px;margin-top:8px}.bible-view .section-title{font-size:17px}
.bible-view .actions{display:flex;gap:7px;margin-top:8px}.bible-view .btn{padding:9px 11px;min-height:38px;font-size:12px}
.minimal-word-card{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 16px;text-align:center}
.minimal-word-card .word-button{font-size:clamp(38px,11vw,52px);line-height:1.2;padding:10px 8px;max-width:100%;overflow-wrap:anywhere}
.minimal-word-card .reveal-word-btn{min-width:132px}
.minimal-word-card .answer{width:100%;margin-top:0;padding-top:15px}
.minimal-word-card .meaning{font-size:20px;margin-bottom:12px}
.minimal-word-card .example{width:100%;text-align:left}
.word-card[data-swipe-card]{position:relative;overflow:hidden;touch-action:none;overscroll-behavior:contain;border-radius:18px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transform:translate3d(0,0,0);transition:transform .22s cubic-bezier(.2,.75,.25,1),opacity .18s ease,background-color .12s ease;will-change:transform,opacity}
.word-card[data-swipe-card].is-dragging{transition:none;cursor:grabbing}.word-card[data-swipe-card].is-returning{transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .16s ease}.word-card[data-swipe-card].is-committing{transition:transform .22s cubic-bezier(.18,.72,.25,1),opacity .18s ease;pointer-events:none}
.word-card[data-swipe-card].drag-right{background:#e8f5e8}.word-card[data-swipe-card].drag-left{background:#fff8e8}.word-card[data-swipe-card].drag-up{background:#fff0ed}.word-card[data-swipe-card].drag-down{background:#eef2f6}
.word-card[data-swipe-card].swipe-enter{animation:swipeCardEnter .18s ease-out both}@keyframes swipeCardEnter{from{opacity:.65;transform:translate3d(0,12px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
.rating-grid.desktop-ratings{grid-template-columns:repeat(3,1fr)}
@media(max-width:650px){
.topbar{height:40px}
.rating-grid.desktop-ratings{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
.rating-grid.desktop-ratings .rating{min-height:48px;padding:6px 2px;font-size:12px}
.rating-grid.desktop-ratings .rating small{font-size:9px;margin-top:2px}
.minimal-word-card{width:100%;min-height:210px;padding:20px 14px;margin:6px 0;gap:12px}
.minimal-word-card .word-button{font-size:clamp(36px,10vw,52px);padding:8px 6px}
.minimal-word-card .reveal-word-btn{min-height:42px;min-width:136px;font-size:13px}
.minimal-word-card .answer{padding-top:10px}
.minimal-word-card .meaning{font-size:18px;margin-bottom:7px}
.minimal-word-card .example{font-size:12px;line-height:1.5}
.word-phonetic{font-size:14px;letter-spacing:.25px;color:#748174;margin-top:-8px;min-height:18px}
#app>.row{margin-top:5px!important}
#app>.small.muted{text-align:center}
}
@media(min-width:651px){.word-phonetic{font-size:15px;letter-spacing:.3px;color:#748174;margin-top:-14px;min-height:20px}}

/* Progressive Chinese-English Revelation reader */
.reader-layout{display:block;margin-top:12px}
.reader-article{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);min-width:0}
.reader-verse{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;line-height:2.15;margin:0 0 14px;color:#283629}
.reader-ref{display:inline-block;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#8b9688;margin:0 7px 0 0;vertical-align:middle}
.reader-word{display:inline;border:0;border-radius:5px;background:#f5edcf;color:#765c20;padding:1px 3px;font:inherit;font-weight:700;line-height:inherit;text-decoration:underline;text-decoration-color:#d8bd76;text-underline-offset:3px}
.reader-word.status-familiar{background:#e3efff;color:#315b91;text-decoration-color:#8bb2e4}
.reader-word.status-known{background:#e5eee3;color:#426b45;text-decoration-color:#8eb28d}
.reader-word.status-fluent{background:transparent;color:#758276;text-decoration:none;font-weight:500}
.reader-word.selected{outline:2px solid #91b18c}
.reader-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.reader-controls select{max-width:180px}
.reader-detail{background:#f4f7f1;border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.65}
.reader-detail strong{font-size:18px}
.reader-word-wrap{position:relative;display:inline-block;vertical-align:baseline;white-space:normal;z-index:4}
.reader-inline-detail{position:absolute;z-index:4;left:50%;top:auto;bottom:calc(100% + 9px);transform:translateX(-50%);display:block;width:min(270px,78vw);padding:12px;background:#fff;border:1px solid #dce6d8;border-radius:14px;box-shadow:0 9px 28px #1d321d24;text-align:left;white-space:normal;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.reader-inline-detail:before{content:"";position:absolute;left:50%;top:auto;bottom:-6px;width:10px;height:10px;background:#fff;border-right:1px solid #dce6d8;border-bottom:1px solid #dce6d8;transform:translateX(-50%) rotate(45deg)}
.reader-inline-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reader-inline-top strong{font-size:19px}
.reader-inline-phonetic,.reader-inline-ref{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.reader-inline-meaning{display:block;font-size:14px;font-weight:650;margin-top:5px}
.reader-inline-detail .reader-ratings{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px}
.reader-inline-detail .reader-rating{padding:8px 2px;font-size:11px}
.reader-inline-actions{display:block;margin-top:8px}
.reader-inline-actions .btn{width:100%;min-height:36px;padding:8px;font-size:12px}
.reader-levels{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.reader-level{border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:7px 11px;font-size:11px}
.reader-level.active{background:var(--green);border-color:var(--green);color:white}
.reader-ratings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.reader-rating{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 7px;font-size:12px;color:var(--ink)}
.reader-rating.active{border-color:#789c76;background:#edf5eb;color:#315b35;font-weight:750}
.reader-stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:8px 0}
@media(max-width:620px){.reader-verse{font-size:16px;line-height:2.05}.reader-article{padding:17px 14px}}
.review-session-track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.review-session-track span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .2s}

/* Word morphology colors: prefix / root / suffix / inflection */
.morph-part{display:inline-block;white-space:pre}
.morph-prefix{color:#8B5CC7}
.morph-root{color:#3285C8}
.morph-suffix{color:#D88943}
.morph-ending{color:#16845B}
.morphology-content{padding:4px 0 2px}
.morphology-formula-label{font-size:11px;font-weight:750;color:var(--muted);margin:8px 0 5px}
.morphology-formula{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:20px;font-weight:800;line-height:1.5}
.morphology-plus{font-size:14px;color:var(--muted);font-weight:500}
.morphology-section{margin-top:14px}
.morphology-section h4{font-size:12px;margin:0 0 8px;color:var(--ink)}
.morphology-index{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:10px;color:var(--muted);flex:none}
.morphology-role{font-size:10px;color:var(--muted);min-width:66px}
.morphology-part-meaning{font-size:12px;color:var(--ink);line-height:1.5}
.morphology-muted{font-size:12px;line-height:1.7;color:var(--muted);margin:0}
.morphology-empty{padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;margin-top:10px}
.morphology-empty strong{font-size:12px}
.morphology-empty p{font-size:12px;line-height:1.7;color:var(--muted);margin:6px 0 0}
.morphology-context{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;font-size:12px;line-height:1.6}
.morphology-context strong{color:var(--muted);font-size:10px}
.morphology-translation{color:var(--muted)}
.morphology-details{width:100%;margin-top:13px;text-align:left;border-top:1px solid var(--line);padding-top:10px;color:var(--ink)}
.morphology-details summary{cursor:pointer;list-style:none;font-size:12px;font-weight:750;color:var(--green2);padding:5px 0;user-select:none}
.morphology-details summary::-webkit-details-marker{display:none}
.morphology-details summary:after{content:'＋';float:right;color:var(--muted)}
.morphology-details[open] summary:after{content:'－'}
.morphology-parts{display:grid;gap:7px;margin-top:10px}
.morphology-part{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.5}
.morphology-part strong{font-size:14px;min-width:76px}
.morphology-note{font-size:12px;line-height:1.65;color:var(--muted);margin:9px 0 0}
.morphology-family{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.morphology-family-item{background:#f6f8f4;border:1px solid #edf0e9;border-radius:10px;padding:8px 10px;min-width:calc(50% - 4px);flex:1}
.morphology-family-word{font-size:15px;font-weight:750;overflow-wrap:anywhere}
.morphology-family-meaning{font-size:10px;color:var(--muted);margin-top:3px}
.morphology-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:10px;color:var(--muted)}
.morphology-legend span:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:currentColor}

.morphology-inline{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 7px;margin:9px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;line-height:1.65;color:var(--muted)}.morphology-inline-label{font-size:12px;flex:none;color:var(--muted)}.morph-inline-hint{font-size:12px;color:var(--muted);margin-left:2px}.morphology-inline .morphology-plus{margin:0 1px}

/* Stubborn-word matching game */
.reinforce-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin:8px 0 14px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.reinforce-banner p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.reinforce-banner .btn{flex:none}
.reinforce-card{padding:18px}

  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });

async function readTtsCache(key){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readonly'),req=tx.objectStore('audio').get(key);
  req.onsuccess=()=>{const item=req.result;resolve(item?.blob||null);db.close()};
  req.onerror=()=>{db.close();reject(req.error)};
 });
}
async function writeTtsCache(key,blob){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio');
  store.put({key,blob,used:Date.now()});
  tx.oncomplete=()=>{
   db.close();
   trimTtsCache().catch(()=>{});
   resolve();
  };
  tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function trimTtsCache(){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio'),items=[];
  const req=store.openCursor();
  req.onsuccess=()=>{const cursor=req.result;if(cursor){items.push({key:cursor.key,used:cursor.value.used||0});cursor.continue()}else{
   items.sort((a,b)=>b.used-a.used);items.slice(80).forEach(x=>store.delete(x.key));
  }};
  tx.oncomplete=()=>{db.close();resolve()};
  tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function say(text){
 const phrase=String(text||'').trim();
 if(!phrase)return;
 if(currentTtsAudio){currentTtsAudio.pause();currentTtsAudio=null}
 if(currentTtsSource){try{currentTtsSource.stop()}catch(e){}currentTtsSource=null}
 if(currentTtsObjectUrl){URL.revokeObjectURL(currentTtsObjectUrl);currentTtsObjectUrl=null}
 if(window.speechSynthesis)window.speechSynthesis.cancel();

 // Unlock Web Audio synchronously during the user's tap on iOS.
 const audioContext=getTtsAudioContext();
 let unlockPromise=Promise.resolve();
 if(audioContext&&audioContext.state!=='running'){
  try{unlockPromise=audioContext.resume()}catch(e){unlockPromise=Promise.reject(e)}
 }

 const key=phrase.toLowerCase();
 try{
  let blob=null;

  // A local cache failure must never prevent a fresh request to the TTS service.
  try{blob=await readTtsCache(key)}catch(cacheError){
   console.warn('TTS local cache unavailable; requesting fresh audio.',cacheError);
  }

  if(!blob){
   let response;
   try{
    response=await fetch(TTS_API_URL,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({text:phrase})
    });
   }catch(networkError){
    throw new Error('连接语音服务失败：'+(networkError.message||'网络或跨域错误'));
   }

   if(!response.ok){
    const detail=(await response.text()).slice(0,180);
    throw new Error('语音服务返回 HTTP '+response.status+(detail?'：'+detail:''));
   }

   const contentType=response.headers.get('Content-Type')||'';
   if(!contentType.toLowerCase().includes('audio')){
    const detail=(await response.text()).slice(0,180);
    throw new Error('服务返回的不是音频（'+(contentType||'无 Content-Type')+'）'+(detail?'：'+detail:''));
   }

   blob=await response.blob();
   if(!blob.size)throw new Error('语音服务返回了空音频');
   writeTtsCache(key,blob).catch(error=>console.warn('TTS cache write failed:',error));
  }

  if(!blob||!blob.size)throw new Error('本地音频缓存为空');

  if(audioContext){
   await unlockPromise;
   if(audioContext.state!=='running')await audioContext.resume();
   if(audioContext.state!=='running')throw new Error('iPhone 音频通道未解锁（AudioContext: '+audioContext.state+'）');
   const buffer=await audioContext.decodeAudioData(await blob.arrayBuffer());
   if(!buffer||!buffer.length)throw new Error('音频解码结果为空');
   const source=audioContext.createBufferSource();
   source.buffer=buffer;
   source.connect(audioContext.destination);
   currentTtsSource=source;
   source.onended=()=>{if(currentTtsSource===source)currentTtsSource=null};
   source.start(0);
  }else{
   const url=URL.createObjectURL(blob),audio=new Audio(url);
   currentTtsAudio=audio;
   currentTtsObjectUrl=url;
   audio.onended=()=>{
    if(currentTtsAudio===audio)currentTtsAudio=null;
    if(currentTtsObjectUrl===url){URL.revokeObjectURL(url);currentTtsObjectUrl=null}
   };
   await audio.play();
  }
 }catch(error){
  const message=error&&error.message?error.message:String(error);
  console.error('ElevenLabs TTS playback failed:',error);
  showToast('AI 发音失败：'+message+'；正在尝试系统语音');
  fallbackSay(phrase);
 }
}

async function lookupCustomWord(){let wordEl=document.getElementById('cw'),meaningEl=document.getElementById('cm'),phoneticEl=document.getElementById('cp'),exampleEl=document.getElementById('ce'),exampleZhEl=document.getElementById('cz'),button=document.querySelector('[data-action="lookup-word"]');let word=wordEl?wordEl.value.trim():'';if(!word){showToast('请先输入英文单词');wordEl&&wordEl.focus();return}if(!button)return;button.disabled=true;button.textContent='正在查询…';try{let entries=[],dictionaryError=null;try{let response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()));if(!response.ok)throw new Error('词典中暂未找到这个单词');let data=await response.json();if(Array.isArray(data))entries=data;else throw new Error('词典返回的数据格式不正确')}catch(error){dictionaryError=error}if(entries.length){let phonetic=entries.find(x=>x.phonetic)&&entries.find(x=>x.phonetic).phonetic||((entries.flatMap(x=>x.phonetics||[]).find(x=>x.text)||{}).text)||'';let definitions=[];entries.forEach(entry=>(entry.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{if(d.definition&&!definitions.some(x=>x.text===d.definition))definitions.push({part:m.partOfSpeech||'',text:d.definition,example:d.example||''})})));let chosen=definitions.slice(0,3);if(!chosen.length)throw new Error('词典没有提供可用释义');let englishMeaning=chosen.map(x=>(x.part?'['+x.part+'] ':'')+x.text).join('\n');let meaningTranslated=true;try{meaningEl.value=await translateCustomText(word)}catch(translationError){meaningEl.value=word;meaningTranslated=false}if(phoneticEl)phoneticEl.value=phonetic;let example=definitions.find(x=>x.example&&x.example.toLowerCase().includes(word.toLowerCase())),exampleTranslated=true;if(example){exampleEl.value=example.example;try{exampleZhEl.value=await translateCustomText(example.example)}catch(e){exampleZhEl.value='';exampleTranslated=false}}else{exampleEl.value='';exampleZhEl.value=''}if(!example)showToast('释义和音标已填入；词典暂无包含目标词的例句，请手动补充');else if(!meaningTranslated)showToast('已获取释义和例句，但中文释义翻译失败，请手动修改');else if(!exampleTranslated)showToast('已获取释义和例句，但例句中文翻译失败，请手动补充');else showToast('释义、音标和例句已自动填入')}else{let translated=await translateCustomText(word);meaningEl.value=translated;if(phoneticEl)phoneticEl.value='';exampleEl.value='';exampleZhEl.value='';showToast('已自动翻译词义；暂未找到词典例句，请手动补充')} }catch(error){showToast((error&&error.message)||'自动获取失败，请检查网络或手动填写')}finally{button.disabled=false;button.textContent='✨ 自动获取释义和例句'}}

function swipeDirection(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down')}
function paintSwipe(g,dx,dy){let card=g.area,dir=swipeDirection(dx,dy),angle=Math.max(-11,Math.min(11,dx*.04));if(g.lastDir!==dir){card.classList.remove('drag-right','drag-left','drag-up','drag-down');card.classList.add('drag-'+dir);g.lastDir=dir}card.style.transform='translate3d('+dx+'px,'+dy+'px,0) rotate('+angle+'deg)'}

document.addEventListener('pointercancel',()=>{if(swipeGesture)resetSwipe(swipeGesture);swipeGesture=null});

document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data.cards||!data.stats)throw new Error('invalid');state=Object.assign(blank(),data);save();render();showToast('备份导入成功')}catch(err){showToast('备份文件格式不正确')}};reader.readAsText(e.target.files[0])}else if(e.target.id==='importBible'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result),list=Array.isArray(data)?data:data.passages;if(!Array.isArray(list)||!list.length)throw new Error('invalid');let valid=list.filter(p=>p&&p.id&&p.title&&Array.isArray(p.verses)&&p.verses.length&&p.verses.every(v=>v.ref&&v.en&&v.zh));if(!valid.length)throw new Error('invalid');let merged=allPassages().filter(p=>!valid.some(v=>v.id===p.id));state.bible.extraPassages=merged.filter(p=>!BIBLE.some(b=>b.id===p.id)).concat(valid);state.bible.passage=valid[0].id;state.bible.verse=0;save();state.view='bible';render();showToast('已导入 '+valid.length+' 个经文段落')}catch(err){showToast('经文 JSON 格式不正确，请检查字段是否齐全')}};reader.readAsText(e.target.files[0])}});

 return id;
}
function queue(state){if(!activeRef||!connected||applyingRemote)return;clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{await setDoc(activeRef,{data:payloadFor(state),writer:clientId,clientUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}catch(e){console.error('Firebase sync write:',e);if(window.showToast)window.showToast('云端保存失败：'+e.message)}},1200)}
async function create(){const id=makeCode();await start(id,true);if(window.showToast)window.showToast('云端同步已开启');return id}
async function join(id){if(!/^[A-Za-z0-9_-]{43}$/.test(id))throw new Error('配对码格式不正确');await start(id,false);return id}
async function disconnect(){clearTimeout(writeTimer);if(unsubscribe)unsubscribe();unsubscribe=null;activeRef=null;connected=false;localStorage.removeItem('dailyEnglish.sync.v1')}
window.firebaseSync={create,join,disconnect,queue};
const saved=JSON.parse(localStorage.getItem('dailyEnglish.sync.v1')||'null');
if(saved&&saved.id)start(saved.id,false).catch(e=>{connected=false;console.error('Firebase sync startup:',e);if(window.showToast)window.showToast('云同步暂时无法连接：'+e.message)});
</script>
