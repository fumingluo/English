/* Compact non-home header and interactive review stages */
.topbar{height:48px}.shell.compact-page .hero,.shell.compact-page>#summaryStats{display:none}.shell.compact-page .topbar{height:44px}/* Typing-tutor style Bible practice */
.typing-stage{position:relative;border:1.5px solid #dfe6dc;border-radius:16px;background:#fbfcf9;padding:18px 15px;min-height:150px;overflow:hidden;cursor:text;}
.typing-display{position:relative;z-index:1;font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,5vw,23px);line-height:2.45;color:#9ba49a;white-space:normal;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;}

.typing-char.done{color:#4c7950;}

/* Compact Bible typing + mobile swipe cards */

.word-card[data-swipe-card].drag-right{background:#e8f5e8}.word-card[data-swipe-card].drag-left{background:#fff8e8}.word-card[data-swipe-card].drag-up{background:#fff0ed}.word-card[data-swipe-card].drag-down{background:#eef2f6}

.reader-token{cursor:pointer;margin:0 1px;padding:0 1px;border:0;background:transparent;color:inherit;font:inherit;line-height:inherit;border-radius:4px}.reader-token:hover,.reader-token.selected{background:#f5edcf;color:#765c20}.reader-token.status-familiar{color:#315b91}.reader-token.status-known{color:#426b45}.reader-token.status-fluent{color:#758276}

.reader-word{display:inline;border:0!important;border-radius:0!important;background:transparent!important;color:inherit;padding:0!important;margin:0 1px!important;font:inherit;font-weight:400;line-height:inherit;text-decoration:none!important;box-shadow:none!important;position:relative;z-index:1;transform:translateY(0) scale(1);transform-origin:center;transition:transform .18s cubic-bezier(.2,.75,.25,1),color .18s ease,text-shadow .18s ease;will-change:transform}

function prepareReinforcementRound(){
 const r=state.reinforce;
 const targets=(r.targetIds||[]).slice(Number(r.cursor)||0,(Number(r.cursor)||0)+4);
 if(!targets.length){r.roundComplete=true;return}
 const targetSet=new Set(r.targetIds||[]);
 const usedMeanings=new Set(targets.map(id=>String(wordById(id)?.meaning||'').trim().toLowerCase()).filter(Boolean));
 const usedWords=new Set(targets.map(id=>String(wordById(id)?.word||'').trim().toLowerCase()).filter(Boolean));
 const candidates=shuffleReinforceIds(allWords().filter(w=>!targets.includes(w.id)&&!targetSet.has(w.id)&&String(w.meaning||'').trim()&&((state.cards[w.id]&&state.cards[w.id].seen)||w.level===state.level)));
 const fillerIds=[];
 for(const word of candidates){
  const key=String(word.meaning||'').trim().toLowerCase();
  const wordKey=String(word.word||'').trim().toLowerCase();
  if(usedMeanings.has(key)||usedWords.has(wordKey))continue;
  usedMeanings.add(key);usedWords.add(wordKey);fillerIds.push(word.id);
  if(fillerIds.length>=4-targets.length)break;
 }
 if(fillerIds.length<4-targets.length){
  for(const word of shuffleReinforceIds(allWords().filter(w=>!targets.includes(w.id)&&!targetSet.has(w.id)&&!fillerIds.includes(w.id)&&String(w.meaning||'').trim()))){
   const key=String(word.meaning||'').trim().toLowerCase();
   const wordKey=String(word.word||'').trim().toLowerCase();
   if(usedMeanings.has(key)||usedWords.has(wordKey))continue;
   usedMeanings.add(key);usedWords.add(wordKey);fillerIds.push(word.id);
   if(fillerIds.length>=4-targets.length)break;

 r.roundTargetIds=targets;

 r.roundComplete=false;
}

async function readTtsCache(key){

async function writeTtsCache(key,blob){

  const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio');
  store.put({key,blob,used:Date.now()});

  };
  tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function trimTtsCache(){
 const db=await openTtsCache();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio'),items=[];
  const req=store.openCursor();
  req.onsuccess=()=>{const cursor=req.result;if(cursor){items.push({key:cursor.key,used:cursor.value.used||0});cursor.continue()}else{
   items.sort((a,b)=>b.used-a.used);items.slice(80).forEach(x=>store.delete(x.key));
  }};
  tx.oncomplete=()=>{db.close();resolve()};
  tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
let endPlayback=null;

async function say(text){

 if(currentTtsAudio){currentTtsAudio.pause();currentTtsAudio=null}
 if(currentTtsSource){try{currentTtsSource.stop()}catch(e){}currentTtsSource=null}
 if(currentTtsObjectUrl){URL.revokeObjectURL(currentTtsObjectUrl);currentTtsObjectUrl=null}
 if(window.speechSynthesis)window.speechSynthesis.cancel();

 // Browser speech synthesis is asynchronous: wait for onend before allowing
 // the playlist to continue to its next language segment.
 if(language==='zh-CN'){
  await fallbackSay(phrase,language,requestId);

 }

 const audioContext=getTtsAudioContext();
 let unlockPromise=Promise.resolve();
 if(audioContext&&audioContext.state!=='running'){
  try{unlockPromise=audioContext.resume()}catch(e){unlockPromise=Promise.reject(e)}
 }
 const key=language+'|'+phrase.toLowerCase();
 try{
  let blob=null;
  try{blob=await readTtsCache(key)}catch(cacheError){
   console.warn('TTS local cache unavailable; requesting fresh audio.',cacheError);
  }
  if(requestId!==ttsRequestId)return;
  if(!blob){
   let response;
   try{
    response=await fetch(TTS_API_URL,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({text:phrase,language:language.split('-')[0]})
    });
   }catch(networkError){throw new Error('连接语音服务失败：'+(networkError.message||'网络或跨域错误'))}

   if(!response.ok){
    const detail=(await response.text()).slice(0,180);
    if(requestId!==ttsRequestId)return;
    throw new Error('语音服务返回 HTTP '+response.status+(detail?'：'+detail:''));
   }
   const contentType=response.headers.get('Content-Type')||'';
   if(!contentType.toLowerCase().includes('audio')){
    const detail=(await response.text()).slice(0,180);
    if(requestId!==ttsRequestId)return;
    throw new Error('服务返回的不是音频（'+(contentType||'无 Content-Type')+'）'+(detail?'：'+detail:''));
   }
   blob=await response.blob();
   if(requestId!==ttsRequestId)return;
   if(!blob.size)throw new Error('语音服务返回了空音频');
   writeTtsCache(key,blob).catch(error=>console.warn('TTS cache write failed:',error));
  }
  if(!blob||!blob.size)throw new Error('本地音频缓存为空');
  if(audioContext){
   await unlockPromise;
   if(requestId!==ttsRequestId)return;
   if(audioContext.state!=='running')await audioContext.resume();
   if(requestId!==ttsRequestId)return;
   if(audioContext.state!=='running')throw new Error('音频通道未解锁（AudioContext: '+audioContext.state+'）');

   if(requestId!==ttsRequestId)return;
   if(!buffer||!buffer.length)throw new Error('音频解码结果为空');
   const source=audioContext.createBufferSource();

   await new Promise(resolve=>{
    let settled=false;
    const finish=()=>{if(settled)return;settled=true;if(currentTtsSource===source)currentTtsSource=null;if(endPlayback===finish)endPlayback=null;resolve()};
    endPlayback=finish;source.onended=finish;
    try{source.start(0)}catch(error){finish();throw error}
   });
  }else{
   const url=URL.createObjectURL(blob),audio=new Audio(url);
   currentTtsAudio=audio;currentTtsObjectUrl=url;

   });
  }
 }catch(error){
  if(requestId!==ttsRequestId)return;
  const message=error&&error.message?error.message:String(error);

  showToast('AI 发音失败：'+message+'；正在尝试系统语音');
  await fallbackSay(phrase,language,requestId);
 }
}

   if(!await audioSpeak(audioMeaning(w),token))break;

function listenWordWeight(w){
 const card=state.cards[w.id]||{};
 const listenMiss=Math.max(0,Number(card.listenWrongCount)||0)+Math.max(0,Number(card.listenSentenceWrongCount)||0);
 const studyMiss=Math.max(0,Number(card.struggleCount)||0);
 const unknownCount=Math.max(0,Number(card.unknownCount)||0);
 return 1+Math.min(18,listenMiss*3)+Math.min(15,studyMiss*3)+Math.min(8,unknownCount);
}
function pickWeightedListenWords(pool,count){
 const source=pool.slice(),chosen=[];
 while(source.length&&chosen.length<count){
  const weights=source.map(listenWordWeight);
  const total=weights.reduce((sum,n)=>sum+n,0);
  let roll=Math.random()*total,index=0;
  for(;index<weights.length-1;index++){roll-=weights[index];if(roll<0)break}
  chosen.push(source.splice(index,1)[0]);
 }
 return chosen;
}

function newQuestion(){
 const all=allWords().filter(w=>w&&w.id&&String(w.word||'').trim()&&String(w.meaning||'').trim());
 if(!all.length){showToast('词库为空，请先添加或导入单词');return}
 const mode=state.listenMode==='choice'?'word':state.listenMode;
 if(mode==='scenario'){
  const scenario=LISTEN_SCENARIOS[Math.floor(Math.random()*LISTEN_SCENARIOS.length)];
  const shuffled=scenario.options.map((o,i)=>Object.assign({},o,{_sourceIndex:i})).sort(()=>Math.random()-.5);
  question={mode:'scenario',context:scenario.context,prompt:scenario.prompt,promptZh:scenario.promptZh,options:shuffled,correctIndex:shuffled.findIndex(o=>o._sourceIndex===scenario.correctIndex),done:false,correct:false,selected:null};
  render();if(state.view==='listen')say(question.prompt);return;
 }
 const learned=all.filter(w=>state.cards[w.id]&&state.cards[w.id].seen);
 const base=learned.length?learned:all;
 let pool=base;
 const sentencePool=all.filter(w=>w.en&&String(w.en).trim()&&String(w.zh||'').trim());
 if(mode==='sentence'||mode==='shadow')pool=base.filter(w=>w.en&&String(w.en).trim()&&String(w.zh||'').trim());
 if(!pool.length&&(mode==='sentence'||mode==='shadow'))pool=sentencePool;
 if(!pool.length)pool=all;
 if(!pool.length){showToast('当前词库还没有带英文例句和中文翻译的词条');return}
 const word=pickWeightedListenWords(pool,1)[0];
 let optionsPool=(mode==='sentence'?sentencePool:learned).filter(w=>w.id!==word.id);
 if(optionsPool.length<3){const fallback=(mode==='sentence'?sentencePool:all).filter(w=>w.id!==word.id&&!optionsPool.some(x=>x.id===w.id));optionsPool=optionsPool.concat(fallback)}
 const options=[word].concat(pickWeightedListenWords(optionsPool,3));
 if(mode==='sentence'||mode==='shadow')question={mode,word,sentence:word.en,sentenceZh:word.zh,options:options.sort(()=>Math.random()-.5),revealed:false,done:false,correct:false,selected:null};
 else question={mode,word,options:options.sort(()=>Math.random()-.5),done:false,correct:false,selected:null};
 render();
 if(state.view==='listen')say(mode==='sentence'||mode==='shadow'?word.en:mode==='visual'?'':word.word);
}
function recordListenResult(q){
 state.listenStats=Object.assign(blank().listenStats,state.listenStats||{});
 const key=q.mode||'word',ok=!!q.correct;
 const pairs={word:['wordCorrect','wordWrong'],sentence:['sentenceCorrect','sentenceWrong'],visual:['visualCorrect','visualWrong'],scenario:['scenarioCorrect','scenarioWrong']};
 if(pairs[key])state.listenStats[pairs[key][ok?0:1]]=(Number(state.listenStats[pairs[key][ok?0:1]])||0)+1;
 if(key==='shadow'){
  state.listenStats.shadowAttempts=(Number(state.listenStats.shadowAttempts)||0)+1;
  if(ok)state.listenStats.shadowCompleted=(Number(state.listenStats.shadowCompleted)||0)+1;
 }
 if(q.word){
  const card=state.cards[q.word.id]||{};
  if(key==='shadow'){
   card.shadowingAttempts=(Number(card.shadowingAttempts)||0)+1;
   if(ok)card.shadowingCompleted=(Number(card.shadowingCompleted)||0)+1;
  }else{
   const field=key==='sentence'?'listenSentence':key==='visual'?'visual':'listen';
   const metric=field+(ok?'CorrectCount':'WrongCount');
   card[metric]=(Number(card[metric])||0)+1;
   if(key==='sentence'&&ok&&!q.revealed)card.listenSentenceUnassistedCorrectCount=(Number(card.listenSentenceUnassistedCorrectCount)||0)+1;
  }
  card.lastListenAt=new Date().toISOString();
  if(!ok)card.lastListenWrongAt=card.lastListenAt;
  state.cards[q.word.id]=card;
 }
}
function advanceListenAfterAnswer(q){
 if(!q||!q.correct)return;
 setTimeout(()=>{if(question===q&&q.done&&q.correct&&state.view==='listen')newQuestion()},650);
}
function allPassages(){let list=BIBLE.concat(Array.isArray(state.bible.extraPassages)?state.bible.extraPassages:[]);if(Array.isArray(state.bible.revelationVerses)&&state.bible.revelationVerses.length)list.push({id:'rev-all',title:'启示录 Revelation · 全书',verses:state.bible.revelationVerses});return list}function getPassage(){return allPassages().find(p=>p.id===state.bible.passage)||(state.bible.passage==='rev-all'?{id:'rev-all',title:'启示录 Revelation · 全书',verses:[]}:BIBLE[0])}function getVerse(){let p=getPassage();return p.verses.length?p.verses[Math.min(state.bible.verse,p.verses.length-1)]:null}
