<style>
:root{--ink:#202b20;--muted:#788078;--green:#263b29;--green2:#577b5b;--pale:#e5eee3;--paper:#f7f7f2;--line:#e9ece5;--shadow:0 8px 26px #1727170b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:0 14px calc(88px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.shell{max-width:680px;margin:auto}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.brand span{color:var(--green2)}.date-label,.muted{color:var(--muted)}.date-label{font-size:12px}.hero{padding:10px 2px 0}.eyebrow{font-size:11px;color:var(--green2);font-weight:800;letter-spacing:1px}.hero h1{font-size:clamp(25px,6vw,32px);line-height:1.3;margin:8px 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.stat{background:white;border-radius:15px;padding:11px 12px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.card{background:white;border-radius:20px;padding:20px 17px;margin-top:13px;box-shadow:var(--shadow)}.progress-wrap{display:flex;align-items:center;gap:10px;margin:17px 2px 8px;color:var(--muted);font-size:11px}.progress{height:7px;flex:1;background:#e5e8df;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green2);border-radius:99px;transition:width .3s}.word-card{text-align:center;padding:18px 17px 17px}.word-top,.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.word-top{color:var(--muted);font-size:11px}.tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:#f0f3ed;color:#5d705e;font-size:10px;font-weight:750}.word-line{display:flex;justify-content:center;align-items:center;gap:9px;margin:16px 0 2px}.word-button{border:0;background:transparent;color:var(--ink);font-size:clamp(34px,9vw,44px);font-weight:800;letter-spacing:-1px;padding:4px 0}.sound{border:0;background:var(--pale);color:var(--green);border-radius:50%;width:42px;height:42px;font-size:18px}.phonetic{color:#8a928a;font-size:13px}.meaning{font-size:20px;font-weight:750;text-align:center;margin:0 0 12px}.answer{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);text-align:left}.example{padding:13px;background:#f8faf6;border-radius:13px;font-size:14px;line-height:1.65}.example-label{font-size:10px;color:var(--green2);font-weight:800;letter-spacing:.5px;margin-bottom:5px}.example p{margin:0}.example .zh{color:var(--muted);margin-top:4px}.play-example{border:0;background:transparent;color:var(--green2);font-size:12px;font-weight:700;padding:9px 2px 0}.actions{display:grid;gap:9px;margin-top:12px}.btn{border:0;border-radius:13px;padding:14px 15px;min-height:48px;font-weight:750}.btn-primary{background:var(--green);color:white}.btn-secondary{background:var(--pale);color:#426b45}.btn-quiet{background:#f1f3ef;color:#536153}.rating-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.rating{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 5px;color:var(--ink);font-size:13px;font-weight:750}.rating small{display:block;color:var(--muted);font-weight:500;margin-top:4px;font-size:10px}.section-title{font-size:19px;margin:0 0 5px}.section-sub{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 14px}.small{font-size:11px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.nav-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:#818981;border-radius:11px;padding:6px 2px;min-height:48px;font-size:10px}.nav button b{display:block;font-size:18px;font-weight:500}.nav button.active{background:#edf3ea;color:var(--green);font-weight:750}.panel{margin-top:12px}.field{width:100%;border:1px solid #dfe5dc;background:white;border-radius:12px;padding:12px;color:var(--ink);min-height:46px}.form-grid{display:grid;gap:11px}.label{display:block;font-weight:700;font-size:12px;margin:0 0 5px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs{display:flex;gap:7px;margin:8px 0 13px}.pill{border:0;background:#edf0ea;padding:9px 12px;border-radius:99px;font-size:11px;color:#586358}.pill.active{background:var(--green);color:white}.choice-list{display:grid;gap:8px;margin-top:12px}.choice{width:100%;min-height:46px;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;color:var(--ink)}.choice:disabled{cursor:default}.choice.correct{border-color:#88ad87;background:#edf6eb}.choice.wrong{border-color:#d4a39c;background:#fff2ef}.feedback{padding:11px;border-radius:12px;margin-top:10px;font-size:13px}.good{background:#edf6eb;color:#345a34}.bad{background:#fff2ef;color:#8a453d}.phrase-item{padding:13px 0;border-bottom:1px solid var(--line)}.phrase-item:last-child{border:0}.phrase-item p{margin:5px 0 0;color:var(--muted);font-size:12px}.danger{color:#a3483f;background:#fff0ee}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.empty h2{color:var(--ink);font-size:19px}.notice{font-size:11px;color:var(--muted);line-height:1.55}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.toggle-row input{width:20px;height:20px;accent-color:var(--green)}.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green);color:white;border-radius:99px;padding:10px 15px;font-size:12px;z-index:10;box-shadow:var(--shadow);white-space:nowrap}.hidden{display:none!important}@media(min-width:650px){body{padding-top:8px}.card{padding:22px}.word-card{padding:24px}.actions{grid-template-columns:1fr 1fr}}@media(max-width:360px){body{padding-left:10px;padding-right:10px}.rating-grid{gap:5px}.rating{font-size:12px}}
</style>

<body>
<div class="shell">
  <div class="topbar"><div class="brand">Daily <span>English.</span></div><div class="date-label" id="dateLabel"></div></div>
  <div class="hero"><div class="eyebrow">A LITTLE EVERY DAY · 每日英语</div><h1>让英语，成为每天的好习惯。</h1><p id="planLine">为你安排今天的学习计划</p></div>
  <div class="stats-row" id="summaryStats"></div>
  <div id="app"></div>
</div>
<nav class="nav"><div class="nav-inner" id="nav"><button data-view="learn" class="active"><b>📖</b>单词</button><button data-view="listen"><b>🎧</b>听力</button><button data-view="speak"><b>🗣️</b>口语</button><button data-view="phrases"><b>✍️</b>我的词组</button><button data-view="stats"><b>📊</b>记录</button></div></nav>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const WORDS=[
{id:'actually',word:'Actually',phonetic:'/ˈæk.tʃu.ə.li/',meaning:'实际上；事实上',level:'初级',category:'常见词',en:'Actually, I’m free this afternoon.',zh:'事实上，我今天下午有空。'},
{id:'improve',word:'Improve',phonetic:'/ɪmˈpruːv/',meaning:'提高；改善',level:'初级',category:'常见词',en:'I’m trying to improve my English.',zh:'我正在努力提高英语。'},
{id:'habit',word:'Habit',phonetic:'/ˈhæb.ɪt/',meaning:'习惯',level:'初级',category:'常见词',en:'I have a habit of reading before bed.',zh:'我有睡前阅读的习惯。'},
{id:'focus',word:'Focus',phonetic:'/ˈfoʊ.kəs/',meaning:'专注；焦点',level:'初级',category:'常见词',en:'I can’t focus with all this noise.',zh:'这么吵我没法集中注意力。'},
{id:'available',word:'Available',phonetic:'/əˈveɪ.lə.bəl/',meaning:'有空的；可获得的',level:'初级',category:'常见词',en:'Are you free for lunch tomorrow?',zh:'你明天有空一起吃午饭吗？'},
{id:'probably',word:'Probably',phonetic:'/ˈprɑː.bə.bli/',meaning:'很可能；大概',level:'初级',category:'常见词',en:'I’ll probably take the train.',zh:'我大概会坐火车。'},
{id:'decide',word:'Decide',phonetic:'/dɪˈsaɪd/',meaning:'决定',level:'初级',category:'常见词',en:'I can’t decide what to order.',zh:'我不知道该点什么。'},
{id:'experience',word:'Experience',phonetic:'/ɪkˈspɪr.i.əns/',meaning:'经验；经历',level:'初级',category:'常见词',en:'Do you have customer service experience?',zh:'你有客户服务方面的经验吗？'},
{id:'confident',word:'Confident',phonetic:'/ˈkɑːn.fə.dənt/',meaning:'自信的；确信的',level:'初级',category:'常见词',en:'I feel more confident speaking English now.',zh:'我现在说英语更有自信了。'},
{id:'opportunity',word:'Opportunity',phonetic:'/ˌɑː.pɚˈtuː.nə.t̬i/',meaning:'机会',level:'初级',category:'常见词',en:'This is a great opportunity to learn.',zh:'这是一个很好的学习机会。'},
{id:'prepare',word:'Prepare',phonetic:'/prɪˈper/',meaning:'准备；预备',level:'初级',category:'常见词',en:'I need to get ready for my meeting.',zh:'我得为会议做准备。'},
{id:'comfortable',word:'Comfortable',phonetic:'/ˈkʌm.fɚ.t̬ə.bəl/',meaning:'舒服的；自在的',level:'初级',category:'常见词',en:'These shoes are really comfortable.',zh:'这双鞋真的很舒服。'},
{id:'consider',word:'Consider',phonetic:'/kənˈsɪd.ɚ/',meaning:'考虑；认为',level:'中级',category:'常见词',en:'I’ll think about your suggestion.',zh:'我会考虑你的建议。'},
{id:'recommend',word:'Recommend',phonetic:'/ˌrek.əˈmend/',meaning:'推荐；建议',level:'中级',category:'常见词',en:'Can you recommend a good coffee shop?',zh:'你能推荐一家不错的咖啡店吗？'},
{id:'require',word:'Require',phonetic:'/rɪˈkwaɪr/',meaning:'需要；要求',level:'中级',category:'常见词',en:'This job requires strong communication skills.',zh:'这份工作需要很强的沟通能力。'},
{id:'effective',word:'Effective',phonetic:'/ɪˈfek.tɪv/',meaning:'有效的',level:'中级',category:'词缀：-ive',en:'This is an effective way to save time.',zh:'这是节省时间的有效方法。'},
{id:'careless',word:'Careless',phonetic:'/ˈker.ləs/',meaning:'粗心的；不小心的',level:'中级',category:'词缀：-less',en:'I made a careless mistake on the form.',zh:'我在表格上犯了个粗心的错误。'},
{id:'preview',word:'Preview',phonetic:'/ˈpriː.vjuː/',meaning:'预览；预告',level:'中级',category:'词缀：pre-',en:'Can I take a quick look at the presentation first?',zh:'我可以先快速看一下演示文稿吗？'},
{id:'rewrite',word:'Rewrite',phonetic:'/ˌriːˈraɪt/',meaning:'重写；改写',level:'中级',category:'词缀：re-',en:'I need to rewrite this email.',zh:'我需要重写这封邮件。'},
{id:'transport',word:'Transport',phonetic:'/ˈtræn.spɔːrt/',meaning:'交通运输；运送',level:'中级',category:'词根：port（携带）',en:'Public transport is easy to use here.',zh:'这里的公共交通很方便。'},
{id:'predict',word:'Predict',phonetic:'/prɪˈdɪkt/',meaning:'预测；预言',level:'中级',category:'词根：dict（说）',en:'It’s hard to predict the weather.',zh:'天气很难预测。'},
{id:'flexible',word:'Flexible',phonetic:'/ˈflek.sə.bəl/',meaning:'灵活的；可变通的',level:'高级',category:'词缀：-ible',en:'My work schedule is pretty flexible.',zh:'我的工作时间比较灵活。'},
{id:'efficient',word:'Efficient',phonetic:'/ɪˈfɪʃ.ənt/',meaning:'效率高的；高效的',level:'高级',category:'词缀：-ent',en:'The new system saves us a lot of time.',zh:'新系统帮我们节省了很多时间。'},
{id:'negotiate',word:'Negotiate',phonetic:'/nɪˈɡoʊ.ʃi.eɪt/',meaning:'协商；谈判',level:'高级',category:'常见词',en:'Could we talk about a better price?',zh:'我们能谈谈更合适的价格吗？'},
{id:'substantial',word:'Substantial',phonetic:'/səbˈstæn.ʃəl/',meaning:'大量的；可观的；重要的',level:'高级',category:'词缀：-ial',en:'The project needs a substantial investment.',zh:'这个项目需要大量投资。'}];
const STORAGE_KEY='dailyEnglish.v2';
function dateString(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function today(){return dateString(new Date())}
function dateAfter(days){const d=new Date();d.setDate(d.getDate()+days);return dateString(d)}
function escapeHTML(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function defaultState(){return {level:'初级',autoPlay:false,view:'learn',cards:{},custom:[],daily:{date:'',ids:[],index:0},stats:{streak:0,lastStudy:'',unique:[],correct:0,attempts:0,studyDays:[]},listenMode:'choice'}}
function loadState(){try{var parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');if(!parsed||typeof parsed!=='object')return defaultState();var state=defaultState();state.level=parsed.level||state.level;state.autoPlay=!!parsed.autoPlay;state.view=parsed.view||state.view;state.cards=parsed.cards&&typeof parsed.cards==='object'?parsed.cards:{};state.custom=Array.isArray(parsed.custom)?parsed.custom:[];state.daily=Object.assign(state.daily,parsed.daily||{});state.stats=Object.assign(state.stats,parsed.stats||{});state.stats.unique=Array.isArray(state.stats.unique)?state.stats.unique:[];state.stats.studyDays=Array.isArray(state.stats.studyDays)?state.stats.studyDays:[];state.listenMode=parsed.listenMode||'choice';return state}catch(error){return defaultState()}}
var state=loadState();var listenQuestion=null;var currentSentence='';var toastTimer=null;
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){showToast('无法保存学习进度，请检查浏览器存储设置。')}}
function allWords(){return WORDS.concat(state.custom)}
function getWord(id){return allWords().find(function(word){return word.id===id})}
function showToast(message){var el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.add('hidden')},2200)}
function recordActivity(){var stats=state.stats;var todayValue=today();if(stats.lastStudy!==todayValue){stats.streak=stats.lastStudy===dateAfter(-1)?(stats.streak||0)+1:1;stats.lastStudy=todayValue}if(stats.studyDays.indexOf(todayValue)===-1)stats.studyDays.push(todayValue);saveState()}
function dueWords(){return allWords().filter(function(word){var card=state.cards[word.id];return card&&card.seen&&card.due<=today()})}
function getDailyWords(){if(state.daily.date!==today()){var due=dueWords();var fresh=allWords().filter(function(word){return !state.cards[word.id]||!state.cards[word.id].seen?word.level===state.level:false});var ids=due.slice(0,20).map(function(word){return word.id});fresh.slice(0,Math.max(0,20-ids.length)).forEach(function(word){ids.push(word.id)});state.daily={date:today(),ids:ids,index:0};saveState()}return state.daily.ids.map(getWord).filter(Boolean)}
function speak(text){if(!('speechSynthesis' in window)){showToast('此浏览器暂不支持语音播放');return}window.speechSynthesis.cancel();var utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=.88;var voices=window.speechSynthesis.getVoices();utterance.voice=voices.find(function(voice){return voice.lang==='en-US'})||null;window.speechSynthesis.speak(utterance)}
function renderHeader(){var d=new Date();document.getElementById('dateLabel').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});var learned=Object.keys(state.cards).filter(function(id){return state.cards[id]&&state.cards[id].seen}).length;var accuracy=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0;document.getElementById('summaryStats').innerHTML='<div class="stat"><strong>🔥 '+(state.stats.streak||0)+'</strong><span>连续学习天数</span></div><div class="stat"><strong>📚 '+learned+'</strong><span>累计学习词条</span></div><div class="stat"><strong>🎯 '+accuracy+'%</strong><span>练习正确率</span></div>';document.getElementById('planLine').textContent=state.level+'计划 · 待复习 '+dueWords().length+' 个 · 每日最多 20 个新词'}
function render(){renderHeader();document.querySelectorAll('#nav button').forEach(function(button){button.classList.toggle('active',button.dataset.view===state.view)});var views={learn:renderLearn,listen:renderListen,speak:renderSpeak,phrases:renderPhrases,stats:renderStats};(views[state.view]||renderLearn)(document.getElementById('app'))}
function renderLearn(app){var words=getDailyWords();var index=state.daily.index;var word=words[index];var content='';if(!word){content='<div class="card empty"><div style="font-size:34px">🎉</div><h2>今日学习完成</h2><p>太棒了，明天继续保持这个好习惯。</p><button class="btn btn-secondary" data-action="reset">重新浏览今日词汇</button></div>'}else{var card=state.cards[word.id]||{};var revealed=!!card.revealed;var percent=words.length?Math.round(index/words.length*100):0;content='<div class="progress-wrap"><span>今日进度</span><div class="progress"><div class="bar" style="width:'+percent+'%"></div></div><span>'+index+'/'+words.length+'</span></div><article class="card word-card"><div class="word-top"><span>'+(index+1)+' / '+words.length+(card.seen?' · 复习':'')+'</span><span class="tag">'+escapeHTML(word.level)+' · '+escapeHTML(word.category)+'</span></div><div class="word-line"><button class="word-button" data-action="say-word" data-id="'+escapeHTML(word.id)+'" aria-label="播放单词发音">'+escapeHTML(word.word)+'</button><button class="sound" data-action="say-word" data-id="'+escapeHTML(word.id)+'" aria-label="播放发音">🔊</button></div><div class="phonetic">'+escapeHTML(word.phonetic||'')+' · 美式发音</div>'+(revealed?'<div class="answer"><div class="meaning">'+escapeHTML(word.meaning)+'</div><div class="example"><div class="example-label">日常表达</div><p>'+escapeHTML(word.en||word.word)+'</p><p class="zh">'+escapeHTML(word.zh||word.meaning)+'</p><button class="play-example" data-action="say-example" data-id="'+escapeHTML(word.id)+'">🔊 播放例句</button></div></div>':'')+'</article>'+(revealed?'<div class="rating-grid" aria-label="选择掌握程度"><button class="rating" data-action="rate" data-rating="known">认识<small>7 天后复习</small></button><button class="rating" data-action="rate" data-rating="vague">模糊<small>明天复习</small></button><button class="rating" data-action="rate" data-rating="unknown">不认识<small>明天复习</small></button></div>':'<div class="actions"><button class="btn btn-primary" data-action="reveal">查看释义和例句</button></div>');if(state.autoPlay&&!card.autoSpoken){state.cards[word.id]=Object.assign({},card,{autoSpoken:true});saveState();setTimeout(function(){speak(word.word)},250)}}app.innerHTML=content+'<div class="card"><div class="row"><div><strong>今日计划</strong><div class="small muted" style="margin-top:4px">优先复习到期词汇，再学习新词</div></div><span class="tag">待复习 '+dueWords().length+'</span></div></div><div class="card row"><div><strong>学习设置</strong><div class="small muted" style="margin-top:4px">'+escapeHTML(state.level)+' · 自动发音'+(state.autoPlay?'开启':'关闭')+'</div></div><button class="btn btn-quiet" style="min-height:40px;padding:8px 12px" data-action="settings">设置</button></div>'}
function renderListen(app){app.innerHTML='<section class="panel"><div class="card"><h2 class="section-title">听力训练</h2><p class="section-sub">听清楚再作答，练习结果会计入正确率。</p><div class="tabs"><button class="pill '+(state.listenMode==='choice'?'active':'')+'" data-action="listen-mode" data-mode="choice">听音选中文</button><button class="pill '+(state.listenMode==='dictation'?'active':'')+'" data-action="listen-mode" data-mode="dictation">听写单词</button></div>'+(listenQuestion?renderQuestion():'<div class="empty">🎧<p>准备好开始了吗？</p><button class="btn btn-primary" data-action="start-listen">开始练习</button></div>')+'</div></section>'}
function renderQuestion(){var q=listenQuestion;if(state.listenMode==='choice'){return '<button class="btn btn-secondary" style="width:100%" data-action="play-question">▶ 播放英文</button><div class="choice-list">'+q.options.map(function(option){var cls=q.done?(option.id===q.word.id?'correct':option.id===q.selected?'wrong':''):'';return '<button class="choice '+cls+'" data-action="choose" data-id="'+escapeHTML(option.id)+'" '+(q.done?'disabled':'')+'>'+escapeHTML(option.meaning)+'</button>'}).join('')+'</div>'+(q.done?'<div class="feedback '+(q.correct?'good':'bad')+'">'+(q.correct?'回答正确！':'再听一遍也没关系。')+' '+escapeHTML(q.word.word)+' · '+escapeHTML(q.word.meaning)+'</div><button class="btn btn-primary" style="width:100%;margin-top:10px" data-action="next-question">下一题</button>':'')}return '<button class="btn btn-secondary" style="width:100%" data-action="play-question">▶ 播放单词</button><div class="form-grid" style="margin-top:13px"><label class="label" for="dictation">听音输入英文单词</label><input id="dictation" class="field" autocomplete="off" autocapitalize="none" placeholder="Type what you hear" '+(q.done?'disabled':'')+' value="'+escapeHTML(q.input)+'"><button class="btn btn-primary" data-action="check-dictation" '+(q.done?'disabled':'')+'>检查答案</button></div>'+(q.done?'<div class="feedback '+(q.correct?'good':'bad')+'">'+(q.correct?'拼写正确！':'正确拼写：')+' <strong>'+escapeHTML(q.word.word)+'</strong></div><button class="btn btn-primary" style="width:100%;margin-top:10px" data-action="next-question">下一题</button>':'')}
function startQuestion(){var words=allWords();var word=words[Math.floor(Math.random()*words.length)];var other=words.filter(function(item){return item.id!==word.id}).sort(function(){return Math.random()-.5}).slice(0,3);listenQuestion={word:word,options:[word].concat(other).sort(function(){return Math.random()-.5}),done:false,correct:false,input:'',selected:''};render()}
function renderSpeak(app){if(!currentSentence){var words=allWords();var word=words[Math.floor(Math.random()*words.length)];currentSentence=word.en||word.word}var supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);app.innerHTML='<section class="panel"><div class="card"><h2 class="section-title">口语跟读</h2><p class="section-sub">先听示范，再大声跟读。允许麦克风权限后，可查看识别结果。</p><div class="example" style="text-align:center;padding:19px 13px"><div class="example-label">DAILY EXPRESSION</div><div style="font-size:20px;font-weight:750;line-height:1.5">'+escapeHTML(currentSentence)+'</div></div><div class="actions"><button class="btn btn-secondary" data-action="play-sentence">🔊 听示范</button><button class="btn btn-primary" data-action="record-speech">🎙️ 开始跟读</button></div><div id="speechResult" class="feedback hidden"></div><p class="notice">'+(supported?'语音识别由浏览器提供，效果取决于设备与环境。':'此浏览器不支持语音识别，仍可播放并自行跟读。')+'</p><button class="btn btn-quiet" style="width:100%" data-action="new-sentence">换一句</button></div></section>'}
function renderPhrases(app){app.innerHTML='<section class="panel"><div class="card"><h2 class="section-title">我的记忆词组</h2><p class="section-sub">添加个人词汇；保存后会加入词库和复习计划。</p><form id="phraseForm" class="form-grid"><div><label class="label" for="customWord">英文单词 / 词组</label><input class="field" id="customWord" required maxlength="60" placeholder="例如：Could you give me a hand?"></div><div><label class="label" for="customMeaning">中文释义</label><input class="field" id="customMeaning" required maxlength="100" placeholder="例如：你能帮我一下吗？"></div><div class="two-col"><div><label class="label" for="customLevel">学习难度</label><select class="field" id="customLevel"><option>初级</option><option>中级</option><option>高级</option></select></div><div><label class="label" for="customCategory">分类</label><select class="field" id="customCategory"><option>自定义词组</option><option>旅行</option><option>工作</option><option>日常交流</option></select></div></div><div><label class="label" for="customEn">例句（英文，可选）</label><input class="field" id="customEn" maxlength="160" placeholder="添加一个生活场景"></div><div><label class="label" for="customZh">例句中文（可选）</label><input class="field" id="customZh" maxlength="160" placeholder="填写例句翻译"></div><button class="btn btn-primary">＋ 保存到我的词库</button></form></div><div class="card"><div class="row"><strong>已保存词组</strong><span class="tag">'+state.custom.length+' 条</span></div>'+(state.custom.length?state.custom.slice().reverse().map(function(word){return '<div class="phrase-item"><div class="row"><strong>'+escapeHTML(word.word)+'</strong><button class="btn danger" style="min-height:34px;padding:6px 10px" data-action="delete-phrase" data-id="'+escapeHTML(word.id)+'">删除</button></div><p>'+escapeHTML(word.meaning)+' · '+escapeHTML(word.level)+' · '+escapeHTML(word.category)+'</p></div>'}).join(''):'<div class="empty">还没有自定义词组，添加第一条吧。</div>')+'</div></section>'}
function renderStats(app){var learned=Object.keys(state.cards).filter(function(id){return state.cards[id]&&state.cards[id].seen}).length;var accuracy=state.stats.attempts?Math.round(state.stats.correct/state.stats.attempts*100):0;var days=state.stats.studyDays.slice(-7).reverse();app.innerHTML='<section class="panel"><div class="card"><h2 class="section-title">你的学习记录</h2><p class="section-sub">进度保存在当前浏览器中；清除浏览器数据可能导致记录丢失。</p><div class="stats-row" style="margin-bottom:0"><div class="stat"><strong>🔥 '+(state.stats.streak||0)+'</strong><span>连续天数</span></div><div class="stat"><strong>📚 '+learned+'</strong><span>学过的词条</span></div><div class="stat"><strong>🎯 '+accuracy+'%</strong><span>正确率</span></div></div></div><div class="card"><strong>最近学习</strong>'+(days.length?days.map(function(day){return '<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>'+escapeHTML(day)+'</span><span class="tag">已学习</span></div>'}).join(''):'<p class="small muted">开始学习后，这里会显示学习日期。</p>')+'</div><div class="card row"><div><strong>学习水平与发音</strong><div class="small muted" style="margin-top:4px">'+escapeHTML(state.level)+' · 自动播放'+(state.autoPlay?'开启':'关闭')+'</div></div><button class="btn btn-quiet" style="min-height:40px;padding:8px 12px" data-action="settings">设置</button></div><div class="card"><div class="row"><span class="muted">练习题数</span><strong>'+state.stats.attempts+'</strong></div><div class="row" style="margin-top:10px"><span class="muted">答对题数</span><strong>'+state.stats.correct+'</strong></div><div class="row" style="margin-top:10px"><span class="muted">待复习</span><strong>'+dueWords().length+'</strong></div></div></section>'}
function renderSettings(){document.getElementById('app').innerHTML='<section class="panel"><div class="card"><div class="row"><h2 class="section-title">学习设置</h2><button class="btn btn-quiet" style="min-height:38px;padding:7px 11px" data-action="close-settings">完成</button></div><p class="section-sub">按英语水平安排新词；复习词会优先出现。</p><label class="label" for="levelSelect">当前英语水平</label><select id="levelSelect" class="field"><option '+(state.level==='初级'?'selected':'')+'>初级</option><option '+(state.level==='中级'?'selected':'')+'>中级</option><option '+(state.level==='高级'?'selected':'')+'>高级</option></select><div class="toggle-row"><div><strong>自动播放单词发音</strong><div class="small muted">进入词卡时播放美式发音</div></div><input id="autoPlayToggle" type="checkbox" '+(state.autoPlay?'checked':'')+'></div><p class="notice">发音使用设备浏览器提供的英语语音。首次播放可能需要点击页面。</p><button class="btn btn-primary" style="width:100%" data-action="save-settings">保存设置</button></div></section>'}
function rateWord(rating){var word=getDailyWords()[state.daily.index];if(!word)return;var previous=state.cards[word.id]||{};var interval=rating==='known'?(previous.seen?14:7):1;state.cards[word.id]=Object.assign({},previous,{seen:true,due:dateAfter(interval),rating:rating,reviewedAt:today(),revealed:false,autoSpoken:false});if(state.stats.unique.indexOf(word.id)===-1)state.stats.unique.push(word.id);state.daily.index++;recordActivity();render()}
function beginSpeechRecognition(){var Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){showToast('当前浏览器不支持语音识别');return}try{var recognition=new Recognition();recognition.lang='en-US';recognition.interimResults=false;var result=document.getElementById('speechResult');result.textContent='正在聆听，请开始跟读…';result.classList.remove('hidden','good','bad');recognition.onresult=function(event){var transcript=event.results[0][0].transcript;var matched=transcript.toLowerCase().replace(/[^a-z]/g,'')===currentSentence.toLowerCase().replace(/[^a-z]/g,'');result.textContent=(matched?'跟读完成！':'识别结果：')+transcript;result.classList.add(matched?'good':'bad');recordActivity()};recognition.onerror=function(){result.textContent='没有识别到语音，请检查麦克风权限。';result.classList.add('bad')};recognition.start()}catch(error){showToast('无法启动麦克风，请检查浏览器权限')}}
function handleAction(button){var action=button.dataset.action;if(action==='say-word'){var word=getWord(button.dataset.id);if(word)speak(word.word)}else if(action==='say-example'){var example=getWord(button.dataset.id);if(example)speak(example.en||example.word)}else if(action==='reveal'){var wordToReveal=getDailyWords()[state.daily.index];if(wordToReveal){state.cards[wordToReveal.id]=Object.assign({},state.cards[wordToReveal.id]||{},{revealed:true});saveState();render()}}else if(action==='rate')rateWord(button.dataset.rating);else if(action==='reset'){state.daily.index=0;render()}else if(action==='settings')renderSettings();else if(action==='close-settings'){state.view='learn';saveState();render()}else if(action==='save-settings'){state.level=document.getElementById('levelSelect').value;state.autoPlay=document.getElementById('autoPlayToggle').checked;state.daily.date='';saveState();showToast('设置已保存');render()}else if(action==='listen-mode'){state.listenMode=button.dataset.mode;listenQuestion=null;saveState();render()}else if(action==='start-listen')startQuestion();else if(action==='play-question'&&listenQuestion)speak(listenQuestion.word.word);else if(action==='choose'&&listenQuestion&&!listenQuestion.done){listenQuestion.selected=button.dataset.id;listenQuestion.correct=listenQuestion.selected===listenQuestion.word.id;listenQuestion.done=true;state.stats.attempts++;if(listenQuestion.correct)state.stats.correct++;recordActivity();render()}else if(action==='next-question')startQuestion();else if(action==='check-dictation'&&listenQuestion&&!listenQuestion.done){var input=document.getElementById('dictation').value.trim().toLowerCase().replace(/[^a-z']/g,'');listenQuestion.input=input;listenQuestion.correct=input===listenQuestion.word.word.toLowerCase().replace(/[^a-z']/g,'');listenQuestion.done=true;state.stats.attempts++;if(listenQuestion.correct)state.stats.correct++;recordActivity();render()}else if(action==='play-sentence')speak(currentSentence);else if(action==='record-speech')beginSpeechRecognition();else if(action==='new-sentence'){currentSentence='';render()}else if(action==='delete-phrase'){var customWord=getWord(button.dataset.id);if(!customWord||!customWord.isCustom)return;if(!window.confirm('确定删除“'+customWord.word+'”吗？'))return;state.custom=state.custom.filter(function(item){return item.id!==customWord.id});delete state.cards[customWord.id];state.daily.date='';saveState();render()}}
document.getElementById('nav').addEventListener('click',function(event){var button=event.target.closest('button[data-view]');if(!button)return;listenQuestion=null;state.view=button.dataset.view;saveState();render()});
document.getElementById('app').addEventListener('click',function(event){var button=event.target.closest('[data-action]');if(button)handleAction(button)});
document.getElementById('app').addEventListener('submit',function(event){if(event.target.id!=='phraseForm')return;event.preventDefault();var form=new FormData(event.target);var wordText=String(form.get('customWord')).trim();var meaning=String(form.get('customMeaning')).trim();var englishExample=String(form.get('customEn')||'').trim();var chineseExample=String(form.get('customZh')||'').trim();state.custom.push({id:'custom-'+Date.now(),word:wordText,phonetic:'',meaning:meaning,level:String(form.get('customLevel')),category:String(form.get('customCategory')),en:englishExample||wordText,zh:chineseExample||meaning,isCustom:true});saveState();recordActivity();showToast('已添加到个人词库');render()});
render();
</script>
